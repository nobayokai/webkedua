<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
    /* DESAIN DASHBOARD SUPERVISI PREMIUM */
    .sup-container { background: #ffffff; border-radius: 24px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); font-family: 'Arial', sans-serif; }
    .sup-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f3f4f6; padding-bottom: 20px; margin-bottom: 25px; flex-wrap: wrap; gap:10px;}
    .sup-title { font-size: 24px; font-weight: 800; color: #1f2937; margin: 0; }
    
    .sup-btn { padding: 8px 14px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; background: #10b981; transition: all 0.2s; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;}
    .sup-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .sup-btn.blue { background: #3b82f6; } .sup-btn.orange { background: #f59e0b; } .sup-btn.red { background: #ef4444; } .sup-btn.gray { background: #6b7280; }
    .sup-btn.outline { background: transparent; color: #374151; border: 1px solid #d1d5db; box-shadow: none; }
    
    .sup-upload-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 16px; padding: 25px; margin-bottom: 25px; }
    .sup-form-group { margin-bottom: 15px; }
    .sup-form-group label { display: block; font-weight: bold; font-size: 13px; color: #475569; margin-bottom: 8px; }
    .sup-form-group select, .sup-form-group input, .sup-form-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; box-sizing: border-box; font-family:inherit;}

    .sup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
    .sup-card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; position: relative;}
    .sup-badge { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; color: white;}
    .sup-badge.wait { background: #f59e0b; } .sup-badge.acc { background: #10b981; } .sup-badge.reject { background: #ef4444; }
    .alasan-box { background: #fee2e2; border-left: 3px solid #ef4444; padding: 8px 10px; margin-top: 10px; border-radius: 4px; font-size: 11px; color: #991b1b;}

    /* AREA VIRTUAL PAPAN TTD */
    #pdf-virtual-area { position: relative; width: 100%; max-width: 420px; height: auto; min-height: 200px; background: white; border: 2px solid #e2e8f0; margin: 0 auto; overflow: hidden; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    #pdf-canvas-preview { width: 100%; display: block; height: auto; } 
    
    .drag-ttd-item { position: absolute; width: 100px; cursor: grab; z-index: 10; padding: 4px; border: 2px dashed #3b82f6; border-radius:6px; background:rgba(255,255,255,0.45);}
    .drag-ttd-item:active { cursor: grabbing; border-color: #ef4444; background:rgba(255,255,255,0.8);}
    .btn-delete-ttd { position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; border-radius: 50%; width: 24px; height: 24px; text-align: center; line-height: 24px; cursor: pointer; font-size: 12px; font-weight:bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3);}

    .pdf-controls { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
    .pdf-controls span { font-weight: 800; color: #1e293b; font-size: 13px; }

    /* ANIMASI SPINNER LOCAL */
    .sup-db-spinner { border: 4px solid #f3f4f6; border-top: 4px solid #3b82f6; border-radius: 50%; width: 35px; height: 35px; animation: sup-spin-anime 1s linear infinite; margin: 0 auto 12px; }
    @keyframes sup-spin-anime { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<div class="sup-container">
    <div class="sup-header">
        <h2 class="sup-title">📂 Supervisi Administrasi</h2>
        <button class="sup-btn outline" id="btn-show-ttd" style="display:none;" onclick="document.getElementById('modal-set-ttd').style.display='flex'">⚙️ Stempel & TTD Lokal</button>
    </div>

    <div id="area-upload-guru" style="display:none;">
        <div class="sup-upload-box">
            <h3 style="margin-top:0;">⬆️ Upload Berkas</h3>
            <div class="sup-form-group">
                <label>Pilih Jenis Berkas</label>
                <select id="sup-jenis">
                    <option value="Modul Ajar">Modul Ajar</option>
                    <option value="Program Tahunan (Prota)">Program Tahunan (Prota)</option>

                </select>

                <label>Pilih File (Wajib PDF)</label>

    <h3 style="color:#334155; border-bottom: 2px dashed #e2e8f0; padding-bottom:10px;">📄 Daftar Berkas Supervisi</h3>
    <div class="sup-grid" id="list-dokumen-sup"></div>
</div>

<div class="modal" id="modal-acc" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center; backdrop-filter: blur(4px);">
    <div style="background:white; padding:20px; border-radius:12px; max-width:480px; width:95%; max-height:98vh; overflow-y:auto; box-shadow: 0 20px 50px rgba(0,0,0,0.2);">
        <h3 style="text-align:center; color:#047857; margin-top:0; margin-bottom:10px; font-weight:800;">✍️ Papan Penandatanganan</h3>
        
        <div class="pdf-controls">
            <button class="sup-btn gray" onclick="window.prevPdfPage()">◀ Sebelum</button>
            <span id="pdf-page-info">Halaman - / -</span>
            <button class="sup-btn gray" onclick="window.nextPdfPage()">Berikut ▶</button>

        <button class="sup-btn blue" style="display:block; margin:0 auto 15px; width:100%;" onclick="window.tambahTtdKeCanvas()">➕ Tambah TTD Di Halaman Ini</button>

            <div id="pdf-loading-text" style="padding: 50px 0; text-align:center; color:#3b82f6; font-weight:bold; font-size:14px;">
                ⏳ Memuat Dokumen...
            </div>
        </div>
        
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="sup-btn red" style="flex:1;" onclick="document.getElementById('modal-acc').style.display='none'">Batal</button>
            <button class="sup-btn" style="flex:2;" onclick="window.eksekusiAccDokumen()">✅ Terapkan & Simpan Final</button>
        </div>
    </div>
</div>

<div class="modal" id="modal-tolak" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:white; padding:25px; border-radius:12px; max-width:400px; width:90%; text-align:center;">
        <h3 style="color:#ef4444; margin-top:0; font-weight:800;">❌ Tolak Dokumen</h3>
        <textarea id="alasan-tolak" rows="4" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; font-family:inherit; margin-bottom:15px;" placeholder="Tuliskan keterangan revisi / alasan penolakan..."></textarea>
        <div style="display:flex; gap:10px;">
            <button class="sup-btn gray" style="flex:1;" onclick="document.getElementById('modal-tolak').style.display='none'">Batal</button>
            <button class="sup-btn red" style="flex:1;" onclick="window.eksekusiTolakDokumen()">Kirim Penolakan</button>
        </div>
    </div>
</div>

<div class="modal" id="modal-set-ttd" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:white; padding:25px; border-radius:12px; text-align:center; max-width:350px; width:90%;">
        <h3 style="color:#3b82f6; margin-top:0; font-weight:800;">⚙️ Upload TTD Lokal</h3>
        <p style="font-size:11px; color:#6b7280; margin-bottom:15px;">Gambar (.png transparan) hanya disimpan di memori *browser* perangkat Anda.</p>
        <input type="file" id="file-ttd" accept="image/png" style="width:100%; margin-bottom:15px; border:1px solid #ccc; padding:10px; border-radius:8px;">
        <button class="sup-btn blue" style="width:100%; padding:10px;" onclick="window.simpanTtdLokal()">💾 Simpan ke Memori</button>
        <button class="sup-btn outline" style="width:100%; margin-top:10px; padding:10px;" onclick="document.getElementById('modal-set-ttd').style.display='none'">Tutup</button>
    </div>
</div>

<script>
(function() {
    var API_URL = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : 'https://script.google.com/macros/s/AKfycbw72VAmuae0gBueTndaZpL8NrUJkl2K1M-lVpMJSUsMKBjo1o6Bafc5mdrzJXOH7toQBg/exec';
    
    var curUser = JSON.parse(localStorage.getItem('user_login') || '{}');
    var isKepsek = (curUser.jabatan === 'kepsek' || curUser.role === 'kepsek' || (curUser.nama && curUser.nama.toLowerCase().includes("kepala")));
    
    var activeDocId = "", activeDocUrl = "";
    
    window.tempPdfBase64 = null; 
    window.pdfDocProxy = null;
    window.currentPdfPage = 1;
    window.totalPdfPages = 1;
    window.signaturesByPage = {}; 

   window.ubahTeksLoading = function(teks){

    var loading = document.getElementById('ios-loading');
    var loadingText = document.querySelector('#ios-loading .ios-loading-text');

    if(loading){
        if(loadingText) loadingText.textContent = teks;
        loading.classList.add('active');
    }
}

window.tutupLoading = function(){

    var loading = document.getElementById('ios-loading');

    if(loading)
        loading.classList.remove('active');
}

    // Inisialisasi tampilan
    if (isKepsek) {
        document.getElementById('btn-show-ttd').style.display = 'inline-flex';
        document.getElementById('area-upload-guru').style.display = 'none';
    } else {
        document.getElementById('area-upload-guru').style.display = 'block';
    }

    window.loadDaftarSupervisi = async function() {
        var container = document.getElementById('list-dokumen-sup');
        if(!container) return;

        container.innerHTML = `
            <div style="text-align:center; padding:50px; width:100%; grid-column:1/-1;">
                <div class="sup-db-spinner"></div>
                <span style="color:#64748b; font-weight:bold; font-size:13px;">Menghubungkan ke database sekolah...</span>
            </div>
        `;

        window.ubahTeksLoading("Membaca Berkas Supervisi...");
        try {
            var res = await fetch(API_URL + "?action=get_supervisi");
            var json = await res.json();
            container.innerHTML = "";

            if(json.status === 'success') {
                var dataFiltered = isKepsek ? json.data : json.data.filter(d => d.nama === curUser.nama);
                if(dataFiltered.length === 0) {
                    container.innerHTML = "<p style='color:#9ca3af; text-align:center; width:100%; grid-column:1/-1;'>Belum ada dokumen supervisi.</p>"; 
                    tutupLoading(); return;
                }

                dataFiltered.reverse().forEach(d => {
                    var statusBersih = String(d.status).trim();
                    var isAcc = (statusBersih === 'Sudah ACC');
                    var isReject = (statusBersih === 'Ditolak');
                    var isWait = (statusBersih === 'Menunggu ACC');
                    
                    var badgeClass = isAcc ? 'acc' : (isReject ? 'reject' : 'wait');
                    var actionsHTML = "";
                    
                    if (isKepsek && isWait) {
                        actionsHTML = `
                            <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
                                <a href="${d.url_asli}" target="_blank" class="sup-btn blue" style="flex:1; text-decoration:none;">👀 Pratinjau</a>
                                <button class="sup-btn orange" style="flex:1;" onclick="window.bukaModalAcc('${d.id_dokumen}', '${d.url_asli}')">✍️ Sign Dokumen</button>
                                <button class="sup-btn red" style="flex:1;" onclick="window.bukaModalTolak('${d.id_dokumen}')">❌ Tolak</button>
                            </div>`;
                    } else if (isAcc) {
                        actionsHTML = `<div style="margin-top:12px;"><a href="${d.url_acc}" target="_blank" class="sup-btn" style="width:100%; text-decoration:none;">📄 Download PDF Final</a></div>`;
                    } else {
                        actionsHTML = `<div style="margin-top:12px;"><a href="${d.url_asli}" target="_blank" class="sup-btn blue" style="width:100%; text-decoration:none;">👀 Lihat Draft Berkas</a></div>`;
                    }

                    var alasanHTML = (isReject && d.alasan) ? `<div class="alasan-box"><b>Alasan Ditolak:</b> ${d.alasan}</div>` : "";

                    container.innerHTML += `
                        <div class="sup-card">
                            <div>
                                <div style="font-weight:900; font-size:15px; margin-bottom:5px;">${d.jenis}</div>
                                <div style="font-size:11px; color:#475569;">
                                    <b>Oleh:</b> ${d.nama} <br> 
                                    <b>Status:</b> <span class="sup-badge ${badgeClass}">${statusBersih}</span>
                                </div>
                                ${alasanHTML}
                            </div>
                            ${actionsHTML}
                        </div>`;
                });
            }
        } catch(e) { 
            console.error(e); 
            container.innerHTML = "<p style='color:#ef4444; text-align:center; width:100%;'>Gagal terhubung ke database sheet sekolah.</p>";
        } finally { 
            tutupLoading(); 
        }
    };

    window.prosesUploadDokumen = function(e) {
        e.preventDefault();
        var fileInput = document.getElementById('sup-file');
        if(fileInput.files.length === 0) return alert("Pilih file PDF!");
        
        window.ubahTeksLoading("Mengunggah Berkas ke Drive...");
        var reader = new FileReader();
        reader.onload = async function() {
            var payload = { action: "upload_supervisi", nama: curUser.nama, role: curUser.role, jenis: document.getElementById('sup-jenis').value, fileName: curUser.nama+".pdf", mimeType: "application/pdf", fileBase64: reader.result.split(',')[1] };
            try {
                await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                alert("✅ Berkas berhasil diunggah!"); fileInput.value = "";
                window.loadDaftarSupervisi();
            } catch(e) { alert("Gagal mengupload berkas."); tutupLoading(); }
        };
        reader.readAsDataURL(fileInput.files[0]);
    };

    window.simpanTtdLokal = function() {
        var f = document.getElementById('file-ttd');
        if (f.files.length === 0) return alert("Pilih gambar PNG transparan!");
        var r = new FileReader();
        r.onload = function(e) {
            localStorage.setItem('ttd_kepsek', e.target.result);
            alert("✅ Tanda Tangan berhasil disimpan secara lokal!");
            document.getElementById('modal-set-ttd').style.display = 'none';
        };
        r.readAsDataURL(f.files[0]);
    };

    window.bukaModalTolak = function(id) {
        activeDocId = id;
        document.getElementById('alasan-tolak').value = "";
        document.getElementById('modal-tolak').style.display = 'flex';
    };

    window.eksekusiTolakDokumen = async function() {
        var alasan = document.getElementById('alasan-tolak').value;
        if (!alasan) return alert("Harap isi alasan penolakan!");
        document.getElementById('modal-tolak').style.display = 'none';
        
        window.ubahTeksLoading("Mengirim Penolakan...");
        try {
            await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "reject_supervisi", id_dokumen: activeDocId, alasan: alasan }) });
            alert("❌ Dokumen berhasil ditolak/dikembalikan.");
            window.loadDaftarSupervisi();
        } catch(e) { alert("Gagal menolak dokumen."); tutupLoading(); }
    };

    window.bukaModalAcc = async function(id, url) {
        if(!localStorage.getItem('ttd_kepsek')) return alert("⚠️ Anda belum menyimpan gambar Stempel/TTD Lokal!");
        activeDocId = id; activeDocUrl = url;
        window.signaturesByPage = {}; 
        
        var area = document.getElementById('pdf-virtual-area');
        area.style.height = "250px"; 
        area.innerHTML = '<div id="pdf-loading-text" style="position:absolute; top:45%; width:100%; text-align:center; color:#3b82f6; font-weight:bold; font-size:14px; z-index:2;">⏳ Menarik Data Dokumen PDF...</div>';
        document.getElementById('modal-acc').style.display = 'flex';

        try {
            var resPdf = await fetch(API_URL + "?action=get_pdf_base64&url=" + encodeURIComponent(activeDocUrl.trim()));
            var jsonPdf = await resPdf.json();
            if(jsonPdf.status !== 'success') throw new Error("Gagal mengambil PDF asli.");
            
            window.tempPdfBase64 = jsonPdf.base64.replace(/\s/g, '');
            
            var pdfjsLib = window['pdfjs-dist/build/pdf'];
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            var pdfData = atob(window.tempPdfBase64);
            var uint8Array = new Uint8Array(pdfData.length);
            for (var i = 0; i < pdfData.length; i++) { uint8Array[i] = pdfData.charCodeAt(i); }

            window.pdfDocProxy = await pdfjsLib.getDocument({data: uint8Array}).promise;
            window.totalPdfPages = window.pdfDocProxy.numPages;
            window.currentPdfPage = 1; 
            
            await window.renderPdfPage(window.currentPdfPage);
        } catch(e) {
            console.error(e);
            area.innerHTML = '<div style="padding:40px; text-align:center; color:#ef4444; font-weight:bold;">❌ Gagal memuat pratinjau dokumen.</div>';
        }
    };

    window.renderPdfPage = async function(pageNum) {
        if(!window.pdfDocProxy) return;
        
        var area = document.getElementById('pdf-virtual-area');
        area.innerHTML = '<div style="padding:50px 0; text-align:center; color:#3b82f6; font-weight:bold; font-size:14px;">⏳ Memuat Halaman '+pageNum+'...</div>';
        
        var page = await window.pdfDocProxy.getPage(pageNum);
        var viewport = page.getViewport({scale: 1.2}); 
        
        var canvas = document.createElement('canvas');
        canvas.id = "pdf-canvas-preview";
        var context = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        
        await page.render({canvasContext: context, viewport: viewport}).promise;

        area.innerHTML = '';
        area.appendChild(canvas);
        
        setTimeout(() => {
            area.style.height = canvas.offsetHeight + 'px';
            window.loadPageSignatures(pageNum); 
        }, 120);
        
        document.getElementById('pdf-page-info').textContent = "Halaman " + pageNum + " dari " + window.totalPdfPages;
    };

    window.saveCurrentPageSignatures = function() {
        var items = document.querySelectorAll('.drag-ttd-item');
        var pageSigs = [];
        items.forEach(function(item) {
            pageSigs.push({
                left: item.style.left,
                top: item.style.top,
                width: item.offsetWidth,
                height: item.offsetHeight
            });
        });
        window.signaturesByPage[window.currentPdfPage] = pageSigs;
    };

    window.loadPageSignatures = function(pageNum) {
        var sigs = window.signaturesByPage[pageNum] || [];
        sigs.forEach(function(sig) {
            window.buatElemenTtd(sig.left, sig.top, sig.width, sig.height);
        });
    };

    window.prevPdfPage = function() {
        if (window.currentPdfPage <= 1) return;
        window.saveCurrentPageSignatures();
        window.currentPdfPage--;
        window.renderPdfPage(window.currentPdfPage);
    };
    
    window.nextPdfPage = function() {
        if (window.currentPdfPage >= window.totalPdfPages) return;
        window.saveCurrentPageSignatures();
        window.currentPdfPage++;
        window.renderPdfPage(window.currentPdfPage);
    };

    window.tambahTtdKeCanvas = function() {
        window.buatElemenTtd('35%', '35%', 100, 100);
    };

    window.buatElemenTtd = function(left, top, w, h) {
        var area = document.getElementById('pdf-virtual-area');
        var wrapper = document.createElement('div');
        wrapper.className = 'drag-ttd-item';
        wrapper.style.left = left; 
        wrapper.style.top = top;
        if(w) wrapper.style.width = w + "px";
        if(h) wrapper.style.height = h + "px";

        var img = document.createElement('img');
        img.src = localStorage.getItem('ttd_kepsek');
        img.style.width = '100%'; 
        img.style.height = '100%';
        img.style.pointerEvents = 'none';
        img.style.objectFit = 'contain';

        var delBtn = document.createElement('div');
        delBtn.className = 'btn-delete-ttd'; 
        delBtn.innerHTML = '✕';
        delBtn.onclick = function(e) { 
            e.stopImmediatePropagation(); 
            wrapper.remove(); 
        };

        wrapper.appendChild(img); 
        wrapper.appendChild(delBtn); 
        area.appendChild(wrapper);

        // Drag logic yang lebih bersih
        let isDragging = false;
        let startX, startY, startLeft, startTop;

        wrapper.addEventListener('mousedown', function(e) {
            if(e.target === delBtn) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startLeft = wrapper.offsetLeft;
            startTop = wrapper.offsetTop;
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;
            
            let newLeft = startLeft + dx;
            let newTop = startTop + dy;

            // Boundary check
            newLeft = Math.max(0, Math.min(newLeft, area.offsetWidth - wrapper.offsetWidth));
            newTop = Math.max(0, Math.min(newTop, area.offsetHeight - wrapper.offsetHeight));

            wrapper.style.left = newLeft + "px";
            wrapper.style.top = newTop + "px";
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
    };

    window.eksekusiAccDokumen = async function() {
        window.saveCurrentPageSignatures(); 

        var totalSignatures = 0;
        for (var p in window.signaturesByPage) { totalSignatures += window.signaturesByPage[p].length; }
        if(totalSignatures === 0) return alert("⚠️ Anda belum membubuhkan tanda tangan di halaman manapun.");

        document.getElementById('modal-acc').style.display = 'none';
        window.ubahTeksLoading("Mencetak Tanda Tangan & Menyimpan...");
        
        try {
            if(!window.tempPdfBase64) throw new Error("Memori data PDF kosong.");

            var binaryString = atob(window.tempPdfBase64);
            var len = binaryString.length;
            var bytes = new Uint8Array(len);
            for (var i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }

            const pdfDoc = await PDFLib.PDFDocument.load(bytes);
            var area = document.getElementById('pdf-virtual-area');
            var areaRealWidth = area.offsetWidth;
            var areaRealHeight = area.offsetHeight;
            
            var ttdBytes = await fetch(localStorage.getItem('ttd_kepsek')).then(res => res.arrayBuffer());
            var embedTtd = await pdfDoc.embedPng(ttdBytes);

            for (var pageKey in window.signaturesByPage) {
                var pageNum = parseInt(pageKey);
                var sigList = window.signaturesByPage[pageKey];
                if(sigList.length === 0) continue;

                var targetPage = pdfDoc.getPages()[pageNum - 1]; 
                var { width, height } = targetPage.getSize();
                
                var scaleX = width / areaRealWidth; 
                var scaleY = height / areaRealHeight;

                sigList.forEach(function(sig) {
                    var itemLeft = parseInt(sig.left);
                    var itemTop = parseInt(sig.top);
                    
                    targetPage.drawImage(embedTtd, { 
                        x: itemLeft * scaleX, 
                        y: height - (itemTop * scaleY) - (sig.height * scaleY), 
                        width: sig.width * scaleX, 
                        height: sig.height * scaleY 
                    });
                });
            }

            var payload = { action: "update_supervisi_acc", id_dokumen: activeDocId, fileName: "ACC_SUPERVISI_" + activeDocId + ".pdf", fileBase64: await pdfDoc.saveAsBase64() };
            var resAcc = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
            var jsonAcc = await resAcc.json();
            
            if(jsonAcc.status === 'success') {
                alert("✅ Luar Biasa! Berkas berhasil ditandatangani di semua halaman pilihan Anda.");
                window.tempPdfBase64 = null; 
                window.loadDaftarSupervisi();
            } else {
                throw new Error(jsonAcc.message);
            }
        } catch(e) { 
            alert("❌ Gagal Memproses PDF: " + e.message); 
        } finally { 
            // PERBAIKAN FATAL: Menghapus typo huruf h agar tidak terjadi crash lagi
            tutupLoading(); 
        }
    };

    window.loadDaftarSupervisi();
})();
</script>
