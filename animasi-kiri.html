<style>
  :root{
    --bg: transparent; 
    --card: rgba(255,255,255,.55);
    --card-strong: rgba(255,255,255,.72);
    --stroke: rgba(0,0,0,.08);
    --text: #2c2c2c;

    --green:#10b981;
    --green2:#047857;
    --pink:#f472b6;
    --purple:#a78bfa;
    --blue:#38bdf8;
    --amber:#f59e0b;
  }

  #widget-islam{ width: 100%; height: 100%; display:flex; flex-direction: column; padding: 10px 10px; box-sizing: border-box; gap: 10px; background: var(--bg); }
  .widget-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; min-height: 0; }

  .card{ background: var(--card); border: 1px solid var(--stroke); border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,.06); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 12px; overflow:hidden; position: relative; }
  .card::after{ content:""; position:absolute; inset:-40px -60px auto -60px; height: 90px; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), transparent 60%); pointer-events:none; }

  .brand{ display:flex; align-items:center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .brand .title{ font-family: Georgia, serif; font-weight: 950; color: var(--green2); font-size: 13px; letter-spacing: .2px; }
  .brand .chip{ font-size: 11px; padding: 6px 10px; border-radius: 999px; background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.25); color: rgba(4,120,87,.95); font-weight: 900; white-space: nowrap; max-width: 45%; overflow:hidden; text-overflow: ellipsis; }

  .clock-now{ display:flex; flex-direction: column; gap: 8px; }
  .clock-time{ font-size: 34px; font-weight: 950; color:#1f2937; line-height: 1; letter-spacing: .4px; }
  .clock-date{ color: rgba(31,41,55,.75); font-weight: 850; font-size: 13px; display:flex; gap: 10px; flex-wrap: wrap; }
  .clock-dot{ width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 6px rgba(16,185,129,.12); margin-top: 4px; flex: 0 0 auto; }
  
  .weather-top{ display:flex; align-items:center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .weather-temp{ font-size: 26px; font-weight: 1000; color:#0f172a; line-height: 1; }
  .weather-desc{ color: rgba(31,41,55,.75); font-weight: 900; font-size: 12px; display:flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .weather-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .weather-pill{ background: rgba(255,255,255,.35); border: 1px solid rgba(0,0,0,.06); border-radius: 14px; padding: 8px 10px; }
  .weather-pill .k{ font-size: 10.5px; font-weight: 950; color: rgba(0,0,0,.45); text-transform: uppercase; letter-spacing: .2px; }
  .weather-pill .v{ font-size: 12px; font-weight: 1000; color: rgba(0,0,0,.72); margin-top: 4px; white-space: nowrap; }

  #sidebar-calendar-card { cursor: pointer; transition: transform 0.2s; }
  #sidebar-calendar-card:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(0,0,0,.1); }

  .cal-head{ display:flex; align-items:center; justify-content: space-between; gap: 10px; margin-bottom: 10px; position: relative; z-index: 1; }
  .cal-month{ font-weight: 1000; color: var(--text); font-size: 13px; }
  .nav-btn { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.28); color: var(--green2); border-radius: 6px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
  .nav-btn:hover { background: var(--green); color: white; }
  .btn-download-pdf { background: var(--pink); color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: 0.2s; box-shadow: 0 4px 10px rgba(244, 114, 182, 0.3); }
  .btn-download-pdf:hover { transform: scale(1.05); background: #db2777; }

  .cal-weekdays{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-size: 11px; font-weight: 1000; color: rgba(0,0,0,.45); margin-bottom: 6px; position: relative; z-index: 1; }
  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-size: 12px; font-weight: 1000; position: relative; z-index: 1; }
  .cal-day{ width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; display:flex; align-items:center; justify-content:center; color: rgba(0,0,0,.55); background: rgba(255,255,255,.25); border: 1px solid rgba(0,0,0,.05); overflow:hidden; }
  .cal-day.muted{ opacity: .35; }
  .cal-day.today{ background: linear-gradient(180deg, rgba(16,185,129,.28), rgba(16,185,129,.08)); border: 1px solid rgba(16,185,129,.35); color: rgba(4,120,87,.98); box-shadow: 0 10px 18px rgba(16,185,129,.18); }
  .cal-day.is-libur { background: rgba(239, 68, 68, 0.15) !important; color: #dc2626 !important; border: 1px solid rgba(239, 68, 68, 0.3) !important; }
  .cal-day.has-agenda { border-bottom: 3px solid var(--amber); font-weight: 1000; color: var(--text); }
  .cal-day.has-ujian { border-bottom: 3px solid var(--pink); font-weight: 1000; color: var(--text); }

  .agenda-list-wrap { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .agenda-item { background: rgba(255,255,255,.45); padding: 6px 10px; border-radius: 6px; font-size: 11px; border-left: 3px solid; }
  .agenda-item.kat-kegiatan { border-left-color: var(--amber); }
  .agenda-item.kat-ujian    { border-left-color: var(--pink); background: rgba(244,114,182,0.12); }
  .agenda-item.kat-libur    { border-left-color: #ef4444; background: rgba(239,68,68,0.12); }

  .agenda-item .tgl { font-weight: 850; color: rgba(0,0,0,.5); font-size: 9px; }
  .agenda-item .kgt { font-weight: 950; color: var(--text); line-height: 1.4; margin-top: 3px;}
  .badge-kategori { font-size: 8px; padding: 2px 6px; border-radius: 4px; color: white; display: inline-block; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-kategori.kegiatan { background: var(--amber); }
  .badge-kategori.ujian    { background: var(--pink); }
  .badge-kategori.libur    { background: #ef4444; }

  .absensi-item { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.45); border: 1px solid rgba(0,0,0,.05); margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
  .absensi-item:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); border-color: var(--green); }
  .absensi-item .kelas-name { font-weight: 1000; font-size: 13px; color: var(--green2); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(0,0,0,0.1); padding-bottom: 4px;}
  .absensi-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
  .stat-box { display: flex; flex-direction: column; background: white; border-radius: 6px; padding: 4px 0; border: 1px solid rgba(0,0,0,0.04); }
  .stat-label { font-size: 9px; font-weight: 900; color: rgba(0,0,0,0.4); text-transform: uppercase; }
  .stat-value { font-size: 14px; font-weight: 1000; }
  .val-h { color: var(--green); } .val-i { color: var(--amber); } .val-s { color: var(--blue); } .val-a { color: #9ca3af; }

  .agenda-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px 0; gap: 8px; color: rgba(0,0,0,0.5); font-size: 11px; font-weight: 800; }
  .spinner-circle { width: 24px; height: 24px; border: 3px solid rgba(16,185,129,0.2); border-top: 3px solid var(--green); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .footer-note{ font-size: 11px; color: rgba(0,0,0,.45); font-weight: 850; text-align:center; padding: 2px 0; }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 999999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; overflow: hidden; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-calendar-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); box-sizing: border-box; width: 92vw; max-width: 380px; max-height: 85vh; overflow-y: auto; overflow-x: hidden; padding: 15px; position: relative; transform: scale(0.9); transition: transform 0.3s ease; }
  .modal-overlay.active .modal-calendar-card { transform: scale(1); }
  .modal-close-btn { position: absolute; top: 12px; right: 12px; background: #ef4444; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 14px; font-weight: bold; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4); z-index: 10; transition: 0.2s; }
  .modal-close-btn:hover { background: #dc2626; transform: scale(1.1); }

  #download-modal, #download-absen-modal { z-index: 9999999; }
  .modal-download-card { background: white; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); width: 90vw; max-width: 420px; padding: 25px; position: relative; transform: scale(0.9); transition: transform 0.3s ease; box-sizing: border-box; }
  .modal-overlay.active .modal-download-card { transform: scale(1); }

  .btn-green-large { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: var(--green); color: white; margin-top: 15px; box-shadow: 0 4px 10px rgba(16,185,129,0.3); transition: 0.2s;}
  .btn-green-large:hover { background: #059669; }
  .input-form { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #d1d5db; box-sizing: border-box; font-size: 12px; margin-top: 4px; }
  .input-group { margin-bottom: 12px; text-align: left; }
  .input-group label { font-size: 11px; font-weight: bold; color: #4b5563; }

  @media (max-width: 768px){ .widget-grid{ grid-template-columns: 1fr; } .card{ padding: 10px; } .clock-time{ font-size: 30px; } .brand .chip{ max-width: 70%; } }
</style>

window.jalankanWidgetKiri = function() {
  var elTime = document.getElementById('clock-time');
  var elDate = document.getElementById('clock-date');
  var elGreeting = document.getElementById('clock-greeting');

  function pad2(n){ return String(n).padStart(2,'0'); }
  function formatClock(d){ var h = d.getHours(); var isPM = h >= 12; var hh = h % 12 || 12; return pad2(hh) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) + (isPM ? ' PM' : ' AM'); }
  function formatDate(d){ var weekday = new Intl.DateTimeFormat('id-ID', { weekday:'short' }).format(d); var day = d.getDate(); var month = new Intl.DateTimeFormat('id-ID', { month:'short' }).format(d); var year = d.getFullYear(); return weekday + ', ' + day + ' ' + month + ' ' + year; }

  var btnCloseModal = document.getElementById('btn-close-modal');
  var sidebarCalendarCard = document.getElementById('sidebar-calendar-card');
  var modalDownload = document.getElementById('download-modal');

  document.getElementById('btn-open-download-1').addEventListener('click', function(e) { e.stopPropagation(); modalDownload.classList.add('active'); });

  window.renderCalendar = function(date){
    var y = date.getFullYear(); var m = date.getMonth(); var first = new Date(y, m, 1); var last = new Date(y, m+1, 0); var today = new Date();
    var startIndex = (first.getDay() + 6) % 7; 
    var targetMonthStr = y + '-' + pad2(m+1); 
    var agendaBulanIni = globalAgenda.filter(function(a) { return a.tanggalBersih && a.tanggalBersih.startsWith(targetMonthStr); }).sort(function(a, b) { return a.tanggalBersih.localeCompare(b.tanggalBersih); });

    var targets = [ { monthEl: document.getElementById('cal-month'), gridEl: document.getElementById('cal-grid'), listEl: document.getElementById('agenda-list-container') }, { monthEl: document.getElementById('modal-cal-month'), gridEl: document.getElementById('modal-cal-grid'), listEl: document.getElementById('modal-agenda-list') } ];

    targets.forEach(function(t) {
        if(!t.monthEl) return;
        t.monthEl.textContent = new Intl.DateTimeFormat('id-ID', { month:'short', year:'numeric' }).format(date);
        t.gridEl.innerHTML = ''; t.listEl.innerHTML = ''; 

        for(var i=0;i<startIndex;i++){ var cell = document.createElement('div'); cell.className = 'cal-day muted'; t.gridEl.appendChild(cell); }

        for(var day=1; day<=last.getDate(); day++){
          var cell2 = document.createElement('div'); cell2.className = 'cal-day'; cell2.textContent = day;
          var dayOfWeek = new Date(y, m, day).getDay();
          if(dayOfWeek === 0 || dayOfWeek === 6) cell2.classList.add('is-libur');
          if (day === today.getDate() && y === today.getFullYear() && m === today.getMonth()) cell2.classList.add('today');

          var tglStr = y + '-' + pad2(m+1) + '-' + pad2(day);
          var agendanya = globalAgenda.filter(function(a) { return a.tanggalBersih === tglStr; });
          
          if(agendanya.length > 0 && !isAgendaLoading) {
            var isLibur = false, isUjian = false, isKegiatan = false;
            agendanya.forEach(function(a) {
                var kat = a.kategori || 'Kegiatan Sekolah';
                if (a.kegiatan && a.kegiatan.includes('|||')) kat = a.kegiatan.split('|||')[0];
                if(kat === 'Libur Nasional') isLibur = true; else if(kat === 'Ujian Sekolah') isUjian = true; else isKegiatan = true;
            });
            if(isLibur) cell2.classList.add('is-libur'); else if(isUjian) cell2.classList.add('has-ujian'); else if(isKegiatan) cell2.classList.add('has-agenda'); 
          }
          t.gridEl.appendChild(cell2);
        }
        
        if (isAgendaLoading) {
            t.listEl.innerHTML = '<div class="agenda-loader"><div class="spinner-circle"></div><div>Sinkronisasi data...</div></div>';
        } else if (agendaBulanIni.length > 0) {
            agendaBulanIni.forEach(function(ag) {
                var parts = ag.tanggalBersih.split('-'); var thn = parts[0], bln = parts[1], tgl = parts[2];
                var namaBulan = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
                var finalKategori = ag.kategori || 'Kegiatan Sekolah'; var namaKgt = ag.kegiatan || '';
                if(namaKgt.includes('|||')) { var p = namaKgt.split('|||'); finalKategori = p[0]; namaKgt = p.slice(1).join('|||'); }
                var katClass = 'kat-kegiatan', badgeClass = 'kegiatan';
                if(finalKategori === 'Ujian Sekolah') { katClass = 'kat-ujian'; badgeClass = 'ujian'; }
                if(finalKategori === 'Libur Nasional') { katClass = 'kat-libur'; badgeClass = 'libur'; }
                t.listEl.innerHTML += '<div class="agenda-item ' + katClass + '"><div class="tgl">' + tgl + ' ' + namaBulan[parseInt(bln,10)-1] + ' ' + thn + '</div><div class="kgt"><span class="badge-kategori ' + badgeClass + '">' + finalKategori + '</span><br>' + namaKgt + '</div></div>';
            });
        } else {
            t.listEl.innerHTML = '<div style="text-align:center; font-size:10px; color:rgba(0,0,0,0.5); margin-top: 15px;">Tidak ada agenda di bulan ini</div>';
        }
    });
  };

  window.fetchAgendaDatabase = async function() {

                if (tgl.length > 10 && tgl.includes('-')) tgl = tgl.substring(0, 10);
                if (tgl.includes('/')) { var p = tgl.split('/'); if (p.length === 3) tgl = p[2] + '-' + pad2(p[1]) + '-' + pad2(p[0]); }

  // ==========================================
  // SISTEM ABSENSI (HARI INI)
  // ==========================================
  window.fetchRekapAbsensi = async function() {
      var elTgl = document.getElementById('absensi-tanggal');
      var container = document.getElementById('absensi-list-container');
      
      var now = new Date();
      elTgl.textContent = new Intl.DateTimeFormat('id-ID', { dateStyle:'full' }).format(now);
      var todayStr = now.getFullYear() + '-' + pad2(now.getMonth()+1) + '-' + pad2(now.getDate());

      try {
          var URL_ABSEN = API_URL_UTAMA + "?action=get_rekap_absensi";
          var URL_SISWA = API_URL_UTAMA + "?action=get_siswa";

          var responses = await Promise.all([fetch(URL_ABSEN), fetch(URL_SISWA)]);
          var jsonAbsen = await responses[0].json();
          var jsonSiswa = await responses[1].json();

          window.globalDataAbsensi = jsonAbsen.data || [];
          window.globalDataSemuaSiswa = jsonSiswa.data || []; // Simpan semua siswa di memori

          var rekapHariIni = {};
          var kelasSet = new Set();
          
          window.globalDataSemuaSiswa.forEach(s => {
              if(s.kelas) {
                  kelasSet.add(s.kelas);
                  if(!rekapHariIni[s.kelas]) rekapHariIni[s.kelas] = { H:0, I:0, S:0, A:0, Total: 0 };
                  rekapHariIni[s.kelas].Total += 1; 
              }
          });

          window.globalDataAbsensi.forEach(absen => {
              if(!absen.tanggal) return;
              var tglBersih = String(absen.tanggal).replace(/['"]/g, '').trim().substring(0, 10);
              
              if(tglBersih === todayStr) {
                  var kelas = absen.kelas;
                  if(kelas && rekapHariIni[kelas]) {
                      var stat = (absen.status || "").toUpperCase().trim();
                      if(stat === 'HADIR') rekapHariIni[kelas].H += 1;
                      else if(stat === 'IZIN') rekapHariIni[kelas].I += 1;
                      else if(stat === 'SAKIT') rekapHariIni[kelas].S += 1;
                      else rekapHariIni[kelas].A += 1;
                  }
              }
          });

          container.innerHTML = '';
          var listKelas = Array.from(kelasSet).sort();
          
          if(listKelas.length === 0) {
              container.innerHTML = '<div style="text-align:center; font-size:10px; color:rgba(0,0,0,0.5); margin-top:20px; font-style:italic;">Belum ada data murid.<br>Gunakan menu Absensi untuk menambah.</div>';
          } else {
              listKelas.forEach(function(kls) {
                  var d = rekapHariIni[kls];
                  container.innerHTML += `
                     <div class="absensi-item" onclick="window.bukaChartKelas('${kls}')">
                          <div class="kelas-name"><span>📚 ${kls}</span><span style="font-size:10px; color:#6b7280; font-weight:bold;">Total: ${d.Total} Siswa</span></div>
                          <div class="absensi-stats">
                              <div class="stat-box"><span class="stat-label">Hadir</span><span class="stat-value val-h">${d.H}</span></div>
                              <div class="stat-box"><span class="stat-label">Sakit</span><span class="stat-value val-s">${d.S}</span></div>
                              <div class="stat-box"><span class="stat-label">Izin</span><span class="stat-value val-i">${d.I}</span></div>
                              <div class="stat-box"><span class="stat-label">Alpa</span><span class="stat-value val-a">${d.A}</span></div>
                          </div>
                      </div>
                  `;
              });
          }
      } catch (e) {
          container.innerHTML = '<div style="text-align:center; color:red; font-size:10px; margin-top:15px;">Gagal memuat rekap absensi.</div>';
      }
  };

  // 1. MUNCULKAN CHART DENGAN MODEL BERDAMPINGAN SAAT DIKLIK
  window.bukaChartKelas = function(kelas) {
      window.currentKelasAbsen = kelas; // Simpan memori kelas yang diklik
      document.getElementById('chart-kelas-title').textContent = kelas;
      document.getElementById('chart-modal').classList.add('active');

      var absenKelas = window.globalDataAbsensi.filter(function(a) { return a.kelas === kelas; });
      var monthsNumber = ['07', '08', '09', '10', '11', '12', '01', '02', '03', '04', '05', '06'];
      var labelsChart  = ['Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni'];

      var dataS = Array(12).fill(0); var dataI = Array(12).fill(0); var dataA = Array(12).fill(0);
      var totals = Array(12).fill(0);

      // Hitung mentah jumlah S, I, A per bulan
      absenKelas.forEach(function(a) {
          if(!a.tanggal) return;
          var monthStr = String(a.tanggal).replace(/['"]/g, '').trim().substring(5, 7);
          var idx = monthsNumber.indexOf(monthStr);
          if(idx !== -1) {
              var stat = (a.status || "").toUpperCase().trim();
              totals[idx]++;
              if(stat === 'SAKIT') dataS[idx]++;
              else if(stat === 'IZIN') dataI[idx]++;
              else if(stat === 'ALPA' || stat === 'ALFA') dataA[idx]++;
          }
      });

      var jmlSiswaArray = window.globalDataSemuaSiswa ? window.globalDataSemuaSiswa.filter(function(s){ return s.kelas === kelas; }) : [];
      var jmlSiswa = jmlSiswaArray.length || 1;

      var dataS_pct = [], dataI_pct = [], dataA_pct = [];

      // Konversi ke Persentase dengan Rumus Bapak: (Jml * 100) / (Siswa * Hari Efektif)
      for(var i=0; i<12; i++){
          var hariEfektif = Math.round(totals[i] / jmlSiswa) || 0; // Estimasi hari efektif dari jumlah record
          var denominator = jmlSiswa * hariEfektif;
          
          if(denominator > 0) {
              dataS_pct.push(((dataS[i] * 100) / denominator).toFixed(2));
              dataI_pct.push(((dataI[i] * 100) / denominator).toFixed(2));
              dataA_pct.push(((dataA[i] * 100) / denominator).toFixed(2));
          } else {
              dataS_pct.push(0); dataI_pct.push(0); dataA_pct.push(0);
          }
      }

      if(window.grafikAbsensiInstance) window.grafikAbsensiInstance.destroy();

      var ctx = document.getElementById('absenChart').getContext('2d');
      window.grafikAbsensiInstance = new Chart(ctx, {
          type: 'bar',
          data: {
              labels: labelsChart,
              datasets: [
                  { label: 'Sakit', data: dataS_pct, backgroundColor: '#4472c4', categoryPercentage: 0.8, barPercentage: 0.9 },
                  { label: 'Izin', data: dataI_pct, backgroundColor: '#ed7d31', categoryPercentage: 0.8, barPercentage: 0.9 },
                  { label: 'Alfa', data: dataA_pct, backgroundColor: '#a5a5a5', categoryPercentage: 0.8, barPercentage: 0.9 }
              ]
          },
          options: {
              responsive: true,
              plugins: { legend: { position: 'bottom' } },
              scales: { x: { grid: { display: false } }, y: { beginAtZero: true, max: 100 } }
          }
      });
  };

  function weatherCodeToText(code){ var m={0:['Cerah','☀️'],1:['Cerah Berawan','🌤️'],2:['Berawan','⛅'],3:['Mendung','☁️'],45:['Kabut','🌫️'],51:['Gerimis','🌦️'],61:['Hujan','🌧️'],95:['Petir','⛈️']}; return m[code]||['Cuaca','🌈']; }
  function startClockLoop(){ setInterval(function(){ var now = new Date(); elTime.textContent = formatClock(now); elDate.textContent = formatDate(now); elGreeting.textContent = greeting(now); }, 1000); }
