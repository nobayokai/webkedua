<!-- Maskot Ramah Lingkungan - Animasi Mata Ikut Kursor + Posenya berubah saat diklik -->
<style>
  /* Container halaman kiri biar rapi */
  #eco-mascot-stage{
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
    user-select: none;
  }

  /* Efek latar sederhana */
  #eco-mascot-stage::before{
    content:"";
    position:absolute; inset:-40px;
    background:
      radial-gradient(circle at 20% 20%, rgba(56, 189, 248, .18), transparent 45%),
      radial-gradient(circle at 80% 30%, rgba(34, 197, 94, .16), transparent 48%),
      radial-gradient(circle at 40% 80%, rgba(59, 130, 246, .12), transparent 45%);
    filter: blur(1px);
    pointer-events:none;
  }

  /* Maskot */
  .eco-mascot{
    position: relative;
    width: min(320px, 90%);
    aspect-ratio: 1 / 1.05;
    cursor: pointer;
    transform: translateZ(0);
  }

  /* Bayangan */
  .eco-mascot .shadow{
    position:absolute;
    left: 50%;
    bottom: 10px;
    width: 70%;
    height: 10%;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(0,0,0,.25), transparent 70%);
    filter: blur(2px);
    opacity: .45;
  }

  /* Badan dasar */
  .eco-mascot .body{
    position:absolute;
    left: 50%;
    top: 26%;
    width: 78%;
    height: 62%;
    transform: translateX(-50%);
    border-radius: 28px 28px 34px 34px;
    background: linear-gradient(180deg, #E8F7FF, #BEE7FF);
    box-shadow:
      inset 0 0 0 3px rgba(15, 23, 42, .06),
      0 10px 25px rgba(2, 6, 23, .12);
  }

  /* Jubah */
  .eco-mascot .robe{
    position:absolute;
    left: 50%;
    top: 37%;
    width: 78%;
    height: 48%;
    transform: translateX(-50%);
    border-radius: 26px 26px 34px 34px;
    background: linear-gradient(180deg, #0EA5A4, #0B7285);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.22);
  }

  /* Lengan */
  .eco-mascot .arm{
    position:absolute;
    top: 44%;
    width: 18%;
    height: 22%;
    border-radius: 14px;
    background: linear-gradient(180deg, #0B7285, #075985);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.12);
    transform-origin: 50% 0%;
  }
  .eco-mascot .arm.left{
    left: 18%;
    transform: rotate(-10deg);
  }
  .eco-mascot .arm.right{
    right: 18%;
    transform: rotate(8deg);
  }

  /* “Tangan” lucu */
  .eco-mascot .hand{
    position:absolute;
    bottom: -10%;
    left: 50%;
    width: 70%;
    height: 34%;
    transform: translateX(-50%);
    border-radius: 999px;
    background: linear-gradient(180deg, #F5D0A6, #E7B98A);
    box-shadow: inset 0 0 0 3px rgba(15,23,42,.08);
  }

  /* Kepala */
  .eco-mascot .head{
    position:absolute;
    left: 50%;
    top: 6%;
    width: 62%;
    height: 42%;
    transform: translateX(-50%);
    border-radius: 50% 50% 42% 42%;
    background: linear-gradient(180deg, #FFFFFF, #E6F4FF);
    box-shadow:
      inset 0 0 0 3px rgba(15, 23, 42, .06),
      0 12px 22px rgba(2, 6, 23, .10);
  }

  /* Sorban/Topi */
  .eco-mascot .turban{
    position:absolute;
    left: 50%;
    top: -12%;
    width: 80%;
    height: 40%;
    transform: translateX(-50%);
    border-radius: 28px;
    background: linear-gradient(180deg, #0EA5A4, #047857);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.18);
  }
  .eco-mascot .crescent{
    position:absolute;
    left: 50%;
    top: 2%;
    width: 26px;
    height: 26px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #FEF3C7, #F59E0B);
    box-shadow: 0 6px 14px rgba(245, 158, 11, .35);
  }
  .eco-mascot .crescent::after{
    content:"";
    position:absolute;
    inset: 7px;
    border-radius: 50%;
    background: linear-gradient(180deg, #0EA5A4, #047857);
  }

  /* Badge kecil (daur ulang ramah lingkungan) */
  .eco-mascot .eco-badge{
    position:absolute;
    right: 6%;
    bottom: 8%;
    width: 18%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #A7F3D0, #34D399);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    color:#064E3B;
  }

  /* Area mata */
  .eco-mascot .eyes{
    position:absolute;
    top: 33%;
    left: 50%;
    width: 72%;
    height: 28%;
    transform: translateX(-50%);
    display:flex;
    gap: 14%;
    align-items:center;
    justify-content:center;
  }

  .eco-mascot .eye{
    position: relative;
    width: 42%;
    height: 100%;
    background: #FFFFFF;
    border-radius: 50%;
    box-shadow: inset 0 0 0 3px rgba(15,23,42,.08);
    overflow:hidden;
  }

  .eco-mascot .pupil{
    position:absolute;
    left: 50%;
    top: 52%;
    width: 26%;
    height: 26%;
    transform: translate(-50%, -50%)
      translate(calc(var(--ex, 0) * 10px), calc(var(--ey, 0) * 7px));
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #111827, #000000);
    transition: transform 60ms linear;
  }

  /* Efek berkedip */
  .eco-mascot .blink{
    position:absolute;
    left: 50%;
    top: 50%;
    width: 0%;
    height: 14px;
    transform: translate(-50%, -50%);
    background: rgba(15,23,42,.12);
    border-radius: 999px;
    opacity: 0;
    pointer-events:none;
    animation: blink 5.2s infinite;
  }
  @keyframes blink{
    0%, 92%, 100% { opacity: 0; width: 0%; }
    93% { opacity: 1; width: 72%; }
    94% { opacity: 0; width: 0%; }
  }

  /* Hidung & mulut */
  .eco-mascot .nose{
    position:absolute;
    left: 50%;
    top: 60%;
    width: 12px;
    height: 8px;
    transform: translateX(-50%);
    border-radius: 0 0 8px 8px;
    background: rgba(15,23,42,.12);
  }
  .eco-mascot .mouth{
    position:absolute;
    left: 50%;
    top: 65%;
    width: 34%;
    height: 14%;
    transform: translateX(-50%);
    border-bottom: 4px solid rgba(15,23,42,.35);
    border-radius: 0 0 30px 30px;
    opacity: .9;
  }

  /* Buku kecil di depan */
  .eco-mascot .book{
    position:absolute;
    left: 50%;
    top: 58%;
    width: 44%;
    height: 18%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #F59E0B, #D97706);
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(217, 119, 6, .22);
    border: 3px solid rgba(255,255,255,.22);
  }
  .eco-mascot .book::after{
    content:"";
    position:absolute;
    left: 10%;
    top: 18%;
    width: 80%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,.45);
  }

  /* Daun untuk pose ke-3 */
  .eco-mascot .leaf{
    position:absolute;
    right: 18%;
    top: 49%;
    width: 24%;
    height: 18%;
    transform-origin: 50% 50%;
    background: linear-gradient(180deg, #22C55E, #16A34A);
    border-radius: 50% 10% 50% 10%;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.22);
    opacity: 0;
    transform: translateY(6px) rotate(-20deg);
    transition: opacity .25s ease, transform .35s ease;
  }
  .eco-mascot .leaf::after{
    content:"";
    position:absolute;
    left: 50%;
    top: 10%;
    width: 3px;
    height: 80%;
    transform: translateX(-50%);
    background: rgba(255,255,255,.55);
    border-radius: 999px;
  }

  /* Pose perubahan: default -> waving -> memegang daun */
  .eco-mascot.pose-0 .arm.right{
    transform: rotate(8deg);
  }
  .eco-mascot.pose-1 .arm.right{
    transform: rotate(-28deg);
    transition: transform .25s ease;
    animation: wave 1s ease-in-out infinite;
  }
  @keyframes wave{
    0%{ transform: rotate(-18deg); }
    50%{ transform: rotate(-40deg); }
    100%{ transform: rotate(-18deg); }
  }

  .eco-mascot.pose-2 .arm.right{
    transform: rotate(-38deg);
    transition: transform .25s ease;
    animation: none;
  }
  .eco-mascot.pose-2 .leaf{
    opacity: 1;
    transform: translateY(-2px) rotate(-8deg);
  }

  /* Hint teks */
  .eco-mascot .hint{
    position:absolute;
    left: 50%;
    bottom: 2%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(15,23,42,.65);
    background: rgba(255,255,255,.55);
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(15,23,42,.08);
    box-shadow: 0 10px 18px rgba(2,6,23,.07);
  }
</style>

<div id="eco-mascot-stage">
  <div class="eco-mascot pose-0" id="ecoMascot" role="button" tabindex="0" aria-label="Maskot sekolah islam ramah lingkungan, klik untuk mengubah pose">
    <div class="shadow"></div>

    <div class="body"></div>
    <div class="robe"></div>

    <div class="arm left">
      <div class="hand"></div>
    </div>
    <div class="arm right">
      <div class="hand"></div>
    </div>

    <div class="head">
      <div class="turban">
        <div class="crescent"></div>
      </div>

      <div class="eyes">
        <div class="eye">
          <div class="pupil" id="pupilL"></div>
        </div>
        <div class="eye">
          <div class="pupil" id="pupilR"></div>
        </div>
      </div>

      <div class="blink"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
      <div class="eco-badge">♻</div>
    </div>

    <div class="book"></div>
    <div class="leaf" aria-hidden="true"></div>

    <div class="hint">Klik! 🟢 Mata ikut kursor ✨</div>
  </div>
</div>

<script>
  (function () {
    const mascot = document.getElementById('ecoMascot');
    if (!mascot) return;

    // Pose state
    const poses = ['pose-0', 'pose-1', 'pose-2'];
    let poseIndex = 0;

    function setPose(i){
      poseIndex = (i + poses.length) % poses.length;
      mascot.classList.remove(...poses);
      mascot.classList.add(poses[poseIndex]);
    }

    mascot.addEventListener('click', () => setPose(poseIndex + 1));
    mascot.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        setPose(poseIndex + 1);
      }
    });

    // Eye follow cursor
    let targetEx = 0, targetEy = 0;
    let currentEx = 0, currentEy = 0;

    const maxX = 1; // normalisasi
    const maxY = 1;

    function setTargetFromPoint(clientX, clientY){
      const rect = mascot.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height * 0.33; // fokus ke area mata (lebih natural)

      const dx = (clientX - cx) / (rect.width / 2);
      const dy = (clientY - cy) / (rect.height / 2);

      targetEx = Math.max(-maxX, Math.min(maxX, dx));
      targetEy = Math.max(-maxY, Math.min(maxY, dy));
    }

    function animate(){
      // smoothing
      currentEx += (targetEx - currentEx) * 0.12;
      currentEy += (targetEy - currentEy) * 0.12;

      mascot.style.setProperty('--ex', currentEx.toFixed(3));
      mascot.style.setProperty('--ey', currentEy.toFixed(3));

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Mouse
    document.addEventListener('mousemove', (e) => {
      setTargetFromPoint(e.clientX, e.clientY);
    }, { passive: true });

    // Touch (biar tetap responsif)
    document.addEventListener('touchmove', (e) => {
      if (!e.touches || !e.touches[0]) return;
      setTargetFromPoint(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    // Biar saat tidak ada input, mata kembali ke tengah
    document.addEventListener('mouseleave', () => {
      targetEx = 0; targetEy = 0;
    });
  })();
</script>
