 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Pembelajaran</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Sembunyikan elemen mobile di tampilan PC/Laptop */
        .btn-mobile-widget { display: none; }
        .btn-close-mobile { display: none; }
        
        /* Overlay Kaca (Glassmorphism) */
        .mobile-glass-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4); /* Transparansi sedikit digelapkan agar widget menonjol */
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); 
            z-index: 99998; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .mobile-glass-overlay.active { opacity: 1; pointer-events: auto; }

        /* PENGATURAN KHUSUS MODE HANDPHONE (Lebar layar maksimal 768px) */
        @media (max-width: 768px) {
            .btn-mobile-widget {
                display: flex; align-items: center; justify-content: center;
                position: fixed; top: 15px; right: 15px; 
                background: #10b981; color: white; border: none;
                border-radius: 50px; padding: 10px 18px; font-weight: bold; font-size: 13px;
                box-shadow: 0 4px 15px rgba(16,185,129,0.4); z-index: 99; cursor: pointer;
                transition: transform 0.2s;
            }
            .btn-mobile-widget:active { transform: scale(0.95); }

            .btn-close-mobile {
                display: flex; align-items: center; justify-content: center;
                position: absolute; top: 15px; right: 15px; width: 35px; height: 35px;
                background: #ef4444; color: white; border: none; border-radius: 50%;
                font-size: 16px; font-weight: bold; z-index: 100005; cursor: pointer;
                box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
            }

           /* TRIK RAHASIA: Mengangkat derajat buku ke atas kaca saat tombol diklik */
            body.widget-terbuka {
                overflow: hidden !important; /* MENGUNCI LAYAR BACKGROUND AGAR TIDAK BISA DIGESER */
                touch-action: none !important; /* Mengunci total gestur usap di background */
            }
            body.widget-terbuka .container, 
            body.widget-terbuka .book {
                z-index: 99999 !important;
            }

            /* Paksa Page Kiri muncul dan menjadi Popup Modal di tengah layar */
            .page.left-page {
                display: block !important; 
                visibility: hidden; 
                position: fixed !important; 
                top: 50% !important; 
                left: 50% !important;
                transform: translate(-50%, -50%) scale(0.8) !important; 
                
                /* FIX KUNCI LEBAR AGAR FIXED DI LAYAR HP */
                width: calc(100vw - 40px) !important; /* Ambil lebar layar dikurangi jarak aman 40px */
                max-width: 400px !important; 
                height: 85vh !important;
                box-sizing: border-box !important; /* KUNCI PENTING: Agar padding tidak meluberkan lebar */
                overflow-x: hidden !important; /* KUNCI MATI geser kanan kiri */
                
                z-index: 100000 !important; opacity: 0; pointer-events: none;
                transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) !important; 
                border-radius: 20px !important; box-shadow: 0 20px 50px rgba(0,0,0,0.4) !important;
                background: rgba(255, 255, 255, 0.95) !important; overflow-y: auto !important;
            }
            
            /* Class pemicu animasi popup */
            .page.left-page.show-popup {
                opacity: 1 !important; pointer-events: auto !important; visibility: visible !important;
                transform: translate(-50%, -50%) scale(1) !important; 
            }
        }
    </style>
</head>
<body>
    <div class="mobile-glass-overlay" id="mobile-overlay" onclick="toggleMobileWidget()"></div>

    <div class="container">
        <div class="book">
            <div class="page left-page" id="kiri-statis" style="position: relative; padding-top: 25px;">
                <script>
                    fetch('animasi-kiri.html')
                        .then(response => response.text())
                        .then(data => {
                            // Masukkan isi kalender
                            document.getElementById('kiri-statis').innerHTML = data;
                            
                            // Tambahkan tombol Close (X) ke dalam popup kalender
                            const btnClose = document.createElement('button');
                            btnClose.className = 'btn-close-mobile';
                            btnClose.innerHTML = '✕';
                            btnClose.onclick = toggleMobileWidget;
                            
                            // Letakkan tombol silang ini di paling atas widget
                            document.getElementById('kiri-statis').prepend(btnClose);

                            // Jalankan ulang script bawaan widgetnya
                            const script = document.createElement('script');
                            script.innerHTML = document.querySelector('#kiri-statis script').innerHTML;
                            document.body.appendChild(script);
                        });
                </script>
            </div>
            
            <div class="page right-page">
                <button class="btn-mobile-widget" onclick="toggleMobileWidget()">🕌 Tampilkan Widget</button>
                
                <div id="area-konten">
                    <p id="status-loading">Memuat kerangka buku...</p>
                </div>
                <p style="font-size: 10px; white-space: nowrap; text-align: center;">&copy; Copyright - SDIT Hidayatut Taufiq 2026 | Design By : <span class="designer-name">Nova Haryanto</span> | All Rights reserved.</p>
            </div>
        </div>

        <div class="tabs">
            <a href="#" class="tab active" onclick="loadPage('beranda-konten.html', this)">Beranda</a>
            <a href="#" class="tab" style="display: none;" onclick="loadPage('edukasi.html', this)">Edukasi</a>
            <a href="#" class="tab" style="display: none;" onclick="loadPage('soal.html', this)">Latihan</a>
            <a href="#" class="tab" style="display: none;" onclick="loadPage('materi.html', this)">Materi</a>
            <a href="#" class="tab" id="tab-agenda" style="display: none;" onclick="loadPage('tambah-agenda.html', this)">Agenda</a>
            <a href="#" class="tab" id="tab-absensi" style="display: none;" onclick="loadPage('absensi-guru.html', this)">Absensi</a>
            <a href="#" class="tab" id="tab-supervisi" style="display: none;" onclick="loadPage('supervisi.html', this)">Supervisi</a>
            <a href="#" class="tab" id="tab-posting" onclick="loadPage('posting.html', this)">Posting</a>
            <a href="#" class="tab" id="tab-formulir" onclick="loadPage('formulir-siswa-baru.html', this)">Formulir</a>
            <a href="#" class="tab" id="tab-formulir" onclick="loadPage('Form-Identifikasi.html', this)">Identifikasi Murid</a>
            <a href="#" class="tab" id="tab-login"  onclick="loadPage('login/login.html', this)">Login</a>  
            <a href="#" class="tab" id="tab-logout" style="display: none;" onclick="handleLogout(); return false;">Logout</a>  
        </div>
    </div>

    <script>
        function toggleMobileWidget() {
            // Trik jitu untuk mengangkat posisi buku saat di HP
            document.body.classList.toggle('widget-terbuka'); 
            
            const leftPage = document.getElementById('kiri-statis');
            const overlay = document.getElementById('mobile-overlay');
            
            leftPage.classList.toggle('show-popup');
            overlay.classList.toggle('active');
        }
    </script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="script.js"></script>
    <script src="https://elfsightcdn.com/platform.js" async></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    
</body>
</html>
