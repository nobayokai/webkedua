<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembelajaran V.1</title>
    <style>
        /* Desain Background dan Layout Utama */
        body {
            margin: 0;
            padding: 0;
            background-color: #d1c0a8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Desain Buku (Fullscreen) */
        .book {
            display: flex;
            flex: 1;
            background-color: #fcf5e3;
            box-shadow: 10px 0 30px rgba(0,0,0,0.3);
            z-index: 2;
        }

        /* Lembaran Kertas */
        .page {
            flex: 1;
            overflow-y: auto;
            font-size: 18px;
            color: #333;
            line-height: 1.8;
            display: flex;
            flex-direction: column;
        }

        /* Halaman Kiri (Cover Dalam) */
        .left-page {
            border-right: 2px solid #d3c5ab;
            box-shadow: inset -15px 0 20px rgba(0,0,0,0.03);
            padding: 60px 80px;
        }

        /* Halaman Kanan */
        .right-page {
            padding: 0; /* Padding dinolkan agar Canva bisa full screen */
        }

        /* Desain Menu Tabs di Kanan */
        .tabs {
            width: 55px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 50px;
            z-index: 1;
        }

        .tab {
            background: #e6d3b8;
            border: 2px solid #bba382;
            border-left: none;
            padding: 20px 10px;
            cursor: pointer;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            border-radius: 0 12px 12px 0;
            font-weight: bold;
            font-family: 'Georgia', serif;
            box-shadow: 4px 4px 8px rgba(0,0,0,0.2);
            transition: 0.3s;
            user-select: none;
            margin-left: -5px;
        }

        .tab:hover, .tab.active {
            background: #bba382;
            color: white;
            transform: translateX(5px);
        }

        /* Konten Halaman */
        .content-section { 
            display: none; 
            width: 100%;
            height: 100%;
            padding: 60px 80px; /* Padding dipindah ke sini untuk halaman selain beranda */
            box-sizing: border-box;
            overflow-y: auto;
        }
        
        .content-section.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        /* Khusus Beranda agar full screen */
        #beranda.content-section {
            padding: 0;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2 {
            font-family: 'Georgia', serif;
            color: #2c2c2c;
            margin-top: 0;
        }

        /* Form Login Sederhana */
        .login-form input {
            padding: 12px;
            margin: 15px 0;
            width: 80%;
            border: none;
            background: transparent;
            border-bottom: 2px solid #bba382;
            font-size: 16px;
            outline: none;
        }
        
        .login-form input:focus { 
            border-bottom-color: #8c7355; 
        }
        
        .login-form button {
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #bba382;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-size: 16px;
            transition: 0.3s;
        }
        
        .login-form button:hover { 
            background-color: #8c7355; 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="book">
            <div class="page left-page">
                 <img src="https://i.postimg.cc/HkqfbYVN/baner-TAHUN-AJARAN-2026-2027.jpg" style="width: 100%; height: 100%; border: none;" allow="fullscreen" allowfullscreen></img>
            </div>

            <div class="page right-page">
                
                <div id="beranda" class="content-section active">
                    <iframe src="https://www.canva.com/design/DAGVl2oFPPI/GHJrGnLLmIQrstCteiWr-A/view?utm_content=DAGVl2oFPPI&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=hc0fe57e0d1" style="width: 100%; height: 100%; border: none;" allow="fullscreen" allowfullscreen></iframe>
                </div>

                <div id="edukasi" class="content-section">
                    <h2 id="judul-edukasi">Permainan Edukasi</h2>
                    <p id="konten-edukasi">Memuat data...</p>
                </div>

                <div id="soal" class="content-section">
                    <h2 id="judul-soal">Latihan Soal</h2>
                    <p id="konten-soal">Memuat data...</p>
                </div>

                <div id="materi" class="content-section">
                    <h2 id="judul-materi">Kumpulan Materi</h2>
                    <p id="konten-materi">Memuat data...</p>
                </div>

                <div id="login" class="content-section">
                    <h2>Login Siswa</h2>
                    <div class="login-form">
                        <input type="text" placeholder="Masukkan Username"><br>
                        <input type="password" placeholder="Masukkan Password"><br>
                        <button type="button">Masuk ke Kelas</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('beranda', this)">Beranda</div>
            <div class="tab" onclick="switchTab('edukasi', this)">Edukasi</div>
            <div class="tab" onclick="switchTab('soal', this)">Latihan Soal</div>
            <div class="tab" onclick="switchTab('materi', this)">Materi</div>
            <div class="tab" onclick="switchTab('login', this)">Login</div>
        </div>
    </div>

    <script>
        // Fungsi untuk mengganti halaman saat tab diklik
        function switchTab(tabId, element) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        // --- GANTI URL DI BAWAH INI DENGAN URL APPS SCRIPT MILIKMU ---
        const SCRIPT_URL = 'URL_APPS_SCRIPT_KAMU_DI_SINI';

        // Fungsi untuk mengambil data dari database Google Sheets
        async function fetchGoogleSheetsData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                // Menuliskan data ke dalam HTML berdasarkan kolom 'menu'
                data.forEach(item => {
                    const menuId = item.menu.toLowerCase().trim();
                    const titleElement = document.getElementById(`judul-${menuId}`);
                    const contentElement = document.getElementById(`konten-${menuId}`);
                    
                    if (titleElement && contentElement) {
                        titleElement.innerText = item.judul;
                        contentElement.innerText = item.konten;
                    }
                });

                document.getElementById('status-loading').innerText = "Data berhasil dimuat dari Google Sheets!";
                
                // Opsional: Hilangkan tulisan loading jika sudah selesai
                setTimeout(() => {
                    document.getElementById('status-loading').style.display = 'none';
                }, 2000);

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('status-loading').innerText = "Gagal memuat data. Pastikan URL Apps Script sudah benar.";
            }
        }

        // Jalankan fungsi saat web dibuka
        fetchGoogleSheetsData();
    </script>
</body>
</html>
