<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Pembelajaran</title>
    <style>
        /* Desain Background dan Layout Utama */
        body {
            margin: 0;
            padding: 0;
            background-color: #d1c0a8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
            flex-direction: row; /* Default PC: Menu di Kanan */
        }

        /* Desain Buku */
        .book {
            display: flex;
            flex: 1;
            background-color: #fcf5e3;
            box-shadow: 10px 0 30px rgba(0,0,0,0.3);
            z-index: 2;
            position: relative;
        }

        /* Lembaran Kertas */
        .page {
            flex: 1;
            padding: 60px 80px;
            overflow-y: auto;
            font-size: 18px;
            color: #333;
            line-height: 1.8;
            position: relative;
        }

        /* Halaman Kiri (Cover Dalam) */
        .left-page {
            border-right: 2px solid #d3c5ab;
            box-shadow: inset -15px 0 20px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Notifikasi Loading */
        #status-loading {
            color: #888;
            font-style: italic;
            text-align: center;
            width: 100%;
            margin-bottom: 20px;
        }

        /* Desain Menu Tabs di Kanan (Tampilan PC) */
        .tabs {
            width: 55px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 50px;
            z-index: 1;
            background-color: transparent;
        }

        .tab {
            background: #e6d3b8;
            border: 2px solid #bba382;
            border-left: none;
            padding: 20px 10px;
            cursor: pointer;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            border-radius: 0 12px 12px 0;
            font-weight: bold;
            font-family: 'Georgia', serif;
            box-shadow: 4px 4px 8px rgba(0,0,0,0.2);
            transition: 0.3s;
            user-select: none;
            margin-left: -5px;
            text-align: center;
        }

        .tab:hover, .tab.active {
            background: #bba382;
            color: white;
            transform: translateX(5px);
        }

        /* Konten Halaman */
        .content-section { 
            display: none; 
        }
        
        .content-section.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        /* Khusus Beranda Fullscreen di PC */
        #beranda.active {
            display: flex;
            padding: 0;
            margin: -60px -80px; 
            width: calc(100% + 160px);
            height: calc(100% + 120px);
        }

        #beranda img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2 {
            font-family: 'Georgia', serif;
            color: #2c2c2c;
            margin-top: 0;
        }

        /* Form Login */
        .login-form input {
            padding: 12px;
            margin: 15px 0;
            width: 90%;
            max-width: 300px;
            border: none;
            background: transparent;
            border-bottom: 2px solid #bba382;
            font-size: 16px;
            outline: none;
        }
        
        .login-form input:focus { 
            border-bottom-color: #8c7355; 
        }
        
        .login-form button {
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #bba382;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-size: 16px;
            transition: 0.3s;
        }
        
        .login-form button:hover { 
            background-color: #8c7355; 
        }

        /* =========================================================
           PENGATURAN TAMPILAN HP (RESPONSIF MOBILE)
           ========================================================= */
        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column; /* Menu dipindah ke bawah buku */
            }

            .left-page {
                display: none; /* Sembunyikan halaman kiri di HP agar layar luas */
            }

            .page {
                padding: 25px 20px; /* Perkecil jarak padding di HP */
            }

            /* Ubah Menu Tabs ke Bawah (Horizontal) */
            .tabs {
                width: 100vw;
                height: 70px;
                flex-direction: row; /* Berjejer ke samping */
                padding-top: 0;
                padding-bottom: 0;
                gap: 2px;
                justify-content: space-between;
                align-items: flex-end; /* Nempel di dasar layar */
                background-color: #d1c0a8;
            }

            .tab {
                writing-mode: horizontal-tb; /* Teks normal / horizontal */
                border-radius: 12px 12px 0 0; /* Lengkungnya di atas */
                border: 2px solid #bba382;
                border-bottom: none;
                margin-left: 0;
                margin-top: 0;
                padding: 12px 5px;
                font-size: 12px; /* Ukuran font dikecilkan sedikit */
                flex: 1; /* Membagi rata lebar tombol */
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .tab:hover, .tab.active {
                transform: translateY(-5px); /* Animasi pop-up naik ke atas */
            }

            /* Sesuaikan gambar Beranda fullscreen untuk padding HP */
            #beranda.active {
                margin: -25px -20px;
                width: calc(100% + 40px);
                height: calc(100% + 50px);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="book">
            <div class="page left-page">
                </div>

            <div class="page right-page">
                
                <p id="status-loading">Sedang menghubungkan ke database...</p>
                
                <div id="beranda" class="content-section active">
                    <img src="https://i.postimg.cc/HkqfbYVN/baner-TAHUN-AJARAN-2026-2027.jpg" alt="Banner Beranda">
                </div>

                <div id="edukasi" class="content-section">
                    <h2 id="judul-edukasi">Permainan Edukasi</h2>
                    <p id="konten-edukasi">Memuat data...</p>
                </div>

                <div id="soal" class="content-section">
                    <h2 id="judul-soal">Latihan Soal</h2>
                    <p id="konten-soal">Memuat data...</p>
                </div>

                <div id="materi" class="content-section">
                    <h2 id="judul-materi">Kumpulan Materi</h2>
                    <p id="konten-materi">Memuat data...</p>
                </div>

                <div id="login" class="content-section">
                    <h2>Login Siswa</h2>
                    <div class="login-form">
                        <input type="text" placeholder="Masukkan Username"><br>
                        <input type="password" placeholder="Masukkan Password"><br>
                        <button type="button">Masuk ke Kelas</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('beranda', this)">Beranda</div>
            <div class="tab" onclick="switchTab('edukasi', this)">Edukasi</div>
            <div class="tab" onclick="switchTab('soal', this)">Latihan</div>
            <div class="tab" onclick="switchTab('materi', this)">Materi</div>
            <div class="tab" onclick="switchTab('login', this)">Login</div>
        </div>
    </div>

    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        // --- GANTI URL DI BAWAH INI DENGAN URL APPS SCRIPT MILIKMU ---
        const SCRIPT_URL = 'URL_APPS_SCRIPT_KAMU_DI_SINI';

        async function fetchGoogleSheetsData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                data.forEach(item => {
                    const menuId = item.menu.toLowerCase().trim();
                    const titleElement = document.getElementById(`judul-${menuId}`);
                    const contentElement = document.getElementById(`konten-${menuId}`);
                    
                    if (titleElement && contentElement && menuId !== 'beranda') {
                        titleElement.innerText = item.judul;
                        contentElement.innerText = item.konten;
                    }
                });

                document.getElementById('status-loading').style.display = 'none';
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('status-loading').innerText = "Gagal memuat data. Pastikan URL Apps Script benar.";
                document.getElementById('status-loading').style.color = "red";
            }
        }

        fetchGoogleSheetsData();
    </script>
</body>
</html>
