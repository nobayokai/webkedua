<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Pembelajaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ... (bagian book dan div kiri/kanan biarkan sama persis seperti sebelumnya) ... -->
        <div class="book">
            <!-- Isi book tidak saya tulis ulang agar tidak kepanjangan, biarkan saja seperti aslinya -->
            <div class="page left-page" id="kiri-statis">
                <script>
                    fetch('animasi-kiri.html')
                        .then(response => response.text())
                        .then(data => {
                            document.getElementById('kiri-statis').innerHTML = data;
                            const script = document.createElement('script');
                            script.innerHTML = document.querySelector('#kiri-statis script').innerHTML;
                            document.body.appendChild(script);
                        });
                </script>
            </div>
            <div class="page right-page">
                <div id="area-konten">
                    <p id="status-loading">Memuat kerangka buku...</p>
                </div>
            </div>
        </div>

        <div class="tabs">
            <a href="#" class="tab active" onclick="loadPage('beranda-konten.html', this)">Beranda</a>
            <a href="#" class="tab" style="display: none;" onclick="loadPage('edukasi.html', this)">Edukasi</a>
            <a href="#" class="tab" style="display: none;" onclick="loadPage('soal.html', this)">Latihan</a>
            <a href="#" class="tab" style="display: none;" onclick="loadPage('materi.html', this)">Materi</a>
            <a href="#" class="tab" onclick="loadPage('posting.html', this)">Posting</a>
            <a href="#" class="tab" onclick="loadPage('formulir-siswa-baru.html', this)">Formulir</a>
            <a href="#" class="tab" id="tab-login"  onclick="loadPage('login/login.html', this)">Login</a>  
            <a href="#" class="tab" id="tab-logout" onclick="handleLogout(); return false;">Logout</a>  
        </div>
    </div>

    <!-- SCRIPT CUSTOM DI BAWAH -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDEl0uwUFXngv5iPgG1AHR6evhSoV6OvQ&loading=async" async defer></script>
    <script src="script.js"></script>
    <script src="https://elfsightcdn.com/platform.js" async></script>
    
<footer>
        <p>
            &copy; Copyright - SDIT Hidayatut Taufiq 2026 | Design By : <span class="designer-name">Nova Haryanto</span> | All Rights reserved.
        </p>
    </footer>
</body>
</html>
