<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Pembelajaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="book">
            <div class="page left-page">
                <div class="animation-container">
    <div class="buku-lucu">
        <div class="mata"></div>
        <div class="mulut"></div>
    </div>
    <p class="teks-animasi">Halo! Selamat belajar ya!</p>
</div>

<style>
    .animation-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
    }

    /* Karakter Buku Lucu */
    .buku-lucu {
        width: 100px;
        height: 120px;
        background: #f7d794;
        border: 4px solid #574b90;
        border-radius: 10px;
        position: relative;
        animation: melambai 2s infinite;
    }

    .mata {
        width: 15px;
        height: 15px;
        background: #333;
        border-radius: 50%;
        position: absolute;
        top: 30px;
        left: 20px;
        box-shadow: 45px 0 0 #333;
    }

    .mulut {
        width: 30px;
        height: 15px;
        border: 3px solid #333;
        border-top: none;
        border-radius: 0 0 15px 15px;
        position: absolute;
        bottom: 30px;
        left: 35px;
    }

    /* Animasi Melambai */
    @keyframes melambai {
        0%, 100% { transform: rotate(-5deg); }
        50% { transform: rotate(5deg); }
    }

    .teks-animasi {
        margin-top: 20px;
        font-family: 'Comic Sans MS', cursive;
        color: #574b90;
        font-weight: bold;
    }
</style>
                </div>
            
            <div class="page right-page">
                <div id="area-konten">
                    <p id="status-loading">Memuat kerangka buku...</p>
                </div>
            </div>
        </div>

        <div class="tabs">
            <a href="#" class="tab active" onclick="loadPage('beranda-konten.html', this)">Beranda</a>
            <a href="#" class="tab" onclick="loadPage('edukasi.html', this)">Edukasi</a>
            <a href="#" class="tab" onclick="loadPage('soal.html', this)">Latihan</a>
            <a href="#" class="tab" onclick="loadPage('materi.html', this)">Materi</a>
            <a href="#" class="tab" onclick="loadPage('posting.html', this)">Posting</a>
            <a href="#" class="tab" onclick="loadPage('login.html', this)">Login</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://elfsightcdn.com/platform.js" async></script>
</body>
</html>
