<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator RPPM Final</title>

    <style>
        :root {
            --primary: #0284c7; 
            --primary-hover: #0369a1;
            --accent: #f59e0b; 
            --bg: #f0f9ff;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #bae6fd;
            --table-row: #f8fafc;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; position: relative; }
        
        h1 { text-align: center; color: var(--primary); font-size: 2rem; margin-bottom: 5px; text-transform: uppercase; font-weight: 800; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-weight: 500; }
        
        .card { background-color: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 25px; border-top: 5px solid var(--primary); }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; color: #334155; }
        input, select { padding: 10px; border: 2px solid var(--border); border-radius: 6px; font-size: 1rem; transition: border-color 0.2s; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.4); }
        button:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-generate { width: 100%; margin-top: 20px; font-size: 1.1rem; padding: 15px; }
        
        #rppm-document { padding: 40px; background-color: #ffffff; position: relative; }
        .rppm-title { text-align: center; font-weight: 900; margin-bottom: 25px; font-size: 1.4rem; color: var(--primary); text-decoration: underline; text-underline-offset: 5px; }
        h3 { margin-top: 25px; margin-bottom: 15px; font-size: 1.2rem; color: var(--primary-hover); background: #e0f2fe; padding: 8px 15px; border-left: 5px solid var(--accent); border-radius: 4px; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-bottom: 20px; border: 2px solid var(--border); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; vertical-align: top; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
        th { background-color: var(--primary); color: white; width: 30%; font-weight: 600; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 0.5px; }
        td { background-color: white; }
        tr:nth-child(even) td { background-color: var(--table-row); }
        tr:last-child th, tr:last-child td { border-bottom: none; }
        th:last-child, td:last-child { border-right: none; }
        
        ul, ol { margin: 0; padding-left: 20px; }
        .ai-text { white-space: pre-wrap; }
        .tindak-lanjut-box { border: 2px dashed var(--border); border-radius: 8px; height: 120px; margin-bottom: 30px; background-color: #f8fafc; }
        
        .signature-box { display: flex; justify-content: space-between; margin-top: 40px; }
        .sig-col { width: 45%; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .sig-space { position: relative; width: 100%; height: 60px; display: flex; justify-content: center; align-items: center; margin: 10px 0; }
        
        #ttd-wrapper {
            position: absolute;
            width: 150px;
            height: 100px; 
            border: 2px dashed var(--accent);
            background-color: rgba(245, 158, 11, 0.1);
            resize: both;
            overflow: hidden;
            cursor: move;
            display: none; 
            z-index: 100;
        }
        #ttd-image { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        #loading { text-align: center; display: none; padding: 20px; font-weight: bold; color: var(--primary); font-size: 1.1rem; }
        #output-rppm { display: none; }
        
        .print-controls { background-color: #fffbeb; border-left: 5px solid var(--accent); padding: 15px; margin-bottom: 20px; border-radius: 6px; display: flex; gap: 15px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .print-controls div { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;}
        
        .pb-mode-active { outline: 3px dashed #ef4444; background-color: #fef2f2 !important; }
        .pb-mode-active h3:hover, .pb-mode-active tr:hover, .pb-mode-active .signature-box:hover { border-top: 5px solid #ef4444 !important; cursor: crosshair; opacity: 0.8; box-shadow: 0 -5px 10px rgba(239, 68, 68, 0.2); }
        
        .custom-page-break { width: 100%; height: 0; overflow: hidden; padding: 0; margin: 0; border: none; background: transparent; color: transparent; font-size: 0; line-height: 0; }
        .pb-mode-active .custom-page-break { height: auto; overflow: visible; padding: 8px 0; margin: 15px 0; background-color: #fee2e2; border: 2px dashed #ef4444; color: #ef4444; font-size: 0.9rem; line-height: 1.6; text-align: center; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .pb-mode-active .custom-page-break:hover { background-color: #fca5a5; color: white; }

        @media print {
            @page { size: 215mm 330mm; margin: 10mm; }
            body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; background-color: white; }
            .container { max-width: 100%; width: 100%; padding: 0; }
            .card { box-shadow: none; border: none; padding: 0; margin: 0; }
            #rppm-document { padding: 0; }
            .no-print { display: none !important; }
            .custom-page-break { page-break-before: always !important; break-before: page !important; }
            tr, h3, .signature-box { page-break-inside: avoid; break-inside: avoid; }
            #ttd-wrapper { border: none !important; background-color: transparent !important; resize: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card no-print">
        <h3 style="margin-top:0;">Input Data RPP</h3>
        <div class="form-grid">
            <div class="form-group"><label>Nama Penyusun</label><input type="text" id="nama" value="Nova Haryanto, A.Md."></div>
            <div class="form-group"><label>Mata Pelajaran</label><input type="text" id="mapel" value="Informatika"></div>
            <div class="form-group"><label>Unit/Materi</label><input type="text" id="materi" value="Keluarga Komputer"></div>
            <div class="form-group"><label>Alokasi Waktu</label><input type="text" id="waktu" value="2 x 35 menit (2 JP) 1 Pertemuan"></div>
            <div class="form-group"><label>Fase/Kelas</label><input type="text" id="fase" value="Fase A / Kelas I (satu)"></div>
            <div class="form-group"><label>Semester</label><input type="text" id="semester" value="Semester II"></div>
            <div class="form-group">
                <label>Jenis Guru</label>
                <select id="jenis_guru">
                    <option value="Guru Bidang Studi">Guru Bidang Studi</option>
                    <option value="Guru Kelas">Guru Kelas</option>
                </select>
            </div>
            <div class="form-group"><label>Kepala Sekolah</label><input type="text" id="kepsek" value="Ghoniyah Nasrullah, S.Pd., Gr."></div>
            <div class="form-group"><label>Tempat (Kota)</label><input type="text" id="tempat" value="Bekasi"></div>
            <div class="form-group"><label>Tanggal RPP</label><input type="text" id="tanggal" value="18 Januari 2027"></div>
        </div>
        <button class="btn-generate" onclick="generateRPPM()">Generate RPP dengan AI 🚀</button>
    </div>

    <div id="loading">✨ Sedang merakit modul pembelajaran dengan AI, mohon tunggu...</div>

    <div id="output-rppm">
        <div class="print-controls no-print">
            <div style="flex-direction: column; align-items: flex-start; gap: 5px;">
                <strong style="color:var(--text);">Langkah Persiapan:</strong>
                <span style="font-size:0.85rem; color:#64748b;">1. Atur batas halaman &nbsp; | &nbsp; 2. Upload & atur TTD &nbsp; | &nbsp; 3. Print / Save PDF</span>
            </div>
            <div>
                <button id="btn-pb" style="background-color: #ef4444; color:#fff;" onclick="togglePageBreakMode()">✂️ Atur Batas Halaman</button>
                <input type="file" id="ttd-upload" accept="image/*" style="display: none;" onchange="loadSignature(event)">
                <button style="background-color: var(--accent); color:#fff;" onclick="document.getElementById('ttd-upload').click()">+ Upload TTD</button>
                <button onclick="downloadPDF()">🖨️ Cetak / Save PDF (F4)</button>
            </div>
        </div>

        <div class="card" id="rppm-document">
            <div class="rppm-title">RENCANA PELAKSANAAN PEMBELAJARAN MENDALAM (RPPM)</div>
            <div id="rppm-content"></div>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // ⚠️ PASTIKAN URL INI ADALAH URL DARI "DEPLOYMENT BARU" GOOGLE APPS SCRIPT
    // =========================================================================
    const gasUrl = "https://script.google.com/macros/s/AKfycbzNNR8ao5lJ_ze_vVemKNtDogBFFciXmtFxjVjnbf3tzebWc6TVwiteClqa00wWwDqtnw/exec";

    async function generateRPPM() {
        const identitas = {
            nama: document.getElementById('nama').value,
            mapel: document.getElementById('mapel').value,
            materi: document.getElementById('materi').value,
            waktu: document.getElementById('waktu').value,
            fase: document.getElementById('fase').value,
            semester: document.getElementById('semester').value,
            jenis_guru: document.getElementById('jenis_guru').value,
            kepsek: document.getElementById('kepsek').value,
            tempat: document.getElementById('tempat').value,
            tanggal: document.getElementById('tanggal').value
        };

        document.getElementById('loading').style.display = 'block';
        document.getElementById('output-rppm').style.display = 'none';

        try {
            const response = await fetch(gasUrl, {
                method: 'POST',
                body: JSON.stringify({ identitas: identitas }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });

            const dataAI = await response.json();
            if(dataAI.error) throw new Error(dataAI.error);

            renderRPPM({ ...identitas, ...dataAI });
            document.getElementById('loading').style.display = 'none';
            document.getElementById('output-rppm').style.display = 'block';

        } catch (error) {
            console.error(error);
            alert("Koneksi ke AI Gagal. Pastikan URL GAS sudah diperbarui ke Deployment Terbaru!\nDetail Error: " + error.message);
            document.getElementById('loading').style.display = 'none';
        }
    }

    // ========================================================
        // FIX: PENYARING ANTI [object Object] & ANTI BOCORAN \n
        // ========================================================
        function bersihkanTeks(val) {
            if (!val) return "-"; 
            
            // 1. Jika AI mengirimkan Object, gabungkan dengan Enter asli (\n)
            if (typeof val === 'object') {
                val = Object.values(val).join('\n\n'); 
            }
            
            // 2. Mengubah tulisan "\n" mentah dari AI menjadi perintah Enter asli
            return val.toString().replace(/\\n/g, '\n'); 
        }

        const html = `
            <h3>I. IDENTITAS RPP</h3>
            <table>
                <tr><th>Nama Penyusun</th><td>${bersihkanTeks(data.nama)}</td></tr>
                <tr><th>Mata Pelajaran</th><td>${bersihkanTeks(data.mapel)}</td></tr>
                <tr><th>Unit/Materi</th><td>${bersihkanTeks(data.materi)}</td></tr>
                <tr><th>Alokasi Waktu</th><td>${bersihkanTeks(data.waktu)}</td></tr>
                <tr><th>Fase/Kelas</th><td>${bersihkanTeks(data.fase)}</td></tr>
                <tr><th>Semester</th><td>${bersihkanTeks(data.semester)}</td></tr>
            </table>

            <h3>II. IDENTIFIKASI</h3>
            <table>
                <tr>
                    <th>Profil Murid</th>
                    <td>
                        <strong>Pengetahuan Awal:</strong><br><span class="ai-text">${bersihkanTeks(data.profil_pengetahuan)}</span><br><br>
                        <strong>Minat Belajar:</strong><br><span class="ai-text">${bersihkanTeks(data.profil_minat)}</span>
                    </td>
                </tr>
                <tr>
                    <th>Analisis Materi</th>
                    <td>
                        <strong>Cakupan Materi:</strong><br><span class="ai-text">${bersihkanTeks(data.analisis_cakupan)}</span><br><br>
                        <strong>Relevansi Kontekstual:</strong><br><span class="ai-text">${bersihkanTeks(data.analisis_relevansi)}</span>
                    </td>
                </tr>
                <tr>
                    <th>Dimensi Profil Lulusan</th>
                    <td>
                        <ol type="a">
                            <li><strong>Keimanan dan Ketaqwaan:</strong> <span class="ai-text">${bersihkanTeks(data.dimensi_keimanan)}</span></li>
                            <li><strong>Kewargaan:</strong> <span class="ai-text">${bersihkanTeks(data.dimensi_kewargaan)}</span></li>
                            <li><strong>Penalaran Kritis:</strong> <span class="ai-text">${bersihkanTeks(data.dimensi_penalaran)}</span></li>
                            <li><strong>Kreativitas:</strong> <span class="ai-text">${bersihkanTeks(data.dimensi_kreativitas)}</span></li>
                            <li><strong>Kolaborasi:</strong> <span class="ai-text">${bersihkanTeks(data.dimensi_kolaborasi)}</span></li>
                            <li><strong>Kemandirian:</strong> <span class="ai-text">${bersihkanTeks(data.dimensi_kemandirian)}</span></li>
                            <li><strong>Kesehatan:</strong> <span class="ai-text">${bersihkanTeks(data.dimensi_kesehatan)}</span></li>
                            <li><strong>Komunikasi:</strong> <span class="ai-text">${bersihkanTeks(data.dimensi_komunikasi)}</span></li>
                        </ol>
                    </td>
                </tr>
            </table>

            <h3>III. DESAIN PEMBELAJARAN</h3>
            <table>
                <tr><th>Capaian Pembelajaran</th><td class="ai-text">${bersihkanTeks(data.capaian)}</td></tr>
                <tr><th>Lintas Disiplin Ilmu</th><td>-</td></tr>
                <tr><th>Tujuan Pembelajaran</th><td class="ai-text">${bersihkanTeks(data.tujuan)}</td></tr>
                <tr><th>Praktik Pedagogis</th><td>Pembelajaran kontekstual<br>Diskusi kelompok</td></tr>
                <tr><th>Kemitraan Pembelajaran</th><td>-</td></tr>
                <tr>
                    <th>Lingkungan Pembelajaran</th>
                    <td><strong>Ruang fisik:</strong> kelas, lab komputer<br><strong>Budaya belajar:</strong> memberikan kesempatan mengeksplorasi materi.</td>
                </tr>
                <tr><th>Pemanfaatan Digital</th><td class="ai-text">${bersihkanTeks(data.digital)}</td></tr>
            </table>

            <h3>IV. PENGALAMAN BELAJAR</h3>
            <table>
                <tr>
                    <th>Pertemuan I</th>
                    <td>
                        <strong>Kegiatan Awal (bermakna)</strong><br>
                        - Guru memulai dengan salam, doa bersama, dan melakukan presensi.<br>
                        - Memaparkan tujuan pembelajaran yang akan dicapai yaitu ${bersihkanTeks(data.tujuan)}<br><br>

                        <strong>Kegiatan Inti</strong><br>
                        <em>Memahami:</em><br><span class="ai-text">${bersihkanTeks(data.kegiatan_memahami)}</span><br><br>
                        <em>Mengaplikasi:</em><br><span class="ai-text">${bersihkanTeks(data.kegiatan_mengaplikasi)}</span><br><br>
                        <em>Merefleksi:</em><br><span class="ai-text">${bersihkanTeks(data.kegiatan_merefleksi)}</span><br><br>

                        <strong>Kegiatan Penutup</strong><br><span class="ai-text">${bersihkanTeks(data.kegiatan_penutup)}</span>
                    </td>
                </tr>
            </table>

            <h3>V. ASESMEN PEMBELAJARAN</h3>
            <table>
                <tr><th>Jenis Asesmen</th><td><strong>Teknik dan Instrumen</strong></td></tr>
                <tr><th>1. Asesmen Awal</th><td>Pretest: kuis singkat</td></tr>
                <tr><th>2. Asesmen Proses</th><td><strong>Observasi:</strong> <span class="ai-text">${bersihkanTeks(data.asesmen_observasi)}</span><br><br><strong>Penilaian Kinerja:</strong> <span class="ai-text">${bersihkanTeks(data.asesmen_kinerja)}</span></td></tr>
                <tr><th>3. Asesmen Akhir</th><td>Latihan soal</td></tr>
            </table>

            <h3>VI. LAYANAN DIFERENSIASI</h3>
            <table>
                <tr><th>1. Pengayaan</th><td class="ai-text">${bersihkanTeks(data.pengayaan)}</td></tr>
                <tr><th>2. Remedial</th><td class="ai-text">${bersihkanTeks(data.remedial)}</td></tr>
            </table>

            <h3>VII. CATATAN TINDAK LANJUT</h3>
            <div class="tindak-lanjut-box"></div>

            <div class="signature-box">
                <div class="sig-col">
                    <p>Mengetahui,<br>Kepala Sekolah</p>
                    <div class="sig-space"></div>
                    <p><strong>${bersihkanTeks(data.kepsek)}</strong></p>
                </div>
                
                <div class="sig-col">
                    <p>${bersihkanTeks(data.tempat)}, ${bersihkanTeks(data.tanggal)}<br>${bersihkanTeks(data.jenis_guru)}</p>
                    <div class="sig-space">
                        <div id="ttd-wrapper">
                            <img id="ttd-image" src="" alt="Tanda Tangan">
                        </div>
                    </div>
                    <p><strong>${bersihkanTeks(data.nama)}</strong></p>
                </div>
            </div>
        `;
        document.getElementById('rppm-content').innerHTML = html;
        dragElement(document.getElementById("ttd-wrapper"));
    }

    let isPageBreakMode = false;
    function togglePageBreakMode() {
        isPageBreakMode = !isPageBreakMode;
        const doc = document.getElementById('rppm-document');
        const btn = document.getElementById('btn-pb');
        
        if (isPageBreakMode) {
            doc.classList.add('pb-mode-active');
            btn.innerHTML = '✅ Selesai Atur Batas';
            btn.style.backgroundColor = '#16a34a';
            alert("MODE BATAS HALAMAN AKTIF!\n\nArahkan mouse dan KLIK pada Judul/Baris yang ingin didorong ke halaman selanjutnya. \n\n(Klik lagi garis yang sudah dibuat untuk menghapusnya)");
        } else {
            doc.classList.remove('pb-mode-active');
            btn.innerHTML = '✂️ Atur Batas Halaman';
            btn.style.backgroundColor = '#ef4444';
        }
    }

    document.addEventListener('click', function(e) {
        if (!isPageBreakMode) return;
        const doc = document.getElementById('rppm-document');
        if (doc.contains(e.target)) {
            if (e.target.classList.contains('custom-page-break')) {
                e.target.remove();
                return;
            }
            const target = e.target.closest('h3, tr, .signature-box');
            if (target) {
                const pb = document.createElement('div');
                pb.className = 'custom-page-break'; 
                pb.innerHTML = '✂️ BATAS HALAMAN (Teks di bawah ini pindah ke halaman baru) - Klik untuk hapus';
                target.parentNode.insertBefore(pb, target);
            }
        }
    });

    function loadSignature(event) {
        const image = document.getElementById('ttd-image');
        const wrapper = document.getElementById('ttd-wrapper');
        image.src = URL.createObjectURL(event.target.files[0]);
        wrapper.style.display = "block"; 
    }

    function dragElement(elmnt) {
        var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        elmnt.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            if (isPageBreakMode) return;
            e = e || window.event;
            if (e.offsetX > elmnt.offsetWidth - 20 && e.offsetY > elmnt.offsetHeight - 20) return;
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    function downloadPDF() {
        if (isPageBreakMode) {
            alert("Harap selesaikan Mode Batas Halaman (klik 'Selesai Atur Batas') sebelum mencetak/save PDF.");
            return;
        }
        const originalTitle = document.title;
        let namaMateri = document.getElementById('materi').value.trim();
        namaMateri = namaMateri.replace(/[^a-zA-Z0-9 ]/g, "").replace(/\s+/g, "_");
        if(namaMateri === "") namaMateri = "Dokumen";
        
        document.title = 'RPPM_' + namaMateri;
        window.print();
        
        setTimeout(() => {
            document.title = originalTitle;
        }, 1000);
    }
</script>

</body>
</html>
