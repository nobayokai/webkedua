<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator RPPM Final</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1e3a8a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }
        body { font-family: 'Times New Roman', Times, serif; background-color: var(--bg); color: var(--text); line-height: 1.5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); font-family: sans-serif; }
        .card { background-color: var(--card-bg); padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid var(--border); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; font-family: sans-serif; }
        input { padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; font-family: sans-serif;}
        button:hover { background-color: var(--primary-hover); }
        #loading { text-align: center; display: none; padding: 20px; font-weight: bold; font-family: sans-serif; }
        #output-rppm { display: none; }
        .rppm-title { text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 1.2rem; }
        h3 { margin-top: 20px; margin-bottom: 10px; font-size: 1.1rem; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 1px solid black; padding: 8px; vertical-align: top; }
        th { width: 30%; text-align: left; font-weight: normal; }
        .sub-td { padding-left: 20px; }
        .tindak-lanjut-box { border: 1px solid black; height: 100px; margin-bottom: 30px; }
        .signature-box { display: flex; justify-content: space-between; margin-top: 40px; text-align: center; }
        .signature-box div { width: 45%; }
        ul, ol { margin: 0; padding-left: 20px; }
        .ai-text { white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>Generator RPPM AI</h1>
    
    <div class="card">
        <h3 style="font-family: sans-serif; margin-top:0;">Input Data RPP</h3>
        <div class="form-grid">
            <div class="form-group"><label>Nama Penyusun</label><input type="text" id="nama" value="Nova Haryanto"></div>
            <div class="form-group"><label>Mata Pelajaran</label><input type="text" id="mapel" value="Informatika"></div>
            <div class="form-group"><label>Unit/Materi</label><input type="text" id="materi" value="Konsep Dasar Pemrograman"></div>
            <div class="form-group"><label>Alokasi Waktu</label><input type="text" id="waktu" value="2 x 35 menit (2 JP) 1 Pertemuan"></div>
            <div class="form-group"><label>Fase/Kelas</label><input type="text" id="fase" value="C/V (lima)"></div>
            <div class="form-group"><label>Semester</label><input type="text" id="semester" value="Semester II"></div>
            <div class="form-group"><label>Kepala Sekolah</label><input type="text" id="kepsek" value="Ghoniyah Nasrullah, S.Pd., Gr."></div>
            <div class="form-group"><label>Tempat (Kota)</label><input type="text" id="tempat" value="Bekasi"></div>
            <div class="form-group"><label>Tanggal RPP</label><input type="text" id="tanggal" value="Januari 2026"></div>
        </div>
        <button onclick="generateRPPM()">Generate RPP</button>
    </div>

    <div id="loading">Memproses data dengan AI, mohon tunggu...</div>

    <div class="card" id="output-rppm">
        <div class="rppm-title">RENCANA PELAKSANAAN PEMBELAJARAN MENDALAM (RPPM)</div>
        <div id="rppm-content"></div>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP GAS ANDA DI SINI!
    const gasUrl = "https://script.google.com/macros/s/AKfycbzT3l6WHm9bu9cJTlB0gFklXa8RGKeHg9tYHcaCBbxhPDpAcHHzx1hIlWVR6T_ZB_lWZQ/exec";

    async function generateRPPM() {
        const identitas = {
            nama: document.getElementById('nama').value,
            mapel: document.getElementById('mapel').value,
            materi: document.getElementById('materi').value,
            waktu: document.getElementById('waktu').value,
            fase: document.getElementById('fase').value,
            semester: document.getElementById('semester').value,
            kepsek: document.getElementById('kepsek').value,
            tempat: document.getElementById('tempat').value,
            tanggal: document.getElementById('tanggal').value
        };

        document.getElementById('loading').style.display = 'block';
        document.getElementById('output-rppm').style.display = 'none';

        try {
            const response = await fetch(gasUrl, {
                method: 'POST',
                body: JSON.stringify({ identitas: identitas }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });

            const dataAI = await response.json();
            
            if(dataAI.error) throw new Error(dataAI.error);

            renderRPPM({ ...identitas, ...dataAI });
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('output-rppm').style.display = 'block';

        } catch (error) {
            console.error(error);
            alert("Error: " + error.message);
            document.getElementById('loading').style.display = 'none';
        }
    }

    function renderRPPM(data) {
        // Mencegah error jika variabel AI kosong
        const fallback = "-";

        const html = `
            <h3>I. IDENTITAS RPP</h3>
            <table>
                <tr><th>Nama Penyusun</th><td>${data.nama}</td></tr>
                <tr><th>Mata Pelajaran</th><td>${data.mapel}</td></tr>
                <tr><th>Unit/Materi</th><td>${data.materi}</td></tr>
                <tr><th>Alokasi Waktu</th><td>${data.waktu}</td></tr>
                <tr><th>Fase/Kelas</th><td>${data.fase}</td></tr>
                <tr><th>Semester</th><td>${data.semester}</td></tr>
            </table>

            <h3>II. IDENTIFIKASI</h3>
            <table>
                <tr>
                    <th>Profil Murid</th>
                    <td>
                        <strong>Pengetahuan Awal:</strong><br>
                        <span class="ai-text">${data.profil_pengetahuan || fallback}</span><br><br>
                        <strong>Minat Belajar:</strong><br>
                        <span class="ai-text">${data.profil_minat || fallback}</span>
                    </td>
                </tr>
                <tr>
                    <th>Analisis Materi</th>
                    <td>
                        <strong>Cakupan Materi:</strong><br>
                        <span class="ai-text">${data.analisis_cakupan || fallback}</span><br><br>
                        <strong>Relevansi Kontekstual:</strong><br>
                        <span class="ai-text">${data.analisis_relevansi || fallback}</span>
                    </td>
                </tr>
                <tr>
                    <th>Dimensi Profil Lulusan</th>
                    <td>
                        <ol type="a">
                            <li><strong>Keimanan dan Ketaqwaan kepada Tuhan YME:</strong> <span class="ai-text">${data.dimensi_keimanan || fallback}</span></li>
                            <li><strong>Kewargaan:</strong> <span class="ai-text">${data.dimensi_kewargaan || fallback}</span></li>
                            <li><strong>Penalaran Kritis:</strong> <span class="ai-text">${data.dimensi_penalaran || fallback}</span></li>
                            <li><strong>Kreativitas:</strong> <span class="ai-text">${data.dimensi_kreativitas || fallback}</span></li>
                            <li><strong>Kolaborasi:</strong> <span class="ai-text">${data.dimensi_kolaborasi || fallback}</span></li>
                            <li><strong>Kemandirian:</strong> <span class="ai-text">${data.dimensi_kemandirian || fallback}</span></li>
                            <li><strong>Kesehatan:</strong> <span class="ai-text">${data.dimensi_kesehatan || fallback}</span></li>
                            <li><strong>Komunikasi:</strong> <span class="ai-text">${data.dimensi_komunikasi || fallback}</span></li>
                        </ol>
                    </td>
                </tr>
            </table>

            <h3>III. DESAIN PEMBELAJARAN</h3>
            <table>
                <tr><th>Capaian Pembelajaran</th><td class="ai-text">${data.capaian || fallback}</td></tr>
                <tr><th>Lintas Disiplin Ilmu</th><td>-</td></tr>
                <tr><th>Tujuan Pembelajaran</th><td class="ai-text">${data.tujuan || fallback}</td></tr>
                <tr><th>Praktik Pedagogis</th><td>Pembelajaran kontekstual<br>Diskusi kelompok</td></tr>
                <tr><th>Kemitraan Pembelajaran</th><td>-</td></tr>
                <tr>
                    <th>Lingkungan Pembelajaran</th>
                    <td>
                        <strong>Ruang fisik:</strong> kelas, lab komputer<br>
                        <strong>Budaya belajar:</strong> memberikan kesempatan kepada siswa untuk mengeksplorasi cerita dan gambar terkait materi.
                    </td>
                </tr>
                <tr>
                    <th>Pemanfaatan Digital</th>
                    <td>
                        <strong>Perencanaan:</strong> -<br>
                        <strong>Proses:</strong> -<br>
                        <strong>Asesmen:</strong> Canva
                    </td>
                </tr>
            </table>

            <h3>IV. PENGALAMAN BELAJAR</h3>
            <table>
                <tr>
                    <th>Pertemuan I</th>
                    <td>
                        <strong>Kegiatan Awal (bermakna)</strong><br>
                        - Guru memulai dengan salam, doa bersama, dan melakukan presensi.<br>
                        - Memaparkan tujuan pembelajaran yang akan dicapai yaitu ${data.tujuan || fallback}<br><br>

                        <strong>Kegiatan Inti (berkesadaran, bermakna, menggembirakan)</strong><br>
                        <em>Memahami</em><br>
                        <span class="ai-text">${data.kegiatan_memahami || fallback}</span><br><br>
                        
                        <em>Mengaplikasi</em><br>
                        <span class="ai-text">${data.kegiatan_mengaplikasi || fallback}</span><br><br>
                        
                        <em>Merefleksi</em><br>
                        <span class="ai-text">${data.kegiatan_merefleksi || fallback}</span><br><br>

                        <strong>Kegiatan Penutup (berkesadaran)</strong><br>
                        <span class="ai-text">${data.kegiatan_penutup || fallback}</span>
                    </td>
                </tr>
            </table>

            <h3>V. ASESMEN PEMBELAJARAN</h3>
            <table>
                <tr>
                    <th>Jenis Asesmen</th>
                    <td><strong>Teknik dan Instrumen</strong></td>
                </tr>
                <tr>
                    <th>1. Asesmen Awal</th>
                    <td>Pretest: kuis singkat</td>
                </tr>
                <tr>
                    <th>2. Asesmen Proses</th>
                    <td>
                        <strong>Observasi:</strong> <span class="ai-text">${data.asesmen_observasi || fallback}</span><br><br>
                        <strong>Penilaian Kinerja:</strong> <span class="ai-text">${data.asesmen_kinerja || fallback}</span>
                    </td>
                </tr>
                <tr>
                    <th>3. Asesmen Akhir Pembelajaran</th>
                    <td>Latihan soal</td>
                </tr>
            </table>

            <h3>VI. LAYANAN DIFERENSIASI (rencana untuk layanan kelompok bawah dan atas)</h3>
            <table>
                <tr><th>1. Pengayaan</th><td class="ai-text">${data.pengayaan || fallback}</td></tr>
                <tr><th>2. Remedial</th><td class="ai-text">${data.remedial || fallback}</td></tr>
            </table>

            <h3>VII. CATATAN TINDAK LANJUT (Catatan tindak lanjut guru setelah kegiatan)</h3>
            <div class="tindak-lanjut-box"></div>

            <div class="signature-box">
                <div>
                    <p>Mengetahui,<br>Kepala Sekolah</p>
                    <br><br><br>
                    <p><strong>${data.kepsek}</strong></p>
                </div>
                <div>
                    <p>${data.tempat}, ${data.tanggal}<br>Guru Bidang Studi</p>
                    <br><br><br>
                    <p><strong>${data.nama}</strong></p>
                </div>
            </div>
        `;

        document.getElementById('rppm-content').innerHTML = html;
    }
</script>

</body>
</html>
