<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator RPPM Final - Desain Colorful & TTD</title>
    <style>
        /* === DESAIN TEMA COLORFUL === */
        :root {
            --primary: #0284c7; /* Biru cerah */
            --primary-hover: #0369a1;
            --accent: #f59e0b; /* Kuning aksen */
            --bg: #f0f9ff;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #bae6fd;
            --table-row: #f8fafc;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; position: relative; }
        
        h1 { text-align: center; color: var(--primary); font-size: 2rem; margin-bottom: 5px; text-transform: uppercase; font-weight: 800; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-weight: 500; }
        
        .card { background-color: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 25px; border-top: 5px solid var(--primary); position: relative; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; color: #334155; }
        input { padding: 10px; border: 2px solid var(--border); border-radius: 6px; font-size: 1rem; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: var(--primary); }
        
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.4); }
        button:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-generate { width: 100%; margin-top: 20px; font-size: 1.1rem; padding: 15px; }
        
        /* === DESAIN TABEL RPP COLORFUL === */
        .rppm-title { text-align: center; font-weight: 900; margin-bottom: 25px; font-size: 1.4rem; color: var(--primary); text-decoration: underline; text-underline-offset: 5px; }
        h3 { margin-top: 25px; margin-bottom: 15px; font-size: 1.2rem; color: var(--primary-hover); background: #e0f2fe; padding: 8px 15px; border-left: 5px solid var(--accent); border-radius: 4px; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-bottom: 20px; border: 2px solid var(--border); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; vertical-align: top; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
        th { background-color: var(--primary); color: white; width: 30%; font-weight: 600; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 0.5px; }
        td { background-color: white; }
        tr:nth-child(even) td { background-color: var(--table-row); }
        tr:last-child th, tr:last-child td { border-bottom: none; }
        th:last-child, td:last-child { border-right: none; }
        
        ul, ol { margin: 0; padding-left: 20px; }
        .ai-text { white-space: pre-wrap; }
        .tindak-lanjut-box { border: 2px dashed var(--border); border-radius: 8px; height: 120px; margin-bottom: 30px; background-color: #f8fafc; }
        
        /* === BAGIAN TANDA TANGAN === */
        .signature-box { display: flex; justify-content: space-between; margin-top: 50px; text-align: center; }
        .signature-box div { width: 45%; position: relative; }
        
        /* Kontainer Drag & Drop TTD */
        #ttd-wrapper {
            position: absolute;
            width: 150px;
            height: 100px;
            border: 2px dashed var(--accent);
            background-color: rgba(245, 158, 11, 0.1);
            resize: both; /* Memungkinkan resize dari pojok kanan bawah */
            overflow: hidden;
            cursor: move;
            display: none; /* Muncul setelah upload */
            z-index: 100;
            top: 50px; /* Posisi awal */
            left: 50%;
            transform: translateX(-50%);
        }
        #ttd-image { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        /* === KONTROL CETAK & LOADING === */
        #loading { text-align: center; display: none; padding: 20px; font-weight: bold; color: var(--primary); font-size: 1.1rem; }
        #output-rppm { display: none; }
        .print-controls { background-color: #fffbeb; border-left: 5px solid var(--accent); padding: 15px; margin-bottom: 20px; border-radius: 6px; display: flex; gap: 15px; align-items: center; justify-content: space-between; }
        .print-controls div { display: flex; gap: 10px; }

        /* === PENGATURAN CETAK (PRINT) KERTAS F4 === */
        @media print {
            @page {
                size: 215mm 330mm; /* UKURAN KERTAS F4 */
                margin: 15mm;
            }
            body { background-color: white; color: black; margin: 0; padding: 0; }
            .container { max-width: 100%; width: 100%; padding: 0; }
            .card { box-shadow: none; border: none; padding: 0; margin: 0; }
            
            /* Sembunyikan elemen yang tidak perlu dicetak */
            .no-print { display: none !important; }
            
            /* Hapus background dan warna saat cetak agar hemat tinta, tapi tetap rapi */
            h3 { background: transparent; color: black; border-left: 3px solid black; }
            table { border: 1px solid black; border-radius: 0; }
            th, td { border-bottom: 1px solid black; border-right: 1px solid black; }
            th { background-color: #f1f5f9 !important; color: black; -webkit-print-color-adjust: exact; }
            tr:nth-child(even) td { background-color: transparent; }
            
            /* Hilangkan garis putus-putus pada tanda tangan saat dicetak */
            #ttd-wrapper { border: none !important; background-color: transparent !important; resize: none; }
            .tindak-lanjut-box { border: 1px solid black; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="no-print">
        <h1>RPPM Generator</h1>
        <p class="subtitle">Desain Berwarna • Integrasi AI • Siap Cetak F4</p>
    </div>
    
    <div class="card no-print">
        <h3 style="margin-top:0;">Input Data RPP</h3>
        <div class="form-grid">
            <div class="form-group"><label>Nama Penyusun</label><input type="text" id="nama" value="Nova Haryanto"></div>
            <div class="form-group"><label>Mata Pelajaran</label><input type="text" id="mapel" value="Informatika"></div>
            <div class="form-group"><label>Unit/Materi</label><input type="text" id="materi" value="Konsep Dasar Pemrograman"></div>
            <div class="form-group"><label>Alokasi Waktu</label><input type="text" id="waktu" value="2 x 35 menit (2 JP) 1 Pertemuan"></div>
            <div class="form-group"><label>Fase/Kelas</label><input type="text" id="fase" value="C/V (lima)"></div>
            <div class="form-group"><label>Semester</label><input type="text" id="semester" value="Semester II"></div>
            <div class="form-group"><label>Kepala Sekolah</label><input type="text" id="kepsek" value="Ghoniyah Nasrullah, S.Pd., Gr."></div>
            <div class="form-group"><label>Tempat (Kota)</label><input type="text" id="tempat" value="Bekasi"></div>
            <div class="form-group"><label>Tanggal RPP</label><input type="text" id="tanggal" value="Januari 2026"></div>
        </div>
        <button class="btn-generate" onclick="generateRPPM()">Generate RPP dengan AI 🚀</button>
    </div>

    <div id="loading">✨ Sedang merakit modul pembelajaran dengan AI, mohon tunggu...</div>

    <div id="output-rppm">
        <!-- Panel Kontrol (Hanya muncul sebelum di-print) -->
        <div class="print-controls no-print">
            <div>
                <strong style="color:var(--text);">Persiapan Cetak:</strong>
                <span style="font-size:0.9rem; color:#64748b;">Upload TTD, geser & ubah ukuran dari pojok kanan bawah.</span>
            </div>
            <div>
                <input type="file" id="ttd-upload" accept="image/*" style="display: none;" onchange="loadSignature(event)">
                <button style="background-color: var(--accent); color:#fff;" onclick="document.getElementById('ttd-upload').click()">+ Upload TTD</button>
                <button onclick="window.print()">🖨️ Cetak PDF (F4)</button>
            </div>
        </div>

        <div class="card" id="rppm-document">
            <div class="rppm-title">RENCANA PELAKSANAAN PEMBELAJARAN MENDALAM (RPPM)</div>
            <div id="rppm-content"></div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ⚠️ MASUKKAN URL WEB APP GAS ANDA DI SINI
    // ==========================================
    const gasUrl = "https://script.google.com/macros/s/AKfycbzT3l6WHm9bu9cJTlB0gFklXa8RGKeHg9tYHcaCBbxhPDpAcHHzx1hIlWVR6T_ZB_lWZQ/exec";

    async function generateRPPM() {
        const identitas = {
            nama: document.getElementById('nama').value,
            mapel: document.getElementById('mapel').value,
            materi: document.getElementById('materi').value,
            waktu: document.getElementById('waktu').value,
            fase: document.getElementById('fase').value,
            semester: document.getElementById('semester').value,
            kepsek: document.getElementById('kepsek').value,
            tempat: document.getElementById('tempat').value,
            tanggal: document.getElementById('tanggal').value
        };

        document.getElementById('loading').style.display = 'block';
        document.getElementById('output-rppm').style.display = 'none';

        try {
            const response = await fetch(gasUrl, {
                method: 'POST',
                body: JSON.stringify({ identitas: identitas }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });

            const dataAI = await response.json();
            
            if(dataAI.error) throw new Error(dataAI.error);

            renderRPPM({ ...identitas, ...dataAI });
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('output-rppm').style.display = 'block';

        } catch (error) {
            console.error(error);
            alert("Error: " + error.message);
            document.getElementById('loading').style.display = 'none';
        }
    }

    function renderRPPM(data) {
        const fallback = "-";
        const html = `
            <h3>I. IDENTITAS RPP</h3>
            <table>
                <tr><th>Nama Penyusun</th><td>${data.nama}</td></tr>
                <tr><th>Mata Pelajaran</th><td>${data.mapel}</td></tr>
                <tr><th>Unit/Materi</th><td>${data.materi}</td></tr>
                <tr><th>Alokasi Waktu</th><td>${data.waktu}</td></tr>
                <tr><th>Fase/Kelas</th><td>${data.fase}</td></tr>
                <tr><th>Semester</th><td>${data.semester}</td></tr>
            </table>

            <h3>II. IDENTIFIKASI</h3>
            <table>
                <tr>
                    <th>Profil Murid</th>
                    <td>
                        <strong>Pengetahuan Awal:</strong><br><span class="ai-text">${data.profil_pengetahuan || fallback}</span><br><br>
                        <strong>Minat Belajar:</strong><br><span class="ai-text">${data.profil_minat || fallback}</span>
                    </td>
                </tr>
                <tr>
                    <th>Analisis Materi</th>
                    <td>
                        <strong>Cakupan Materi:</strong><br><span class="ai-text">${data.analisis_cakupan || fallback}</span><br><br>
                        <strong>Relevansi Kontekstual:</strong><br><span class="ai-text">${data.analisis_relevansi || fallback}</span>
                    </td>
                </tr>
                <tr>
                    <th>Dimensi Profil Lulusan</th>
                    <td>
                        <ol type="a">
                            <li><strong>Keimanan dan Ketaqwaan:</strong> <span class="ai-text">${data.dimensi_keimanan || fallback}</span></li>
                            <li><strong>Kewargaan:</strong> <span class="ai-text">${data.dimensi_kewargaan || fallback}</span></li>
                            <li><strong>Penalaran Kritis:</strong> <span class="ai-text">${data.dimensi_penalaran || fallback}</span></li>
                            <li><strong>Kreativitas:</strong> <span class="ai-text">${data.dimensi_kreativitas || fallback}</span></li>
                            <li><strong>Kolaborasi:</strong> <span class="ai-text">${data.dimensi_kolaborasi || fallback}</span></li>
                            <li><strong>Kemandirian:</strong> <span class="ai-text">${data.dimensi_kemandirian || fallback}</span></li>
                            <li><strong>Kesehatan:</strong> <span class="ai-text">${data.dimensi_kesehatan || fallback}</span></li>
                            <li><strong>Komunikasi:</strong> <span class="ai-text">${data.dimensi_komunikasi || fallback}</span></li>
                        </ol>
                    </td>
                </tr>
            </table>

            <h3>III. DESAIN PEMBELAJARAN</h3>
            <table>
                <tr><th>Capaian Pembelajaran</th><td class="ai-text">${data.capaian || fallback}</td></tr>
                <tr><th>Lintas Disiplin Ilmu</th><td>-</td></tr>
                <tr><th>Tujuan Pembelajaran</th><td class="ai-text">${data.tujuan || fallback}</td></tr>
                <tr><th>Praktik Pedagogis</th><td>Pembelajaran kontekstual<br>Diskusi kelompok</td></tr>
                <tr><th>Kemitraan Pembelajaran</th><td>-</td></tr>
                <tr>
                    <th>Lingkungan Pembelajaran</th>
                    <td><strong>Ruang fisik:</strong> kelas, lab komputer<br><strong>Budaya belajar:</strong> memberikan kesempatan mengeksplorasi materi.</td>
                </tr>
                <tr>
                    <th>Pemanfaatan Digital</th>
                    <td><strong>Perencanaan:</strong> -<br><strong>Proses:</strong> -<br><strong>Asesmen:</strong> Canva</td>
                </tr>
            </table>

            <h3>IV. PENGALAMAN BELAJAR</h3>
            <table>
                <tr>
                    <th>Pertemuan I</th>
                    <td>
                        <strong>Kegiatan Awal (bermakna)</strong><br>
                        - Guru memulai dengan salam, doa bersama, dan melakukan presensi.<br>
                        - Memaparkan tujuan pembelajaran yang akan dicapai yaitu ${data.tujuan || fallback}<br><br>

                        <strong>Kegiatan Inti</strong><br>
                        <em>Memahami:</em><br><span class="ai-text">${data.kegiatan_memahami || fallback}</span><br><br>
                        <em>Mengaplikasi:</em><br><span class="ai-text">${data.kegiatan_mengaplikasi || fallback}</span><br><br>
                        <em>Merefleksi:</em><br><span class="ai-text">${data.kegiatan_merefleksi || fallback}</span><br><br>

                        <strong>Kegiatan Penutup</strong><br><span class="ai-text">${data.kegiatan_penutup || fallback}</span>
                    </td>
                </tr>
            </table>

            <h3>V. ASESMEN PEMBELAJARAN</h3>
            <table>
                <tr><th>Jenis Asesmen</th><td><strong>Teknik dan Instrumen</strong></td></tr>
                <tr><th>1. Asesmen Awal</th><td>Pretest: kuis singkat</td></tr>
                <tr><th>2. Asesmen Proses</th><td><strong>Observasi:</strong> <span class="ai-text">${data.asesmen_observasi || fallback}</span><br><br><strong>Penilaian Kinerja:</strong> <span class="ai-text">${data.asesmen_kinerja || fallback}</span></td></tr>
                <tr><th>3. Asesmen Akhir</th><td>Latihan soal</td></tr>
            </table>

            <h3>VI. LAYANAN DIFERENSIASI</h3>
            <table>
                <tr><th>1. Pengayaan</th><td class="ai-text">${data.pengayaan || fallback}</td></tr>
                <tr><th>2. Remedial</th><td class="ai-text">${data.remedial || fallback}</td></tr>
            </table>

            <h3>VII. CATATAN TINDAK LANJUT</h3>
            <div class="tindak-lanjut-box"></div>

            <div class="signature-box">
                <div>
                    <p>Mengetahui,<br>Kepala Sekolah</p>
                    <br><br><br>
                    <p><strong>${data.kepsek}</strong></p>
                </div>
                <div id="area-ttd-guru">
                    <p>${data.tempat}, ${data.tanggal}<br>Guru Bidang Studi</p>
                    
                    <!-- Kotak Tanda Tangan yang bisa di drag -->
                    <div id="ttd-wrapper">
                        <img id="ttd-image" src="" alt="Tanda Tangan">
                    </div>

                    <br><br><br><br><br>
                    <p><strong>${data.nama}</strong></p>
                </div>
            </div>
        `;
        document.getElementById('rppm-content').innerHTML = html;
        
        // Aktifkan fungsi drag setelah elemen di-render ke DOM
        dragElement(document.getElementById("ttd-wrapper"));
    }

    // Fungsi Load Gambar Tanda Tangan
    function loadSignature(event) {
        const image = document.getElementById('ttd-image');
        const wrapper = document.getElementById('ttd-wrapper');
        image.src = URL.createObjectURL(event.target.files[0]);
        wrapper.style.display = "block"; // Munculkan kotak setelah upload
    }

    // Fungsi Drag and Drop Murni JavaScript
    function dragElement(elmnt) {
        var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        elmnt.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            e = e || window.event;
            // Cegah drag jika user mengklik ujung kanan bawah (area resize)
            if (e.offsetX > elmnt.offsetWidth - 20 && e.offsetY > elmnt.offsetHeight - 20) return;
            
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }
</script>

</body>
</html>
