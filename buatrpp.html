<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Modul Ajar Final</title>

    <style>
        :root {
            --primary: #0284c7; 
            --primary-hover: #0369a1;
            --accent: #f59e0b; 
            --bg: #f0f9ff;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #bae6fd;
            --table-row: #f8fafc;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.5; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; position: relative; }
        
        h1 { text-align: center; color: var(--primary); font-size: 2rem; margin-bottom: 5px; text-transform: uppercase; font-weight: 800; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-weight: 500; }
        
        .card { background-color: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 25px; border-top: 5px solid var(--primary); }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; color: #334155; }
        input, select { padding: 10px; border: 2px solid var(--border); border-radius: 6px; font-size: 1rem; transition: border-color 0.2s; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.4); }
        button:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-generate { width: 100%; margin-top: 20px; font-size: 1.1rem; padding: 15px; }
        
        #rppm-document { padding: 40px; background-color: #ffffff; position: relative; }
        
        /* Modul Ajar Table Styles */
        .modul-header { width: 100%; margin-bottom: 20px; border: none; }
        .modul-header td { padding: 4px; border: none; background: transparent; font-weight: bold; font-size: 1rem; }
        .modul-header td:first-child { width: 25%; }
        
        .modul-title { text-align: center; font-weight: bold; font-size: 1.3rem; margin: 20px 0; text-transform: uppercase; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; border: 2px solid var(--border); overflow: hidden; }
        th, td { padding: 12px 15px; vertical-align: top; border: 1px solid var(--border); }
        th { background-color: var(--primary); color: white; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 0.5px; }
        .section-header { background-color: #e0f2fe; font-weight: bold; text-align: left; text-transform: uppercase; color: var(--primary-hover); font-size: 1.1rem; }
        
        ul, ol { margin: 0; padding-left: 20px; }
        .ai-text { white-space: pre-wrap; display: block; }
        
        .signature-box { display: flex; justify-content: space-between; margin-top: 40px; }
        .sig-col { width: 45%; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .sig-space { position: relative; width: 100%; height: 60px; display: flex; justify-content: center; align-items: center; margin: 10px 0; }
        
        #ttd-wrapper {
            position: absolute; width: 150px; height: 100px; border: 2px dashed var(--accent); background-color: rgba(245, 158, 11, 0.1);
            resize: both; overflow: hidden; cursor: move; display: none; z-index: 100;
        }
        #ttd-image { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        #loading { text-align: center; display: none; padding: 20px; font-weight: bold; color: var(--primary); font-size: 1.1rem; }
        #output-rppm { display: none; }
        
        .print-controls { background-color: #fffbeb; border-left: 5px solid var(--accent); padding: 15px; margin-bottom: 20px; border-radius: 6px; display: flex; gap: 15px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .print-controls div { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;}
        
        .pb-mode-active { outline: 3px dashed #ef4444; background-color: #fef2f2 !important; }
        .pb-mode-active .section-header:hover, .pb-mode-active tr:hover, .pb-mode-active .signature-box:hover { border-top: 5px solid #ef4444 !important; cursor: crosshair; opacity: 0.8; box-shadow: 0 -5px 10px rgba(239, 68, 68, 0.2); }
        
        .custom-page-break { width: 100%; height: 0; overflow: hidden; padding: 0; margin: 0; border: none; background: transparent; color: transparent; font-size: 0; line-height: 0; }
        .pb-mode-active .custom-page-break { height: auto; overflow: visible; padding: 8px 0; margin: 15px 0; background-color: #fee2e2; border: 2px dashed #ef4444; color: #ef4444; font-size: 0.9rem; line-height: 1.6; text-align: center; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .pb-mode-active .custom-page-break:hover { background-color: #fca5a5; color: white; }

        .editable-text { outline: none; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; transition: all 0.2s; display: inline-block; min-width: 20px; }
        .editable-text:hover, .editable-text:focus { background-color: #fef9c3; box-shadow: 0 0 0 2px #fde047; cursor: text; }

        @media print {
            @page { size: 215mm 330mm; margin: 10mm; }
            body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; background-color: white; }
            .container { max-width: 100%; width: 100%; padding: 0; }
            .card { box-shadow: none; border: none; padding: 0; margin: 0; }
            #rppm-document { padding: 0; }
            .no-print { display: none !important; }
            .custom-page-break { page-break-before: always !important; break-before: page !important; }
            tr, .signature-box { page-break-inside: avoid; break-inside: avoid; }
            #ttd-wrapper { border: none !important; background-color: transparent !important; resize: none !important; }
            .editable-text { padding: 0; margin: 0; background-color: transparent !important; box-shadow: none !important; }
            table { border: 1px solid black; }
            th, td { border: 1px solid black; }
            .section-header { background-color: #f1f5f9 !important; color: black; border: 1px solid black; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card no-print">
        <h3 style="margin-top:0;">Input Data Modul Ajar</h3>
        <div class="form-grid">
            <div class="form-group"><label>Nama Penyusun</label><input type="text" id="nama" value="RIA MARYANAH"></div>
            <div class="form-group"><label>NIP</label><input type="text" id="nip" value="-"></div>
            <div class="form-group"><label>Nama Sekolah</label><input type="text" id="sekolah" value="SDIT AL-BURHANIYAH"></div>
            <div class="form-group"><label>Mata Pelajaran</label><input type="text" id="mapel" value="MATEMATIKA"></div>
            <div class="form-group"><label>Fase / Kelas</label><input type="text" id="fase" value="A / 2 (Dua)"></div>
            <div class="form-group"><label>Semester</label><input type="text" id="semester" value="1"></div>
            <div class="form-group"><label>Tahun Ajaran</label><input type="text" id="tahun" value="2026 - 2027"></div>
            <div class="form-group"><label>Materi Pokok</label><input type="text" id="materi" value="Ayo Membilang sampai dengan 50"></div>
            <div class="form-group"><label>Alokasi Waktu</label><input type="text" id="waktu" value="2 JP = 2 x 35 menit"></div>
            <div class="form-group"><label>Jumlah Siswa</label><input type="text" id="siswa" value="28 Siswa"></div>
            <div class="form-group">
                <label>Jenis Guru</label>
                <select id="jenis_guru">
                    <option value="Guru Kelas">Guru Kelas</option>
                    <option value="Guru Bidang Studi">Guru Bidang Studi</option>
                </select>
            </div>
            <div class="form-group"><label>Kepala Sekolah</label><input type="text" id="kepsek" value="ROSANDI, S.Pd.I"></div>
            <div class="form-group"><label>Tempat (Kota)</label><input type="text" id="tempat" value="Bekasi"></div>
            <div class="form-group"><label>Tanggal Modul</label><input type="text" id="tanggal" value="Juli 2026"></div>
        </div>
        <button class="btn-generate" onclick="generateRPPM()">Generate Modul Ajar dengan AI 🚀</button>
    </div>

    <div id="loading">✨ Sedang merakit modul pembelajaran dengan AI, mohon tunggu...</div>

    <div id="output-rppm">
        <div class="print-controls no-print">
            <div style="flex-direction: column; align-items: flex-start; gap: 5px;">
                <strong style="color:var(--text);">Persiapan Cetak:</strong>
                <span style="font-size:0.85rem; color:#64748b;">1. Klik teks untuk edit manual &nbsp;|&nbsp; 2. Atur batas halaman &nbsp;|&nbsp; 3. Upload & atur TTD &nbsp;|&nbsp; 4. Cetak PDF</span>
            </div>
            <div>
                <button id="btn-pb" style="background-color: #ef4444; color:#fff;" onclick="togglePageBreakMode()">✂️ Atur Batas Halaman</button>
                <input type="file" id="ttd-upload" accept="image/*" style="display: none;" onchange="loadSignature(event)">
                <button style="background-color: var(--accent); color:#fff;" onclick="document.getElementById('ttd-upload').click()">+ Upload TTD</button>
                <button onclick="downloadPDF()">🖨️ Cetak / Save PDF (F4)</button>
            </div>
        </div>

        <div class="card" id="rppm-document">
            <div id="rppm-content"></div>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // ⚠️ PASTIKAN URL INI ADALAH URL DARI "DEPLOYMENT BARU" GOOGLE APPS SCRIPT
    // =========================================================================
    const gasUrl = "https://script.google.com/macros/s/AKfycbzNNR8ao5lJ_ze_vVemKNtDogBFFciXmtFxjVjnbf3tzebWc6TVwiteClqa00wWwDqtnw/exec";

    // Auto Save Logic
    const inputIds = ['nama', 'nip', 'sekolah', 'mapel', 'fase', 'semester', 'tahun', 'materi', 'waktu', 'siswa', 'jenis_guru', 'kepsek', 'tempat', 'tanggal'];
    
    function saveInputData() {
        const formData = {};
        inputIds.forEach(id => formData[id] = document.getElementById(id).value);
        localStorage.setItem('modulFormData', JSON.stringify(formData));
    }

    function loadInputData() {
        const savedData = localStorage.getItem('modulFormData');
        if (savedData) {
            const formData = JSON.parse(savedData);
            inputIds.forEach(id => {
                if(formData[id]) document.getElementById(id).value = formData[id];
            });
        }
    }

    window.addEventListener('DOMContentLoaded', loadInputData);
    document.querySelectorAll('.form-grid input, .form-grid select').forEach(el => el.addEventListener('input', saveInputData));

    async function generateRPPM() {
        saveInputData();
        const identitas = {};
        inputIds.forEach(id => identitas[id] = document.getElementById(id).value);

        document.getElementById('loading').style.display = 'block';
        document.getElementById('output-rppm').style.display = 'none';

        try {
            const response = await fetch(gasUrl, {
                method: 'POST',
                body: JSON.stringify({ identitas: identitas }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });

            const dataAI = await response.json();
            if(dataAI.error) throw new Error(dataAI.error);

            renderRPPM({ ...identitas, ...dataAI });
            document.getElementById('loading').style.display = 'none';
            document.getElementById('output-rppm').style.display = 'block';

        } catch (error) {
            console.error(error);
            alert("Koneksi ke AI Gagal. Pastikan URL GAS sudah diperbarui ke Deployment Terbaru!\nDetail Error: " + error.message);
            document.getElementById('loading').style.display = 'none';
        }
    }

    function renderRPPM(data) {
        function bersihkanTeks(val) {
            if (!val) return "-"; 
            if (typeof val === 'object') { val = Object.values(val).join('\n\n'); }
            return val.toString().replace(/\\n/g, '\n'); 
        }

        const html = `
            <div class="modul-title">
                MODUL PEMBELAJARAN<br>
                KELAS <span class="editable-text" contenteditable="true">${bersihkanTeks(data.fase).split('/')[1] || data.fase}</span> FASE <span class="editable-text" contenteditable="true">${bersihkanTeks(data.fase).split('/')[0] || data.fase}</span>
            </div>

            <table>
                <tr><td colspan="3" class="section-header">A. INFORMASI UMUM</td></tr>
                <tr><td colspan="3" style="background:#f8fafc; font-weight:bold; text-align:center;">IDENTITAS SEKOLAH</td></tr>
                <tr>
                    <td style="width: 30%; font-weight:bold;">Nama Penyusun</td>
                    <td colspan="2"><span class="editable-text" contenteditable="true">${bersihkanTeks(data.nama)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">NIP</td>
                    <td colspan="2"><span class="editable-text" contenteditable="true">${bersihkanTeks(data.nip)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Nama Sekolah</td>
                    <td colspan="2"><span class="editable-text" contenteditable="true">${bersihkanTeks(data.sekolah)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Alokasi Waktu</td>
                    <td colspan="2"><span class="editable-text" contenteditable="true">${bersihkanTeks(data.waktu)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Mapel</td>
                    <td colspan="2"><span class="editable-text" contenteditable="true">${bersihkanTeks(data.mapel)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Jumlah Siswa</td>
                    <td colspan="2"><span class="editable-text" contenteditable="true">${bersihkanTeks(data.siswa)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Fase</td>
                    <td colspan="2"><span class="editable-text" contenteditable="true">${bersihkanTeks(data.fase)} Semester : ${bersihkanTeks(data.master)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Materi Pokok</td>
                    <td colspan="2"><span class="editable-text" contenteditable="true">${bersihkanTeks(data.materi)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Capaian Pembelajaran</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.cp)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Profil Pelajar Pancasila</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.profil_pancasila)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">8 Profil Lulusan</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true"><strong>Keimanan dan Ketakwaan terhadap Tuhan YME</strong><br>${bersihkanTeks(data.profil_keimanan)}</span></td>
                </tr>    
                    <tr><td></td><td colspan="2"><strong>Kewargaan</strong><br>${bersihkanTeks(data.profil_kewargaan)}
                </tr>    
                    <tr><td></td><td colspan="2"><span class="ai-text editable-text" contenteditable="true"><strong>Penalaran Kritis</strong><br>${bersihkanTeks(data.profil_penalaran)}</span></td>
                </tr>    
                    <tr><td></td><td colspan="2"><span class="ai-text editable-text" contenteditable="true"><strong>Kreativitas</strong><br>${bersihkanTeks(data.profil_kreativitas)}</span></td>
                </tr>    
                    <tr><td></td><td colspan="2"><span class="ai-text editable-text" contenteditable="true"><strong>Kolaborasi</strong><br>${bersihkanTeks(data.profil_kolaborasi)}</span></td>
                </tr>    
                    <tr><td></td><td colspan="2"><span class="ai-text editable-text" contenteditable="true"><strong>Kemandirian</strong><br>${bersihkanTeks(data.profil_kemandirian)}</span></td>
                </tr>    
                    <tr><td></td><td colspan="2"><span class="ai-text editable-text" contenteditable="true"><strong>Kesehatan</strong><br>${bersihkanTeks(data.profil_kesehatan)}</span></td>
                </tr>    
                    <tr><td></td><td colspan="2"><span class="ai-text editable-text" contenteditable="true"><strong>Komunikasi</strong><br>${bersihkanTeks(data.profil_komunikasi)}</span></td>
                </tr>

                <tr><td colspan="3" class="section-header">KOMPETENSI AWAL</td></tr>
                <tr>
                    <td style="font-weight:bold;">Sarana Prasarana</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.sarpras)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Target Peserta Didik</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.target_siswa)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Diferensiasi</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.diferensiasi)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Model Pembelajaran</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.model_pembelajaran)}</span></td>
                </tr>

                <tr><td colspan="3" class="section-header">KEGIATAN INTI</td></tr>
                <tr>
                    <td style="font-weight:bold;">Cakupan Elemen</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.cakupan_elemen)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Kata Kunci</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.kata_kunci)}</span></td>
                </tr>

                <tr><td colspan="3" class="section-header">PEMAHAMAN MATERI</td></tr>
                <tr>
                    <td style="font-weight:bold;">Materi yang dapat diamati</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.pemahaman_materi)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Tujuan Pembelajaran</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.tujuan_pembelajaran)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Pertanyaan Pemantik</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.pemantik)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Ketersediaan Materi</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.ketersediaan_materi)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Assesmen</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.jenis_asesmen)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Unit Kegiatan</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.unit_kegiatan)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Persiapan Pembelajaran</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.persiapan_pembelajaran)}</span></td>
                </tr>

                <tr><td colspan="3" class="section-header">ALUR TUJUAN PEMBELAJARAN</td></tr>
                <tr><td colspan="3" style="background:#f8fafc; font-weight:bold; text-align:center;">PEMBELAJARAN 1 PERTEMUAN</td></tr>
                <tr>
                    <td style="font-weight:bold;">PENDAHULUAN</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.p1_pendahuluan)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">KEGIATAN INTI</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.p1_inti)}</span></td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">PENUTUP</td>
                    <td colspan="2"><span class="ai-text editable-text" contenteditable="true">${bersihkanTeks(data.p1_penutup)}</span></td>
                </tr>

                <tr><td colspan="3" class="section-header">ASESMEN</td></tr>
            </table>

            <!-- Static Asesmen Tables -->
            <div style="margin-bottom: 20px;">
                <strong>Asesmen Sikap</strong><br>
                Penilaian sikap ini dilakukan melalui pengamatan (observasi) Guru selama kegiatan pembelajaran. Bentuk pedoman penilaian yang dapat digunakan oleh Guru adalah sebagai berikut.
                <table style="margin-top: 10px; text-align: center;">
                    <tr>
                        <th>Kriteria</th>
                        <th>Sangat baik (4)</th>
                        <th>Baik (3)</th>
                        <th>Cukup (2)</th>
                        <th>Perlu dikembangkan (1)</th>
                    </tr>
                    <tr>
                        <td style="text-align:left; font-weight:bold;">Sopan santun</td>
                        <td>Peserta didik berlaku sopan, baik selama proses pembelajaran maupun di luar kelas.</td>
                        <td>Peserta didik berlaku sopan hanya selama proses pembelajaran.</td>
                        <td>Peserta didik hanya berlaku sopan hanya kepada Guru atau peserta didik yang lain.</td>
                        <td>Peserta didik belum menampakkan perilaku sopan.</td>
                    </tr>
                    <tr>
                        <td style="text-align:left; font-weight:bold;">Percaya diri</td>
                        <td>Peserta didik berani berpendapat, bertanya, atau menjawab pertanyaan, serta mengambil keputusan.</td>
                        <td>Peserta didik berani berpendapat, bertanya, atau menjawab pertanyaan.</td>
                        <td>Peserta didik hanya berani menjawab hanya saat Guru bertanya.</td>
                        <td>Peserta didik kesulitan dalam berpendapat, bertanya, maupun menjawab pertanyaan.</td>
                    </tr>
                    <tr>
                        <td style="text-align:left; font-weight:bold;">Toleransi</td>
                        <td>Dapat menghargai pendapat peserta didik lain dan menerima kesepakatan meskipun berbeda pendapat.</td>
                        <td>Dapat menghargai pendapat peserta didik lain dan kurang bisa menerima kesepakatan.</td>
                        <td>Dapat menghargai pendapat peserta didik lain dan tidak bisa menerima kesepakatan.</td>
                        <td>Tidak dapat menghargai pendapat peserta didik lain dan tidak bisa menerima kesepakatan.</td>
                    </tr>
                </table>
            </div>

            <div style="margin-bottom: 20px;">
                <strong>Asesmen Pengetahuan</strong><br>
                Penilaian pengetahuan dilaksanakan melalui tes setelah kegiatan pembelajaran berlangsung.

    let isPageBreakMode = false;
    function togglePageBreakMode() {
        isPageBreakMode = !isPageBreakMode;
        const doc = document.getElementById('rppm-document');
        const btn = document.getElementById('btn-pb');
        
        if (isPageBreakMode) {
            doc.classList.add('pb-mode-active');
            btn.innerHTML = '✅ Selesai Atur Batas';
            btn.style.backgroundColor = '#16a34a';
            alert("MODE BATAS HALAMAN AKTIF!\nArahkan mouse dan KLIK pada Baris yang ingin didorong ke halaman selanjutnya.");
        } else {
            doc.classList.remove('pb-mode-active');
            btn.innerHTML = '✂️ Atur Batas Halaman';
            btn.style.backgroundColor = '#ef4444';
        }
    }

    document.addEventListener('click', function(e) {
        if (!isPageBreakMode) return;
        const doc = document.getElementById('rppm-document');
        if (doc.contains(e.target)) {
            if (e.target.classList.contains('custom-page-break')) {
                e.target.remove();
                return;
            }
            const target = e.target.closest('tr, .signature-box');
            if (target) {
                const pb = document.createElement('div');
                pb.className = 'custom-page-break'; 
                pb.innerHTML = '✂️ BATAS HALAMAN (Teks di bawah ini pindah ke halaman baru) - Klik untuk hapus';
                target.parentNode.insertBefore(pb, target);
            }
        }
    });

    function loadSignature(event) {
        const image = document.getElementById('ttd-image');
        const wrapper = document.getElementById('ttd-wrapper');
        image.src = URL.createObjectURL(event.target.files[0]);
        wrapper.style.display = "block"; 
    }

    function dragElement(elmnt) {
        var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        elmnt.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            if (isPageBreakMode) return;
            e = e || window.event;
            if (e.offsetX > elmnt.offsetWidth - 20 && e.offsetY > elmnt.offsetHeight - 20) return;
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    function downloadPDF() {
        if (isPageBreakMode) {
            alert("Harap selesaikan Mode Batas Halaman sebelum mencetak/save PDF.");
            return;
        }
        
        const editables = document.querySelectorAll('.editable-text');
        editables.forEach(el => el.setAttribute('contenteditable', 'false'));
        
        const originalTitle = document.title;
        let namaMateri = document.getElementById('materi').value.trim();
        namaMateri = namaMateri.replace(/[^a-zA-Z0-9 ]/g, "").replace(/\s+/g, "_");
        if(namaMateri === "") namaMateri = "Modul_Ajar";
        
        document.title = 'ModulAjar_' + namaMateri;
        window.print();
        
        setTimeout(() => {
            document.title = originalTitle;
            editables.forEach(el => el.setAttribute('contenteditable', 'true'));
        }, 1000);
    }
</script>
