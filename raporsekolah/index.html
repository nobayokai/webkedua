<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk - Rapor Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<div id="login">
 <div class="lbox">
  <div class="lart">🧒📖</div>
  <form id="lf">
   <h1>Masuk ke <b>Rapor Digital</b></h1>
   <p class="muted">Lanjutkan pengisian rapor sekarang!</p>
   <label>Username *</label><input id="lu" placeholder="Masukkan username" required autofocus>
   <label>Password *</label><input id="lp" type="password" placeholder="Masukkan password" required>
   <button>Masuk</button>
  </form>
 </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
