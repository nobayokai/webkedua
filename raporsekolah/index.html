<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk - Rapor Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</head>
<body class="lg-page">
<div class="lg-blob b1"></div><div class="lg-blob b2"></div><div class="lg-blob b3"></div>
<div class="lg-wrap">
 <div class="lg-card">
  <div class="lg-photo"><img src="img/login.jpg" alt="Guru sedang mengisi rapor"></div>
  <form id="lf" class="lg-form">
   <h1>Selamat Datang</h1>
   <p class="lg-sub">Masuk ke akun Rapor Digital</p>
   <label for="lu">Username</label><input id="lu" placeholder="Username Anda" required autofocus autocomplete="username">
   <label for="lp">Password</label><input id="lp" type="password" placeholder="Password Anda" required autocomplete="current-password">
   <p class="lg-hint">Lupa password? Hubungi admin sekolah.</p>
   <button>Masuk</button>
   <div class="lg-foot"><span>Belum punya akun?</span><b>HUBUNGI ADMIN</b></div>
  </form>
 </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
