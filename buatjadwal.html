<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Pelajaran Super Dinamis</title>
    <style>
        /* DESAIN PREMIUM & MODERN */
        body { font-family: 'Arial', sans-serif; background: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; font-size: 13px; }
        .kop-sekolah { text-align: center; margin-bottom: 20px; line-height: 1.4; }
        .kop-sekolah h1 { margin: 0; font-size: 18px; color: #047857; font-family: 'Georgia', serif; font-weight: 900; }
        .kop-sekolah h2 { margin: 0; font-size: 22px; color: #10b981; font-weight: 900; text-transform: uppercase; }
        .kop-sekolah h3 { margin: 0; font-size: 14px; color: #374151; font-weight: bold; text-transform: uppercase; }

        .btn-action-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;}
        .btn-action { padding: 10px 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; }
        .btn-action:hover { transform: translateY(-2px); }
        .btn-print { background: #ef4444; } .btn-print:hover { background: #dc2626; }
        .btn-setting { background: #3b82f6; } .btn-setting:hover { background: #2563eb; }
        .btn-perkelas { background: #f59e0b; } .btn-perkelas:hover { background: #d97706; }

        /* KOTAK MASTER DATA */
        .master-data-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .master-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #10b981; display: flex; flex-direction: column; }
        .master-card h4 { margin: 0 0 10px 0; color: #047857; border-bottom: 1px dashed #ccc; padding-bottom: 5px; display: flex; justify-content: space-between;}
        
        .master-list { flex: 1; display: flex; flex-direction: column; gap: 5px; max-height: 150px; overflow-y: auto; margin-bottom: 10px; padding-right: 5px; }
        .master-item { background: #f9fafb; padding: 4px 8px; border-radius: 6px; border: 1px solid #e5e7eb; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 11px; transition: 0.2s;}
        .master-item:hover { border-color: #9ca3af; }
        
        .edit-input { border: 1px solid transparent; background: transparent; font-weight: bold; font-family: inherit; font-size: 11px; color: #1f2937; padding: 2px 4px; outline: none; border-radius: 4px; flex: 1; width: 100%; transition: 0.2s; }
        .edit-input:focus { background: white; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
        .kode { color: #ef4444; font-weight: 900; display: inline-block; min-width: 25px; }
        
        .btn-delete { background: #fee2e2; color: #ef4444; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; padding: 2px 6px; font-size: 10px; }
        .btn-delete:hover { background: #ef4444; color: white; }

        .form-add { display: flex; gap: 5px; margin-top: auto; flex-wrap: wrap;}
        .form-add input, .form-add select { flex: 1; padding: 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 11px; outline: none; }
        .form-add input:focus { border-color: #10b981; }
        .btn-add { background: #10b981; color: white; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .btn-add:hover { background: #059669; }

        /* TABEL JADWAL RAKSASA */
        .table-wrapper { background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: auto; max-height: 65vh; border: 1px solid #d1d5db; }
        table { border-collapse: separate; border-spacing: 0; width: max-content; }
        th, td { border: 1px solid #e5e7eb; padding: 4px 2px; text-align: center; vertical-align: middle; }
        
        thead th { position: sticky; top: 0; z-index: 10; color: white; text-transform: uppercase; font-size: 12px; font-weight: 900; letter-spacing: 0.5px;}
        thead tr:nth-child(2) th { top: 32px; font-size: 11px; z-index: 9; color: #1f2937; border-bottom: 2px solid rgba(0,0,0,0.1); }
        
        .jam-col { position: sticky; left: 0; background: #ffffff; z-index: 11; font-weight: 900; font-size: 11px; width: 95px; color: #374151; box-shadow: 2px 0 5px rgba(0,0,0,0.05); border-right: 2px solid #d1d5db;}
        thead th:first-child { z-index: 12; left: 0; background: #1f2937 !important; border-right: 2px solid #d1d5db;}

        /* TEMA WARNA HARI */
        .theme-SENIN { background: #eff6ff !important; } .head-SENIN { background: #3b82f6 !important; } 
        .theme-SELASA { background: #f0fdf4 !important; } .head-SELASA { background: #22c55e !important; } 
        .theme-RABU { background: #fefce8 !important; } .head-RABU { background: #eab308 !important; } 
        .theme-KAMIS { background: #faf5ff !important; } .head-KAMIS { background: #a855f7 !important; } 
        .theme-JUMAT { background: #fdf2f8 !important; } .head-JUMAT { background: #ec4899 !important; } 

        .input-kode { width: 45px; height: 26px; border: 1px solid rgba(0,0,0,0.1); border-radius: 4px; text-align: center; font-size: 12px; font-weight: 900; color: #1f2937; outline: none; background: rgba(255,255,255,0.7); transition: 0.2s; text-transform: uppercase; }
        .input-kode:focus { border-color: #1f2937; background: white; box-shadow: 0 0 0 2px rgba(31,41,55,0.2); transform: scale(1.1); z-index: 20; position: relative;}
        .input-kode.error { border-color: #ef4444 !important; background: #fef2f2 !important; color: #b91c1c !important; animation: shake 0.3s ease-in-out; }
        
        .td-disabled { background: #d1d5db !important; background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.05) 5px, rgba(0,0,0,0.05) 10px) !important; color: #9ca3af; font-size: 16px; font-weight:bold; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        #toast-bentrok { visibility: hidden; min-width: 300px; background-color: #ef4444; color: #fff; text-align: center; border-radius: 10px; padding: 15px 20px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; font-size: 14px; box-shadow: 0 10px 25px rgba(239,68,68,0.4); opacity: 0; transition: 0.3s; display: flex; align-items: center; gap: 12px; }
        #toast-bentrok.show { visibility: visible; opacity: 1; bottom: 50px; }

        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:99999; justify-content:center; align-items:center; backdrop-filter: blur(3px); }
        .modal-card { background:white; padding:25px; border-radius:12px; width:90%; max-width:400px; text-align:center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .modal-card input, .modal-card select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; font-family: inherit;}
        .modal-card label { display: block; text-align: left; font-size: 11px; font-weight: bold; color: #4b5563; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="kop-sekolah">
        <h1>YAYASAN PENDIDIKAN ISLAM</h1>
        <h2 id="kop-nama-sekolah">SDIT HIDAYATUT TAUFIQ</h2>
        <h3 id="kop-ta">JADWAL MATA PELAJARAN DINAMIS - T.A 2024/2025</h3>
    </div>

    <!-- TOMBOL AKSI UTAMA -->
    <div class="btn-action-group">
        <button class="btn-action btn-setting" onclick="bukaPengaturan()">⚙️ Pengaturan & TTD</button>
        <button class="btn-action btn-print" onclick="cetakJadwalGlobalPdf()">🖨️ Cetak Jadwal Global</button>
        <button class="btn-action btn-perkelas" onclick="bukaModalPerKelas()">🎨 Cetak Per Kelas</button>
    </div>

    <!-- PENGATURAN MASTER DATA -->
    <div class="master-data-container">
        <!-- Master Guru -->
        <div class="master-card" style="border-top-color: #3b82f6;">
            <h4>👨‍🏫 Master Guru</h4>
            <div class="master-list" id="list-guru"></div>
            <div class="form-add">
                <input type="text" id="add-guru-kode" placeholder="Kode (1)" style="flex:0.3;">
                <input type="text" id="add-guru-nama" placeholder="Nama Guru">
                <button class="btn-add" style="background:#3b82f6;" onclick="tambahMaster('guru')">Tambah</button>
            </div>
        </div>

        <!-- Master Mapel -->
        <div class="master-card" style="border-top-color: #eab308;">
            <h4>📚 Master Mapel</h4>
            <div class="master-list" id="list-mapel"></div>
            <div class="form-add">
                <input type="text" id="add-mapel-kode" placeholder="Kode (AH)" style="flex:0.3;">
                <input type="text" id="add-mapel-nama" placeholder="Nama Mapel">
                <button class="btn-add" style="background:#eab308;" onclick="tambahMaster('mapel')">Tambah</button>
            </div>
        </div>

        <!-- Master Kelas -->
        <div class="master-card" style="border-top-color: #22c55e;">
            <h4>🏫 Master Kelas</h4>
            <div class="master-list" id="list-kelas"></div>
            <div class="form-add">
                <input type="text" id="add-kelas-nama" placeholder="Nama Kelas (Misal: VIA)">
                <button class="btn-add" style="background:#22c55e;" onclick="tambahMaster('kelas')">Tambah</button>
            </div>
        </div>

        <!-- Master Jam Pelajaran -->
        <div class="master-card" style="border-top-color: #a855f7;">
            <h4>⏰ Master Jam / Waktu</h4>
            <div class="master-list" id="list-jam"></div>
            <div class="form-add" style="flex-wrap: wrap;">
                <input type="text" id="add-jam-waktu" placeholder="07.00-08.00" style="flex:1; min-width:80px;" title="Format Jam">
                <select id="add-jam-tipe" style="flex:1;">
                    <option value="pelajaran">Pelajaran</option>
                    <option value="istirahat">Istirahat / Sholat</option>
                    <option value="kegiatan">Kegiatan Awal</option>
                </select>
                <input type="text" id="add-jam-label" placeholder="Nama Kegiatan" style="flex:1.5;">
                <input type="text" id="add-jam-target-hari" placeholder="Target Hari (Cth: SENIN, RABU). Kosong = Tiap Hari" style="flex:100%; margin-top:5px;">
                <input type="text" id="add-jam-target-kelas" placeholder="Target Kelas (Cth: I, IIA). Kosong = Semua Kelas" style="flex:100%; margin-top:5px;">
                <button class="btn-add" style="background:#a855f7; width:100%; margin-top:5px;" onclick="tambahMaster('jam')">Tambah Waktu</button>
            </div>
        </div>
    </div>

    <!-- TABEL JADWAL -->
    <div class="table-wrapper">
        <table id="tabel-jadwal">
            <thead id="thead-jadwal"></thead>
            <tbody id="body-jadwal"></tbody>
        </table>
    </div>

    <div id="toast-bentrok">
        <span style="font-size:24px;">⛔</span>
        <div style="text-align:left;">
            <div style="font-size:12px; opacity:0.8;">Jadwal Bentrok!</div>
            <span id="toast-pesan">Pesan Error</span>
        </div>
    </div>

    <!-- MODAL PENGATURAN UMUM -->
    <div class="modal" id="modal-cetak">
        <div class="modal-card">
            <h3 style="color:#047857; margin-top:0;">⚙️ Pengaturan Cetak & Sekolah</h3>
            
            <label>Nama Sekolah:</label>
            <input type="text" id="set-nama-sekolah" placeholder="SDIT HIDAYATUT TAUFIQ">
            
            <label>Tahun Ajaran / Semester:</label>
            <input type="text" id="set-tahun-ajaran" placeholder="Genap - T.A 2024/2025">

            <label>Nama Kepala Sekolah:</label>
            <input type="text" id="set-nama-kepsek" placeholder="Muhammad Arif, S.Ag">
            
            <label>Upload Stempel & TTD (PNG Transparan):</label>
            <input type="file" id="set-ttd-file" accept="image/png">
            
            <button class="btn-action" style="background:#10b981; width:100%; justify-content:center; padding:12px;" onclick="simpanPengaturanCetak()">💾 Simpan Pengaturan</button>
            <button class="btn-action" style="background:#6b7280; width:100%; justify-content:center; margin-top:10px;" onclick="document.getElementById('modal-cetak').style.display='none'">Tutup</button>
        </div>
    </div>

    <!-- MODAL PILIH KELAS UNTUK DICETAK -->
    <div class="modal" id="modal-cetak-perkelas">
        <div class="modal-card">
            <h3 style="color:#d97706; margin-top:0;">🎨 Cetak Jadwal Per Kelas</h3>
            <label>Pilih Kelas yang ingin dicetak:</label>
            <select id="select-kelas-cetak"></select>
            
            <button class="btn-action btn-perkelas" style="width:100%; justify-content:center; padding:12px; margin-top:10px;" onclick="eksekusiCetakPerKelas()">🚀 Generate & Print PDF</button>
            <button class="btn-action" style="background:#6b7280; width:100%; justify-content:center; margin-top:10px;" onclick="document.getElementById('modal-cetak-perkelas').style.display='none'">Tutup</button>
        </div>
    </div>

<script>
// ==========================================
// 1. STATE MEMORI & DATABASE DEFAULT
// ==========================================
let memoriJadwal = {}; 

let dbGuru = { "1": "Ghoniyah N, S.Pd", "2": "Siti Marlina", "3": "Septy Ratna Wati", "9": "Nova Haryanto", "11": "Nia Damarsari" };
let dbMapel = { "AH": "Aqidah Akhlak", "TIK": "TIK", "F": "Fiqih", "UM": "Umum", "P5": "P5", "BA": "B. Arab", "O": "Olahraga" };
let kelasArray = ["I", "IIA", "IIB", "III", "IV", "VA", "VB", "VI"];
let hariArray = ["SENIN", "SELASA", "RABU", "KAMIS", "JUMAT"];

let waktuArray = [
    { jam: "07.20-07.45", tipe: "kegiatan", label: "UPACARA", targetHari: "SENIN", targetKelas: "" },
    { jam: "07.20-07.45", tipe: "kegiatan", label: "TAHFIDZ", targetHari: "SELASA, KAMIS", targetKelas: "" },
    { jam: "07.20-07.45", tipe: "kegiatan", label: "SLT. DHUHA", targetHari: "RABU", targetKelas: "" },
    { jam: "07.20-07.45", tipe: "kegiatan", label: "SENAM", targetHari: "JUMAT", targetKelas: "" },
    
    { jam: "07.45-08.20", tipe: "pelajaran", label: "", targetHari: "", targetKelas: "" },
    { jam: "08.20-08.55", tipe: "pelajaran", label: "", targetHari: "", targetKelas: "" },
    { jam: "10.05-10.30", tipe: "istirahat", label: "ISTIRAHAT", targetHari: "", targetKelas: "" },
    { jam: "10.30-11.05", tipe: "pelajaran", label: "", targetHari: "", targetKelas: "" }
];

// ==========================================
// 2. FUNGSI PENGATURAN (LOAD & SIMPAN)
// ==========================================
function loadPengaturan() {
    let namaSekolah = localStorage.getItem('jadwal_sekolah') || "SDIT HIDAYATUT TAUFIQ";
    let taSekolah = localStorage.getItem('jadwal_ta') || "Semester Genap - T.A 2024/2025";
    
    document.getElementById('kop-nama-sekolah').textContent = namaSekolah;
    document.getElementById('kop-ta').textContent = `JADWAL MATA PELAJARAN DINAMIS - ${taSekolah}`;
}

function bukaPengaturan() {
    document.getElementById('set-nama-sekolah').value = localStorage.getItem('jadwal_sekolah') || "SDIT HIDAYATUT TAUFIQ";
    document.getElementById('set-tahun-ajaran').value = localStorage.getItem('jadwal_ta') || "Semester Genap - T.A 2024/2025";
    document.getElementById('set-nama-kepsek').value = localStorage.getItem('jadwal_kepsek') || "Muhammad Arif, S.Ag";
    document.getElementById('modal-cetak').style.display='flex';
}

function simpanPengaturanCetak() {
    let f = document.getElementById('set-ttd-file');
    if (f.files.length > 0) {
        let r = new FileReader();
        r.onload = function(e) { localStorage.setItem('jadwal_ttd', e.target.result); };
        r.readAsDataURL(f.files[0]);
    }
    localStorage.setItem('jadwal_sekolah', document.getElementById('set-nama-sekolah').value.toUpperCase());
    localStorage.setItem('jadwal_ta', document.getElementById('set-tahun-ajaran').value.toUpperCase());
    localStorage.setItem('jadwal_kepsek', document.getElementById('set-nama-kepsek').value);
    
    loadPengaturan(); // Update kop layar
    alert('Pengaturan Berhasil Disimpan!');
    document.getElementById('modal-cetak').style.display='none';
}

// ==========================================
// 3. FUNGSI RENDER MASTER & TABEL UTAMA
// ==========================================
function renderMasterLists() {
    const listGuru = document.getElementById('list-guru'); listGuru.innerHTML = '';
    for(let k in dbGuru) { listGuru.innerHTML += `<div class="master-item"><span class="kode">${k}</span><input type="text" class="edit-input" value="${dbGuru[k]}" onchange="editMaster('guru', '${k}', this.value)"><button class="btn-delete" onclick="hapusMaster('guru', '${k}')">✕</button></div>`; }

    const listMapel = document.getElementById('list-mapel'); listMapel.innerHTML = '';
    for(let k in dbMapel) { listMapel.innerHTML += `<div class="master-item"><span class="kode">${k}</span><input type="text" class="edit-input" value="${dbMapel[k]}" onchange="editMaster('mapel', '${k}', this.value)"><button class="btn-delete" onclick="hapusMaster('mapel', '${k}')">✕</button></div>`; }

    const listKelas = document.getElementById('list-kelas'); listKelas.innerHTML = '';
    kelasArray.forEach((k, idx) => { listKelas.innerHTML += `<div class="master-item">🏫 Kelas <input type="text" class="edit-input" value="${k}" onchange="editMaster('kelas', ${idx}, this.value)"><button class="btn-delete" onclick="hapusMaster('kelas', ${idx})">✕</button></div>`; });

    const listJam = document.getElementById('list-jam'); listJam.innerHTML = '';
    waktuArray.forEach((w, idx) => {
        let lbl = w.tipe === 'pelajaran' ? 'Pelajaran' : w.label;
        let tgtH = w.targetHari ? ` <span style="color:#3b82f6;">[H: ${w.targetHari}]</span>` : '';
        let tgtK = w.targetKelas ? ` <span style="color:#ef4444;">[K: ${w.targetKelas}]</span>` : '';
        listJam.innerHTML += `<div class="master-item"><span style="flex:1;">⏰ ${w.jam} <small style="color:#6b7280;">(${lbl})${tgtH}${tgtK}</small></span> <button class="btn-delete" onclick="hapusMaster('jam', ${idx})">✕</button></div>`;
    });
}

function editMaster(tipe, key, newVal) {
    let val = newVal.trim();
    if(!val) return renderSeluruhSistem(); 
    if(tipe === 'guru') dbGuru[key] = val;
    else if(tipe === 'mapel') dbMapel[key] = val;
    else if(tipe === 'kelas') kelasArray[key] = val.toUpperCase();
    renderSeluruhSistem();
}

function tambahMaster(tipe) {
    if(tipe === 'guru') {
        let kode = document.getElementById('add-guru-kode').value.trim().toUpperCase(); let nama = document.getElementById('add-guru-nama').value.trim();
        if(kode && nama) { dbGuru[kode] = nama; document.getElementById('add-guru-kode').value=''; document.getElementById('add-guru-nama').value=''; }
    } else if(tipe === 'mapel') {
        let kode = document.getElementById('add-mapel-kode').value.trim().toUpperCase(); let nama = document.getElementById('add-mapel-nama').value.trim();
        if(kode && nama) { dbMapel[kode] = nama; document.getElementById('add-mapel-kode').value=''; document.getElementById('add-mapel-nama').value=''; }
    } else if(tipe === 'kelas') {
        let nama = document.getElementById('add-kelas-nama').value.trim().toUpperCase();
        if(nama && !kelasArray.includes(nama)) { kelasArray.push(nama); document.getElementById('add-kelas-nama').value=''; }
    } else if(tipe === 'jam') {
        let jam = document.getElementById('add-jam-waktu').value.trim(); let t = document.getElementById('add-jam-tipe').value;
        let lbl = document.getElementById('add-jam-label').value.trim().toUpperCase();
        let tHari = document.getElementById('add-jam-target-hari').value.trim().replace(/\s/g, '').toUpperCase();
        let tKelas = document.getElementById('add-jam-target-kelas').value.trim().replace(/\s/g, '').toUpperCase();
        if(jam) { waktuArray.push({ jam: jam, tipe: t, label: lbl, targetHari: tHari, targetKelas: tKelas }); document.getElementById('add-jam-waktu').value=''; document.getElementById('add-jam-target-hari').value=''; document.getElementById('add-jam-target-kelas').value=''; }
        waktuArray.sort((a,b) => a.jam.localeCompare(b.jam));
    }
    renderSeluruhSistem();
}

function hapusMaster(tipe, key) {
    if(confirm('Yakin ingin menghapus data ini?')) {
        if(tipe === 'guru') delete dbGuru[key]; else if(tipe === 'mapel') delete dbMapel[key]; else if(tipe === 'kelas') kelasArray.splice(key, 1); else if(tipe === 'jam') waktuArray.splice(key, 1);
        renderSeluruhSistem();
    }
}

function renderTabelJadwal() {
    const thead = document.getElementById('thead-jadwal'); const tbody = document.getElementById('body-jadwal');
    let trHari = `<tr><th rowspan="2" style="width:100px;">HARI / WAKTU</th>`; let trKelas = `<tr>`;
    
    if(kelasArray.length === 0) { tbody.innerHTML = `<tr><td style="padding:20px;">Silakan tambahkan Kelas.</td></tr>`; return; }

    hariArray.forEach(hari => {
        trHari += `<th colspan="${kelasArray.length}" class="head-${hari}">${hari}</th>`;
        kelasArray.forEach(kls => { trKelas += `<th class="theme-${hari}">${kls}</th>`; });
    });
    trHari += `</tr>`; trKelas += `</tr>`;
    thead.innerHTML = trHari + trKelas; tbody.innerHTML = '';
    
    let uniqueJams = [...new Set(waktuArray.map(w => w.jam))].sort();

    uniqueJams.forEach(jamStr => {
        let tr = document.createElement('tr');
        let tdJam = document.createElement('td'); tdJam.className = 'jam-col'; tdJam.textContent = jamStr; tr.appendChild(tdJam);

        hariArray.forEach(hari => {
            let configsJamIni = waktuArray.filter(w => w.jam === jamStr);
            let configAktif = configsJamIni.find(w => w.targetHari && w.targetHari.includes(hari)) || configsJamIni.find(w => !w.targetHari || w.targetHari === "");

            if (!configAktif) { let tdKosong = document.createElement('td'); tdKosong.colSpan = kelasArray.length; tdKosong.className = `theme-${hari} td-disabled`; tdKosong.innerHTML = '-'; tr.appendChild(tdKosong); return; }

            if (configAktif.tipe === "istirahat" || configAktif.tipe === "kegiatan") {
                let tdIstirahat = document.createElement('td'); tdIstirahat.colSpan = kelasArray.length; tdIstirahat.textContent = configAktif.label;
                if(configAktif.tipe === "kegiatan") tdIstirahat.setAttribute('style', 'background-color:#e0f2fe !important; color:#0369a1 !important; font-weight:900; letter-spacing:2px;');
                else tdIstirahat.setAttribute('style', 'background-color:#f3f4f6 !important; color:#4b5563 !important; font-weight:900; letter-spacing:4px;');
                tr.appendChild(tdIstirahat);
            } else { 
                kelasArray.forEach(kls => {
                    let tdInput = document.createElement('td'); tdInput.className = `theme-${hari}`;
                    let targetArray = configAktif.targetKelas ? configAktif.targetKelas.split(',').map(x=>x.trim()) : [];
                    let isTargeted = targetArray.length === 0 || targetArray.includes(kls);

                    if (!isTargeted) { tdInput.className += ' td-disabled'; tdInput.innerHTML = '✕'; } 
                    else {
                        let inputEl = document.createElement('input'); inputEl.type = 'text'; inputEl.className = 'input-kode'; inputEl.dataset.hari = hari; inputEl.dataset.jam = jamStr; inputEl.dataset.kelas = kls;
                        if(memoriJadwal[hari] && memoriJadwal[hari][jamStr] && memoriJadwal[hari][jamStr][kls]) { inputEl.value = memoriJadwal[hari][jamStr][kls]; inputEl.setAttribute('value', memoriJadwal[hari][jamStr][kls]); }
                        inputEl.addEventListener('change', function() { validasiBentrok(this); });
                        tdInput.appendChild(inputEl);
                    }
                    tr.appendChild(tdInput);
                });
            }
        });
        tbody.appendChild(tr);
    });
}

function renderSeluruhSistem() { renderMasterLists(); renderTabelJadwal(); }

function validasiBentrok(inputAktif) {
    let rawValue = inputAktif.value.trim().toUpperCase();
    inputAktif.value = rawValue; inputAktif.setAttribute('value', rawValue);
    
    let hariAktif = inputAktif.dataset.hari; let jamAktif = inputAktif.dataset.jam; let kelasAktif = inputAktif.dataset.kelas;
    if(!memoriJadwal[hariAktif]) memoriJadwal[hariAktif] = {}; if(!memoriJadwal[hariAktif][jamAktif]) memoriJadwal[hariAktif][jamAktif] = {};
    memoriJadwal[hariAktif][jamAktif][kelasAktif] = rawValue;

    if (!rawValue) { inputAktif.classList.remove('error'); return; }

    let kodeGuru = rawValue.replace(/[^0-9]/g, ''); 
    if(!kodeGuru) return; 

    let namaGuru = dbGuru[kodeGuru] || `Guru (${kodeGuru})`;
    let semuaInputDiJamSama = document.querySelectorAll(`.input-kode[data-hari="${hariAktif}"][data-jam="${jamAktif}"]`);
    
    let isBentrok = false; let kelasBentrok = "";
    semuaInputDiJamSama.forEach(inpLain => {
        if (inpLain !== inputAktif) {
            let kodeLain = inpLain.value.trim().toUpperCase(); let angkaLain = kodeLain.replace(/[^0-9]/g, ''); 
            if (kodeLain !== "" && angkaLain === kodeGuru) { isBentrok = true; kelasBentrok = inpLain.dataset.kelas; }
        }
    });

    if (isBentrok) {
        let toast = document.getElementById("toast-bentrok"); document.getElementById("toast-pesan").textContent = `Bapak/Ibu ${namaGuru} sudah ada jadwal di Kelas ${kelasBentrok} pada hari ${hariAktif} jam ${jamAktif}.`;
        toast.classList.add("show"); setTimeout(() => { toast.classList.remove("show"); }, 5000);
        
        inputAktif.classList.add('error');
        setTimeout(() => { inputAktif.value = ''; inputAktif.setAttribute('value', ''); memoriJadwal[hariAktif][jamAktif][kelasAktif] = ''; inputAktif.classList.remove('error'); inputAktif.focus(); }, 2000);
    } else { inputAktif.classList.remove('error'); }
}
