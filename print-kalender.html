<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Print Kalender Sekolah</title>
    <style>
        /* WAJIB AGAR WARNA BACKGROUND IKUT TERCETAK DI PDF */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        
        :root {
            --green: #10b981; --green2: #047857;
            --pink: #f472b6; --purple: #a78bfa;
            --blue: #38bdf8; --amber: #f59e0b;
            --text: #2c2c2c;
        }

        @page { size: 210mm 330mm; margin: 8mm 10mm; }
        
        body { font-family: 'Arial', sans-serif; background: white; margin: 0; padding: 0; color: var(--text); }
        
        /* KUNCI HALAMAN AGAR TIDAK TUMPAH KE BAWAH (F4) */
        .halaman-f4 { 
            width: 100%; 
            height: 314mm; max-height: 314mm; 
            display: flex; flex-direction: column; 
            page-break-after: always; 
            overflow: hidden; 
            box-sizing: border-box;
        }
        
        .header { text-align: center; border-bottom: 3px double var(--green2); margin-bottom: 4mm; padding-bottom: 2mm; flex-shrink: 0; }
        .header h1 { color: var(--green2); margin:0; font-size: 20px; font-family: 'Georgia', serif; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;}
        .header h2 { color: var(--green); margin: 2px 0 0 0; font-size: 13px; letter-spacing: 2px; }

        /* GRID KALENDER DI BAGIAN ATAS (3 BARIS x 2 KOLOM) */
        .grid-kalender { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 4mm 6mm; flex: 1; }
        
        .kotak-bulan { border: 2px solid #e5e7eb; border-radius: 10px; padding: 3mm; background: #fafafa; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.02); overflow: hidden; }
        .kotak-bulan h3 { text-align: center; margin: 0 0 2mm 0; color: var(--green2); font-family: 'Georgia', serif; font-size: 14px; font-weight: 900; text-transform: uppercase;}
        
        .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 9.5px; font-weight: bold; color: #6b7280; margin-bottom: 2px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: 10.5px; font-weight: bold; text-align: center; }
        
        .cal-day { padding: 2px 0; border-radius: 4px; background: white; border: 1px solid #f3f4f6; color: #4b5563; }
        .cal-day.muted { background: transparent; border: none; }
        
        .cal-day.is-libur { background: #fee2e2 !important; color: #dc2626 !important; border-color: #fca5a5 !important; }
        .cal-day.has-agenda { border-bottom: 2.5px solid var(--amber) !important; color: var(--text); }
        .cal-day.has-ujian { border-bottom: 2.5px solid var(--pink) !important; color: var(--text); }

        /* LIST AGENDA DI DALAM KOTAK BULAN */
        .agenda-list-wrap { 
            margin-top: 3mm; border-top: 1.5px dashed #d1d5db; padding-top: 2.5mm; 
            display: flex; flex-direction: column; gap: 2.5px; flex: 1; overflow: hidden; 
        }
        
        .agenda-item { 
            background: white; border: 1px solid #e5e7eb; border-left: 3px solid; 
            padding: 1.5mm 2.5mm; border-radius: 4px; 
            display: flex; flex-direction: column; gap: 1.5px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .agenda-item.kat-kegiatan { border-left-color: var(--amber); }
        .agenda-item.kat-ujian    { border-left-color: var(--pink); background: rgba(244,114,182,0.05) !important; }
        .agenda-item.kat-libur    { border-left-color: #ef4444; background: rgba(239,68,68,0.05) !important; }
        
        /* Font diperkecil tapi tetap tebal agar muat banyak dan tajam saat diprint */
        .agenda-date { font-weight: 900; font-size: 7.5px; color: #4b5563; display: flex; align-items: center; justify-content: space-between;}
        .agenda-name { font-weight: bold; font-size: 9px; color: var(--text); line-height: 1.15;}
        
        .badge-kategori { font-size: 5px; padding: 1.5px 3px; border-radius: 2px; color: white; display: inline-block; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;}
        .badge-kategori.kegiatan { background: var(--amber) !important; }
        .badge-kategori.ujian    { background: var(--pink) !important; }
        .badge-kategori.libur    { background: #ef4444 !important; }

        .btn-print { position:fixed; top:20px; right:20px; padding:10px 20px; background:#10b981; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; box-shadow: 0 4px 12px rgba(16,185,129,0.3); z-index: 999; }
        .btn-print:hover { background: #059669; }
        
        #loading-screen { position: fixed; top:0; left:0; width: 100vw; height: 100vh; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        
        @media print { 
            .btn-print { display: none !important; } 
            body { background: white; }
        }
    </style>
</head>
<body>
    
    <div id="loading-screen">
        <h2 style="color: #047857; font-family: 'Georgia', serif;">⏳ Menyiapkan Dokumen Kalender...</h2>
        <p style="color: #6b7280;">Mengambil data dan menyusun agenda, mohon tunggu sebentar.</p>
    </div>

    <button class="btn-print" onclick="window.print()">🖨️ CETAK / SAVE AS PDF</button>
    
    <div id="cetak-area"></div>

    <script>
        function pad2(n){ return String(n).padStart(2,'0'); }

        function parseYMD(ymd) {
            const parts = ymd.split('-');
            return new Date(parts[0], parseInt(parts[1])-1, parts[2]);
        }

        function isNextDay(dateStr1, dateStr2) {
            let d1 = parseYMD(dateStr1);
            let d2 = parseYMD(dateStr2);
            d1.setDate(d1.getDate() + 1);
            return d1.getTime() === d2.getTime();
        }

        // Format tanggal ringkas karena sudah ada di dalam kotak bulannya
        function formatRangeSingkat(startStr, endStr) {
            let d1 = parseYMD(startStr);
            let d2 = parseYMD(endStr);
            if (startStr === endStr) {
                return `${d1.getDate()}`;
            } else {
                return `${d1.getDate()} - ${d2.getDate()}`;
            }
        }

        // Grouping agenda yang tanggalnya berurutan dan memiliki kategori/nama sama
        function groupAgendas(agendaList) {
            agendaList.sort((a,b) => a.tanggalBersih.localeCompare(b.tanggalBersih));
            let grouped = [];
            let current = null;

            agendaList.forEach(ag => {
                let cat = ag.kategori || 'Kegiatan Sekolah';
                let name = ag.kegiatan || '';
                if(name.includes('|||')) {
                    let parts = name.split('|||');
                    cat = parts[0];
                    name = parts.slice(1).join('|||');
                }

                if (!current) {
                    current = { start: ag.tanggalBersih, end: ag.tanggalBersih, cat: cat, name: name };
                } else {
                    if (current.cat === cat && current.name === name && isNextDay(current.end, ag.tanggalBersih)) {
                        current.end = ag.tanggalBersih;
                    } else {
                        grouped.push(current);
                        current = { start: ag.tanggalBersih, end: ag.tanggalBersih, cat: cat, name: name };
                    }
                }
            });
            if (current) grouped.push(current);
            return grouped;
        }

        async function loadPrintData() {
            const urlParams = new URLSearchParams(window.location.search);
            let start = urlParams.get('start');
            let end = urlParams.get('end');
            
            if(!start || !end) {
                const today = new Date();
                start = `${today.getFullYear()}-${pad2(today.getMonth()+1)}`;
                today.setMonth(today.getMonth() + 5);
                end = `${today.getFullYear()}-${pad2(today.getMonth()+1)}`;
            }

            let currDate = new Date(start + '-01');
            let endDate = new Date(end + '-01');

            let monthsData = [];
            while(currDate <= endDate) {
                monthsData.push(new Date(currDate));
                currDate.setMonth(currDate.getMonth() + 1);
            }

            try {
                const res = await fetch('https://script.google.com/macros/s/AKfycby4w7PBty7uJpJh-2jOZZePkjyx5y36VsEniHchw4f44ogYQdfiIe14TKQKUfU7o36hJA/exec?action=get_agenda');
                const json = await res.json();
                
                const globalAgenda = json.data.map(item => {
                    let tgl = item.tanggal ? String(item.tanggal).replace(/['"]/g, '').trim() : "";
                    if (tgl.length > 10) tgl = tgl.substring(0, 10);
                    return { ...item, tanggalBersih: tgl };
                });

                const chunks = [];
                for(let i=0; i<monthsData.length; i+=6) {
                    chunks.push(monthsData.slice(i, i+6));
                }

                const cetakArea = document.getElementById('cetak-area');
                cetakArea.innerHTML = ''; 

                chunks.forEach(chunk => {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'halaman-f4';
                    
                    pageDiv.innerHTML = `
                        <div class="header">
                            <h1>Kalender Kegiatan Sekolah</h1>
                            <h2>SDIT HIDAYATUT TAUFIQ</h2>
                        </div>
                    `;

                    const gridKalender = document.createElement('div');
                    gridKalender.className = 'grid-kalender';

                    chunk.forEach(dateObj => {
                        const y = dateObj.getFullYear();
                        const m = dateObj.getMonth();
                        const targetMonthStr = `${y}-${pad2(m+1)}`;
                        const agendanyaBulanIni = globalAgenda.filter(a => a.tanggalBersih && a.tanggalBersih.startsWith(targetMonthStr));

                        renderBulan(dateObj, agendanyaBulanIni, gridKalender);
                    });
                    
                    pageDiv.appendChild(gridKalender);
                    cetakArea.appendChild(pageDiv);
                });

                document.getElementById('loading-screen').style.display = 'none';
                
                // Memicu jendela print saat load selesai 
                setTimeout(() => { window.print(); }, 500);

            } catch (err) {
                document.getElementById('loading-screen').innerHTML = `<h2 style="color:red;">❌ Gagal mengambil data. Periksa koneksi internet.</h2>`;
            }
        }

        function renderBulan(date, agendaBulanIni, container) {
            const y = date.getFullYear(); const m = date.getMonth();
            const lastDay = new Date(y, m+1, 0).getDate();
            const firstDayIdx = (new Date(y, m, 1).getDay() + 6) % 7; 
            
            const monthName = new Intl.DateTimeFormat('id-ID', { month:'long', year:'numeric' }).format(date);
            
            let html = `<div class="kotak-bulan">`;
            html += `<h3>${monthName}</h3>`;
            
            // Urutan Hari mulai dari Senin
            html += `<div class="cal-weekdays"><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div style="color:#ef4444;">Sab</div><div style="color:#ef4444;">Min</div></div>`;
            html += `<div class="cal-grid">`;

            for(let i=0; i<firstDayIdx; i++) { html += `<div class="cal-day muted"></div>`; }

            for(let d=1; d<=lastDay; d++) {
                const dayOfWeek = new Date(y, m, d).getDay();
                let extraClass = '';
                if(dayOfWeek === 0 || dayOfWeek === 6) extraClass = 'is-libur';

                const tglStr = `${y}-${pad2(m+1)}-${pad2(d)}`;
                const agendaHariIni = agendaBulanIni.filter(a => a.tanggalBersih === tglStr);
                
                if(agendaHariIni.length > 0) {
                    let isLiburNasional = false, isUjian = false, isKegiatan = false;
                    agendaHariIni.forEach(a => {
                        let kat = a.kategori || 'Kegiatan Sekolah';
                        if (a.kegiatan && a.kegiatan.includes('|||')) kat = a.kegiatan.split('|||')[0];
                        if(kat === 'Libur Nasional') isLiburNasional = true;
                        else if(kat === 'Ujian Sekolah') isUjian = true;
                        else isKegiatan = true;
                    });
                    
                    if(isLiburNasional) extraClass = 'is-libur';
                    else if(isUjian) extraClass += ' has-ujian';
                    else extraClass += ' has-agenda';
                }
                html += `<div class="cal-day ${extraClass}">${d}</div>`;
            }
            html += `</div>`; // End cal-grid

            // RENDER LIST AGENDA DI BAWAH KALENDER (DENGAN GROUPING)
            const grouped = groupAgendas(agendaBulanIni);
            html += `<div class="agenda-list-wrap">`;
            
            if (grouped.length > 0) {
                grouped.forEach(ag => {
                    let katClass = 'kat-kegiatan', badgeClass = 'kegiatan';
                    if(ag.cat === 'Ujian Sekolah') { katClass = 'kat-ujian'; badgeClass = 'ujian'; }
                    if(ag.cat === 'Libur Nasional') { katClass = 'kat-libur'; badgeClass = 'libur'; }

                    const stringTanggalSingkat = formatRangeSingkat(ag.start, ag.end);

                    html += `
                        <div class="agenda-item ${katClass}">
                            <div class="agenda-date">
                                <span>🗓️ Tgl: ${stringTanggalSingkat}</span>
                                <span class="badge-kategori ${badgeClass}">${ag.cat}</span>
                            </div>
                            <div class="agenda-name">${ag.name}</div>
                        </div>
                    `;
                });
            } else {
                html += `<div style="text-align: center; color: #9ca3af; font-style: italic; font-size: 8px; margin-top: 4px;">Tidak ada agenda</div>`;
            }

            html += `</div></div>`; // End agenda-list-wrap & kotak-bulan
            container.innerHTML += html;
        }

        loadPrintData();
    </script>
</body>
</html>
