<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Print Kalender Sekolah</title>
    <style>
        /* WAJIB AGAR WARNA BACKGROUND IKUT TERCETAK DI PDF */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        
        :root {
            --green: #10b981; --green2: #047857;
            --pink: #f472b6; --purple: #a78bfa;
            --blue: #38bdf8; --amber: #f59e0b;
            --text: #2c2c2c;
        }

        @page { size: 210mm 330mm; margin: 10mm 15mm; }
        
        body { font-family: 'Arial', sans-serif; background: white; margin: 0; padding: 0; color: var(--text); }
        
        .halaman-f4 { width: 180mm; margin: 0 auto; height: 310mm; display: flex; flex-direction: column; page-break-after: always; padding-top: 5mm;}
        
        .header { text-align: center; border-bottom: 4px double var(--green2); margin-bottom: 6mm; padding-bottom: 4mm; flex-shrink: 0; }
        .header h1 { color: var(--green2); margin:0; font-size: 24px; font-family: 'Georgia', serif; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;}
        .header h2 { color: var(--green); margin: 4px 0 0 0; font-size: 16px; letter-spacing: 2px; }

        /* GRID KALENDER DI BAGIAN ATAS */
        .grid-kalender { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm 8mm; margin-bottom: 8mm; }
        
        .kotak-bulan { border: 2px solid #e5e7eb; border-radius: 12px; padding: 4mm; background: #fafafa; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.02); overflow: hidden; }
        .kotak-bulan h3 { text-align: center; margin: 0 0 3mm 0; color: var(--green2); font-family: 'Georgia', serif; font-size: 16px; font-weight: 900; text-transform: uppercase;}
        
        .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: bold; color: #6b7280; margin-bottom: 4px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; font-size: 12px; font-weight: bold; text-align: center; }
        
        .cal-day { padding: 4px 0; border-radius: 6px; background: white; border: 1px solid #f3f4f6; color: #4b5563; }
        .cal-day.muted { background: transparent; border: none; }
        
        /* Kategori Tanggalan */
        .cal-day.is-libur { background: #fee2e2 !important; color: #dc2626 !important; border-color: #fca5a5 !important; }
        .cal-day.has-agenda { border-bottom: 3px solid var(--amber) !important; color: var(--text); }
        .cal-day.has-ujian { border-bottom: 3px solid var(--pink) !important; color: var(--text); }

        /* REKAP AGENDA DI BAGIAN BAWAH */
        .rekap-agenda-container { flex: 1; border-top: 3px double var(--green2); padding-top: 4mm; display: flex; flex-direction: column;}
        .rekap-title { text-align: center; color: var(--green2); font-family: 'Georgia', serif; font-size: 15px; font-weight: 900; margin-bottom: 4mm; text-transform: uppercase; letter-spacing: 1px;}
        .rekap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm 6mm; align-content: start;}
        
        .rekap-item { background: #f9fafb; border: 1px solid #e5e7eb; border-left: 4px solid; padding: 3mm 4mm; border-radius: 8px; display: flex; flex-direction: column; gap: 3px; }
        .rekap-item.kat-kegiatan { border-left-color: var(--amber); }
        .rekap-item.kat-ujian    { border-left-color: var(--pink); background: rgba(244,114,182,0.05) !important; }
        .rekap-item.kat-libur    { border-left-color: #ef4444; background: rgba(239,68,68,0.05) !important; }
        
        .rekap-date { font-weight: 900; font-size: 11px; color: #4b5563; display: flex; align-items: center; justify-content: space-between;}
        .rekap-name { font-weight: bold; font-size: 13px; color: var(--text); line-height: 1.3;}
        
        .badge-kategori { font-size: 8px; padding: 2px 6px; border-radius: 4px; color: white; display: inline-block; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;}
        .badge-kategori.kegiatan { background: var(--amber) !important; }
        .badge-kategori.ujian    { background: var(--pink) !important; }
        .badge-kategori.libur    { background: #ef4444 !important; }

        .btn-print { position:fixed; top:20px; right:20px; padding:12px 24px; background:#10b981; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; box-shadow: 0 4px 12px rgba(16,185,129,0.3); z-index: 999; }
        .btn-print:hover { background: #059669; }
        
        /* Loading Screen */
        #loading-screen { position: fixed; top:0; left:0; width: 100vw; height: 100vh; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        
        @media print { 
            .btn-print { display: none !important; } 
            body { background: white; }
        }
    </style>
</head>
<body>
    
    <div id="loading-screen">
        <h2 style="color: #047857; font-family: 'Georgia', serif;">⏳ Menyiapkan Dokumen Kalender...</h2>
        <p style="color: #6b7280;">Mengambil data dan menyusun agenda, mohon tunggu sebentar.</p>
    </div>

    <button class="btn-print" onclick="window.print()">🖨️ CETAK / SAVE AS PDF</button>
    
    <div id="cetak-area">
        </div>

    <script>
        function pad2(n){ return String(n).padStart(2,'0'); }

        // FUNGSI HELPER UNTUK TANGGAL (MEMBANTU GROUPING)
        function parseYMD(ymd) {
            const parts = ymd.split('-');
            return new Date(parts[0], parseInt(parts[1])-1, parts[2]);
        }

        function isNextDay(dateStr1, dateStr2) {
            let d1 = parseYMD(dateStr1);
            let d2 = parseYMD(dateStr2);
            d1.setDate(d1.getDate() + 1);
            return d1.getTime() === d2.getTime();
        }

        function formatRange(startStr, endStr) {
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            let d1 = parseYMD(startStr);
            let d2 = parseYMD(endStr);
            
            if (startStr === endStr) {
                return `${d1.getDate()} ${months[d1.getMonth()]} ${d1.getFullYear()}`;
            }
            
            if (d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear()) {
                return `${d1.getDate()} - ${d2.getDate()} ${months[d1.getMonth()]} ${d1.getFullYear()}`;
            } else if (d1.getFullYear() === d2.getFullYear()) {
                return `${d1.getDate()} ${months[d1.getMonth()]} - ${d2.getDate()} ${months[d2.getMonth()]} ${d1.getFullYear()}`;
            } else {
                return `${d1.getDate()} ${months[d1.getMonth()]} ${d1.getFullYear()} - ${d2.getDate()} ${months[d2.getMonth()]} ${d2.getFullYear()}`;
            }
        }

        async function loadPrintData() {
            const urlParams = new URLSearchParams(window.location.search);
            let start = urlParams.get('start');
            let end = urlParams.get('end');
            
            if(!start || !end) {
                const today = new Date();
                start = `${today.getFullYear()}-${pad2(today.getMonth()+1)}`;
                today.setMonth(today.getMonth() + 5);
                end = `${today.getFullYear()}-${pad2(today.getMonth()+1)}`;
            }

            let currDate = new Date(start + '-01');
            let endDate = new Date(end + '-01');

            let monthsData = [];
            while(currDate <= endDate) {
                monthsData.push(new Date(currDate));
                currDate.setMonth(currDate.getMonth() + 1);
            }

            try {
                const res = await fetch('https://script.google.com/macros/s/AKfycbw72VAmuae0gBueTndaZpL8NrUJkl2K1M-lVpMJSUsMKBjo1o6Bafc5mdrzJXOH7toQBg/exec?action=get_agenda');
                const json = await res.json();
                
                const globalAgenda = json.data.map(item => {
                    let tgl = item.tanggal ? String(item.tanggal).replace(/['"]/g, '').trim() : "";
                    if (tgl.length > 10) tgl = tgl.substring(0, 10);
                    return { ...item, tanggalBersih: tgl };
                });

                const chunks = [];
                for(let i=0; i<monthsData.length; i+=6) {
                    chunks.push(monthsData.slice(i, i+6));
                }

                const cetakArea = document.getElementById('cetak-area');
                cetakArea.innerHTML = ''; 

                chunks.forEach(chunk => {
                    // Buat 1 Halaman F4
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'halaman-f4';
                    
                    // HEADER
                    pageDiv.innerHTML = `
                        <div class="header">
                            <h1>Kalender Kegiatan Sekolah</h1>
                            <h2>SDIT HIDAYATUT TAUFIQ</h2>
                        </div>
                    `;

                    // BAGIAN 1: KALENDER KOTAK (6 BULAN)
                    const gridKalender = document.createElement('div');
                    gridKalender.className = 'grid-kalender';

                    // Kumpulkan agenda khusus di 6 bulan ini
                    let chunkAgendas = [];

                    chunk.forEach(dateObj => {
                        const y = dateObj.getFullYear();
                        const m = dateObj.getMonth();
                        const targetMonthStr = `${y}-${pad2(m+1)}`;
                        
                        const agendanyaBulanIni = globalAgenda.filter(a => a.tanggalBersih && a.tanggalBersih.startsWith(targetMonthStr));
                        chunkAgendas = chunkAgendas.concat(agendanyaBulanIni);

                        // Render kotak kalender tanpa daftar agenda di dalamnya
                        renderBulan(dateObj, agendanyaBulanIni, gridKalender);
                    });
                    
                    pageDiv.appendChild(gridKalender);

                    // BAGIAN 2: LOGIKA GROUPING (MENGGABUNGKAN TANGGAL)
                    chunkAgendas.sort((a,b) => a.tanggalBersih.localeCompare(b.tanggalBersih));
                    
                    let groupedAgendas = [];
                    let currentGroup = null;

                    chunkAgendas.forEach(ag => {
                        let cat = ag.kategori || 'Kegiatan Sekolah';
                        let name = ag.kegiatan || '';
                        if(name.includes('|||')) {
                            let parts = name.split('|||');
                            cat = parts[0];
                            name = parts.slice(1).join('|||');
                        }

                        if (!currentGroup) {
                            currentGroup = { start: ag.tanggalBersih, end: ag.tanggalBersih, cat: cat, name: name };
                        } else {
                            // Jika kategori & nama SAMA, dan tanggalnya BERSEBELAHAN, gabungkan!
                            if (currentGroup.cat === cat && currentGroup.name === name && isNextDay(currentGroup.end, ag.tanggalBersih)) {
                                currentGroup.end = ag.tanggalBersih;
                            } else {
                                groupedAgendas.push(currentGroup);
                                currentGroup = { start: ag.tanggalBersih, end: ag.tanggalBersih, cat: cat, name: name };
                            }
                        }
                    });
                    if (currentGroup) groupedAgendas.push(currentGroup);


                    // BAGIAN 3: RENDER REKAP AGENDA DI BAWAH
                    const rekapContainer = document.createElement('div');
                    rekapContainer.className = 'rekap-agenda-container';
                    rekapContainer.innerHTML = `<div class="rekap-title">Rincian Agenda Kegiatan</div>`;
                    
                    const rekapGrid = document.createElement('div');
                    rekapGrid.className = 'rekap-grid';

                    if (groupedAgendas.length > 0) {
                        groupedAgendas.forEach(ag => {
                            let katClass = 'kat-kegiatan', badgeClass = 'kegiatan';
                            if(ag.cat === 'Ujian Sekolah') { katClass = 'kat-ujian'; badgeClass = 'ujian'; }
                            if(ag.cat === 'Libur Nasional') { katClass = 'kat-libur'; badgeClass = 'libur'; }

                            // Format tanggal pintar (misal: 8 - 9 Juli 2026)
                            const stringTanggal = formatRange(ag.start, ag.end);

                            rekapGrid.innerHTML += `
                                <div class="rekap-item ${katClass}">
                                    <div class="rekap-date">
                                        <span>🗓️ ${stringTanggal}</span>
                                        <span class="badge-kategori ${badgeClass}">${ag.cat}</span>
                                    </div>
                                    <div class="rekap-name">${ag.name}</div>
                                </div>
                            `;
                        });
                    } else {
                        rekapGrid.innerHTML = `<div style="grid-column: 1 / span 2; text-align: center; color: #9ca3af; font-style: italic;">Tidak ada agenda di rentang bulan ini.</div>`;
                    }

                    rekapContainer.appendChild(rekapGrid);
                    pageDiv.appendChild(rekapContainer);

                    cetakArea.appendChild(pageDiv);
                });

                document.getElementById('loading-screen').style.display = 'none';

            } catch (err) {
                document.getElementById('loading-screen').innerHTML = `<h2 style="color:red;">❌ Gagal mengambil data. Periksa koneksi internet.</h2>`;
            }
        }

        // FUNGSI RENDER HANYA KOTAK KALENDER SAJA (Tanpa Teks Agenda)
        function renderBulan(date, agendaBulanIni, container) {
            const y = date.getFullYear(); const m = date.getMonth();
            const lastDay = new Date(y, m+1, 0).getDate();
            const firstDayIdx = (new Date(y, m, 1).getDay() + 6) % 7; 
            
            const monthName = new Intl.DateTimeFormat('id-ID', { month:'long', year:'numeric' }).format(date);
            
            let html = `<div class="kotak-bulan">`;
            html += `<h3>${monthName}</h3>`;
            html += `<div class="cal-weekdays"><div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div style="color:#ef4444;">Sab</div></div>`;
            html += `<div class="cal-grid">`;

            for(let i=0; i<firstDayIdx; i++) { html += `<div class="cal-day muted"></div>`; }

            for(let d=1; d<=lastDay; d++) {
                const dayOfWeek = new Date(y, m, d).getDay();
                let extraClass = '';
                if(dayOfWeek === 0 || dayOfWeek === 6) extraClass = 'is-libur';

                const tglStr = `${y}-${pad2(m+1)}-${pad2(d)}`;
                const agendaHariIni = agendaBulanIni.filter(a => a.tanggalBersih === tglStr);
                
                if(agendaHariIni.length > 0) {
                    let isLiburNasional = false, isUjian = false, isKegiatan = false;
                    agendaHariIni.forEach(a => {
                        let kat = a.kategori || 'Kegiatan Sekolah';
                        if (a.kegiatan && a.kegiatan.includes('|||')) kat = a.kegiatan.split('|||')[0];
                        if(kat === 'Libur Nasional') isLiburNasional = true;
                        else if(kat === 'Ujian Sekolah') isUjian = true;
                        else isKegiatan = true;
                    });
                    
                    if(isLiburNasional) extraClass = 'is-libur';
                    else if(isUjian) extraClass += ' has-ujian';
                    else extraClass += ' has-agenda';
                }
                html += `<div class="cal-day ${extraClass}">${d}</div>`;
            }
            html += `</div></div>`; 
            container.innerHTML += html;
        }

        loadPrintData();
    </script>
</body>
</html>
