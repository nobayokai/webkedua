<div class="form-container">
    <h2>Formulir Pendaftaran Siswa Baru</h2>
    <p><strong>Sesuai Format F-PD (Peserta Didik)</strong></p>

    <form id="formSiswaBaru" onsubmit="submitFormSiswaBaru(event)">

        <!-- DATA PRIBADI -->
        <h3 class="section-title">DATA PRIBADI</h3>

        <div class="form-row">
            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama_lengkap" required>
            </div>
            <div class="input-group">
                <label>Jenis Kelamin</label>
                <select id="jenis_kelamin" required>
                    <option value="">Pilih</option>
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="input-group"><label>NISN</label><input type="text" id="nisn"></div>
            <div class="input-group"><label>NIK / No. KITAS</label><input type="text" id="nik" required></div>
        </div>

        <div class="form-row">
            <div class="input-group"><label>No KK</label><input type="text" id="no_kk"></div>
            <div class="input-group"><label>No Registrasi Akta Lahir</label><input type="text" id="no_reg_akta"></div>
        </div>

        <div class="form-row">
            <div class="input-group"><label>Tempat Lahir</label><input type="text" id="tempat_lahir" required></div>
            <div class="input-group"><label>Tanggal Lahir</label><input type="date" id="tanggal_lahir" required></div>
        </div>

        <div class="form-row">
            <div class="input-group">
                <label>Agama</label>
                <select id="agama" required>
                    <option value="">Pilih</option>
                    <option value="Islam">Islam</option>
                    <option value="Kristen/Protestan">Kristen/Protestan</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Budha">Budha</option>
                    <option value="Konghucu">Konghucu</option>
                    <option value="Kepercayaan Kepada Tuhan YME">Kepercayaan Kepada Tuhan YME</option>
                </select>
            </div>
            <div class="input-group">
                <label>Kewarganegaraan</label>
                <select id="kewarganegaraan" required>
                    <option value="WNI">WNI</option>
                    <option value="WNA">WNA</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>Berkebutuhan Khusus</label>
            <select id="kebutuhan_khusus">
                <option value="Tidak">Tidak</option>
                <option value="Autis (Q)">Autis (Q)</option>
                <option value="Netra (A)">Netra (A)</option>
                <option value="Rungu (B)">Rungu (B)</option>
            </select>
        </div>

        <!-- ALAMAT -->
        <h3 class="section-title">ALAMAT TEMPAT TINGGAL</h3>
        <div class="input-group"><label>Alamat Jalan</label><input type="text" id="alamat" required></div>

        <div class="form-row">
            <div class="input-group"><label>RT</label><input type="text" id="rt"></div>
            <div class="input-group"><label>RW</label><input type="text" id="rw"></div>
            <div class="input-group"><label>Nama Dusun</label><input type="text" id="nama_dusun"></div>
        </div>

        <div class="form-row">
            <div class="input-group"><label>Kelurahan/Desa</label><input type="text" id="kelurahan"></div>
            <div class="input-group"><label>Kecamatan</label><input type="text" id="kecamatan"></div>
            <div class="input-group"><label>Kode Pos</label><input type="text" id="kode_pos"></div>
        </div>

        <!-- LOKASI TEMPAT TINGGAL -->
<h3 class="section-title">LOKASI TEMPAT TINGGAL</h3>

<p>Klik pada peta untuk menandai lokasi rumah:</p>
<div id="map" style="height: 320px; width: 100%; background: #e9e9e9; margin-bottom: 15px;"></div>
<button type="button" class="btn-submit" style="background-color: #28a745; margin-bottom: 15px; width: auto; padding: 8px 15px; font-size: 14px;" onclick="deteksiLokasiSaya()">📍 Gunakan Lokasi Saat Ini</button>
<div class="form-row">
    <div class="input-group">
        <label>Lintang (Latitude)</label>
        <input type="text" id="latitude" placeholder="Latitude" readonly>
    </div>
    <div class="input-group">
        <label>Bujur (Longitude)</label>
        <input type="text" id="longitude" placeholder="Longitude" readonly>
    </div>
</div>


        <!-- TEMPAT TINGGAL & TRANSPORTASI -->
        <div class="form-row">
            <div class="input-group">
                <label>Tempat Tinggal</label>
                <select id="tempat_tinggal" required>
                    <option value="">Pilih</option>
                    <option value="Bersama orang tua">Bersama orang tua</option>
                    <option value="Wali">Wali</option>
                    <option value="Kos">Kos</option>
                    <option value="Asrama">Asrama</option>
                    <option value="Panti Asuhan">Panti Asuhan</option>
                </select>
            </div>
            <div class="input-group">
                <label>Moda Transportasi</label>
                <select id="moda_transportasi" required>
                    <option value="">Pilih</option>
                    <option value="Jalan kaki">Jalan kaki</option>
                    <option value="Kendaraan pribadi">Kendaraan pribadi</option>
                    <option value="Kendaraan Umum/angkot">Kendaraan Umum/angkot</option>
                    <option value="Jemputan Sekolah">Jemputan Sekolah</option>
                    <option value="Ojek">Ojek</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
        </div>

        <!-- DATA AYAH KANDUNG -->
        <h3 class="section-title">DATA AYAH KANDUNG</h3>
        <div class="form-row">
            <div class="input-group"><label>Nama Ayah Kandung</label><input type="text" id="nama_ayah"></div>
            <div class="input-group"><label>NIK Ayah</label><input type="text" id="nik_ayah"></div>
        </div>
        <div class="form-row">
            <div class="input-group"><label>Tahun Lahir</label><input type="number" id="tahun_lahir_ayah"></div>
            <div class="input-group">
                <label>Pendidikan</label>
                <select id="pendidikan_ayah">
                    <option value="">Pilih</option>
                    <option value="SD Sederajat">SD Sederajat</option>
                    <option value="SMP Sederajat">SMP Sederajat</option>
                    <option value="SMA Sederajat">SMA Sederajat</option>
                    <option value="D3">D3</option>
                    <option value="S1">S1</option>
                    <option value="S2">S2</option>
                </select>
            </div>
        </div>

        <!-- DATA IBU KANDUNG -->
        <h3 class="section-title">DATA IBU KANDUNG</h3>
        <div class="form-row">
            <div class="input-group"><label>Nama Ibu Kandung</label><input type="text" id="nama_ibu"></div>
            <div class="input-group"><label>NIK Ibu</label><input type="text" id="nik_ibu"></div>
        </div>
        <div class="form-row">
            <div class="input-group"><label>Tahun Lahir</label><input type="number" id="tahun_lahir_ibu"></div>
            <div class="input-group">
                <label>Pendidikan</label>
                <select id="pendidikan_ibu">
                    <option value="">Pilih</option>
                    <option value="SD Sederajat">SD Sederajat</option>
                    <option value="SMP Sederajat">SMP Sederajat</option>
                    <option value="SMA Sederajat">SMA Sederajat</option>
                    <option value="S1">S1</option>
                </select>
            </div>
        </div>

        <!-- KONTAK -->
        <h3 class="section-title">KONTAK</h3>
        <div class="form-row">
            <div class="input-group"><label>Nomor HP</label><input type="tel" id="no_hp" required></div>
            <div class="input-group"><label>Email</label><input type="email" id="email"></div>
        </div>

        <!-- DATA PERIODIK -->
        <h3 class="section-title">DATA PERIODIK</h3>
        <div class="form-row">
            <div class="input-group"><label>Tinggi Badan (cm)</label><input type="number" id="tinggi_badan"></div>
            <div class="input-group"><label>Berat Badan (kg)</label><input type="number" id="berat_badan"></div>
        </div>

        <button type="submit" class="btn-submit">Kirim Pendaftaran</button>
        <p id="pesan-form"></p>
    </form>
</div>
<!-- Tambahkan di baris paling bawah formulir-siswa-baru.html -->
<script>
    setTimeout(() => {
        if (typeof initMapSiswaBaru === 'function') {
            initMapSiswaBaru();
        }
    }, 500);
</script>
